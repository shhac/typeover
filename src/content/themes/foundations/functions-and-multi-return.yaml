target: go
moduleId: foundations
title: Functions & multi-return
order: 6
prerequisites: [foundations/variables, foundations/conditionals]
intro: |
  Functions look familiar — `func name(args) returnType { ... }` — with
  one big new idea: **multiple return values**. Go functions can return
  a tuple, and the convention for "this might fail" is to return
  `(result, error)`. We'll meet `error` properly in a later module,
  but the *shape* arrives here.
