target: go
moduleId: foundations
title: Strings, bytes, runes
order: 3
prerequisites: [foundations/variables, foundations/numeric-primitives]
intro: |
  Go strings are immutable byte sequences. There are no template
  literals — `fmt.Sprintf` does the job. A `byte` is an alias for
  `uint8`; a `rune` is `int32` and represents a Unicode codepoint.
  When you range over a string, you get runes (codepoints), not
  bytes. This matters more than it sounds.
