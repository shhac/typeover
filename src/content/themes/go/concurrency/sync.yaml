target: go
moduleId: go/concurrency
title: Sync primitives
order: 4
prerequisites: [go/concurrency/channels]
intro: |
  `sync.Mutex`, `sync.RWMutex`, `sync.WaitGroup`, `sync.Once`. The
  classical concurrency toolbox. Go's culture prefers channels
  for orchestration and `sync` for protecting state. Use whichever
  makes the code clearer; don't pick a side as a religion.
