target: go
moduleId: go/foundations
title: Loops
order: 5
prerequisites: [go/foundations/variables]
intro: |
  Go has one loop keyword: `for`. Three shapes:
  - `for i := 0; i < n; i++ { ... }` — classic.
  - `for cond { ... }` — while-style.
  - `for { ... }` — infinite, exit via `break` or `return`.
  No `while`, no `do`. `continue`, `break`, and labelled breaks behave
  as you'd expect. The range form is its own theme (next module).
