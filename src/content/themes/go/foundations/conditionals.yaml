target: go
moduleId: go/foundations
title: Conditionals & switch
order: 4
prerequisites: [go/foundations/variables]
intro: |
  `if`/`else` looks familiar — no parentheses, braces required. The
  one new shape is the **short-statement-if**: `if err := work(); err != nil { ... }`.
  It scopes a temporary to the condition; you'll see this everywhere
  in Go. `switch` exists and doesn't fall through by default — closer
  to TypeScript's `switch` with implicit `break` than to C's.
