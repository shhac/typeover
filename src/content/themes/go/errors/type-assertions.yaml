target: go
moduleId: go/errors
title: Type assertions & type switches
order: 3
prerequisites: [go/interfaces/interfaces]
intro: |
  `v.(T)` asserts that an interface value `v` is actually of type `T`.
  Panics if wrong. Use the comma-ok form to check first:
  `if t, ok := v.(T); ok { ... }`. For multi-branch checks,
  `switch v := i.(type)` dispatches on dynamic type.
