target: go
moduleId: go/errors
title: errors.Is and errors.As
order: 2
prerequisites: [go/errors/the-error-pattern, go/interfaces/interfaces]
intro: |
  Inspecting errors without breaking the wrap chain. `errors.Is(err,
  target)` walks the wrap chain looking for a match against a
  sentinel. `errors.As(err, &target)` walks looking for a type
  match, populating `target` if found. This is the modern,
  type-safe replacement for `instanceof` checks on errors.
