target: go
moduleId: go/errors
title: Modules & go.mod
order: 5
prerequisites: [go/errors/packages-and-imports]
intro: |
  A module is a versioned collection of packages — your project's
  unit of dependency. `go mod init github.com/you/yourthing`
  produces `go.mod`. `go get` adds deps. Module paths look like
  URLs but don't have to resolve to anything; they're identifiers.
