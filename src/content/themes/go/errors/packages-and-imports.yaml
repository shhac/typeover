target: go
moduleId: go/errors
title: Packages & imports
order: 4
prerequisites: [go/foundations/functions-and-multi-return]
intro: |
  Every file declares a package: `package foo`. Names starting with
  a **capital letter** are exported; lowercase are package-private.
  This rule is mechanical and pervasive; once you internalise it,
  you stop needing to look at `export` keywords because there aren't
  any. Imports go in a single `import (...)` block.
