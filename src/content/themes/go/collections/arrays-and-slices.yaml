target: go
moduleId: go/collections
title: Arrays vs slices
order: 1
prerequisites: [go/foundations/variables, go/foundations/numeric-primitives]
intro: |
  Go has fixed-size **arrays** (`[N]T`) and dynamically-sized
  **slices** (`[]T`). You almost always want slices. A slice is a
  view over a backing array — three machine words: pointer, length,
  capacity. `append` grows it; `make` pre-sizes it. The mental model
  is closer to Rust's `Vec` than to TS's `Array`.
