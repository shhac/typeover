target: go
moduleId: go/collections
title: Iteration with range
order: 3
prerequisites: [go/foundations/loops, go/collections/arrays-and-slices, go/collections/maps]
intro: |
  `for i, v := range collection` is the workhorse. Over a slice you
  get `(index, value)`. Over a map you get `(key, value)`. Over a
  string you get `(byteIndex, rune)`. Over a channel you get just
  the value, with no index. Use `_` to discard either side.
