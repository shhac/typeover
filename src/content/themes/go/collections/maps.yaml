target: go
moduleId: go/collections
title: Maps
order: 2
prerequisites: [go/foundations/variables, go/collections/arrays-and-slices]
intro: |
  `map[K]V`. Like a TS `Record<K, V>` or `Map<K, V>`. Lookup with
  comma-ok: `v, ok := m[key]`. Iteration order is **undefined** —
  every range yields a different ordering. Maps are reference types;
  passing a map to a function shares it.
