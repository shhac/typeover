target: go
themeId: errors/modules-and-gomod
type: mcq
order: 4
prompt: |
  Pick the line that's the FIRST line of a typical `go.mod`
  file. (`go.mod` is its own mini-language — not Go source.)

  TypeScript's `package.json` has `"name": "..."` as the
  identity field; Go's go.mod has a parallel concept with a
  shorter form.
generator:
  kind: variant
  variants:
    - id: module-directive
      ts: |-
        // TS package.json: "name": "your-thing"
        // Go go.mod:       module github.com/you/yourthing
      canonical: "module github.com/you/yourthing"
      distractors:
        - 'name: "github.com/you/yourthing"'
        - "package github.com/you/yourthing"
        - 'import "github.com/you/yourthing"'
hints:
  - "One keyword + one URL-shaped path. No quotes, no colon, no JSON-shape."
  - "Keyword is `module`. Then the path your project will be importable by."
  - "`module <path>`."
runtime: none
notes: |
  The `module` directive is the FIRST line of every go.mod.
  Followed by `go <version>` (e.g. `go 1.22`) and then
  optionally `require (...)`, `replace`, `exclude`, etc.

  Distractors:
    1. `name: "..."` — package.json shape; go.mod is space-
       separated keyword-arg pairs, not JSON or YAML.
    2. `package github.com/...` — confuses `package` (file-
       level, in .go source) with `module` (project-level,
       in go.mod). Different concept, different file.
    3. `import "..."` — imports are in .go source files, not
       in go.mod. go.mod's `require` is the closest analog
       to "what does this module depend on."
