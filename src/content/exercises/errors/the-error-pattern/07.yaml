target: go
themeId: errors/the-error-pattern
type: fill-line
order: 7
prompt: |
  The if-init form of error handling — declare + check in one
  statement. Tighter than slot 3's two-line shape, used when
  the result isn't needed after the check (just side-effects
  or a propagation-only path).

  Write the if-init line that calls `compute()` (which returns
  just `error`), binds to `err`, and bails to `return err` when
  it's non-nil.

  Expected output:
  ```
  computed
  ```
  (when compute succeeds — the if-init body is skipped, control
  falls through to the success print.)
generator:
  kind: template
  vars:
    line:
      - "if err := compute(); err != nil {"
  ts: |-
    function run(): Error | null {
      const err = compute();
      if (err) return err;
      console.log("computed");
      return null;
    }
  canonical: |-
    package main

    import "fmt"

    func compute() error {
    	return nil
    }

    func run() error {
    	${line}
    		return err
    	}
    	fmt.Println("computed")
    	return nil
    }

    func main() {
    	if err := run(); err != nil {
    		fmt.Println("failed:", err)
    	}
    }
  distractors:
    - match: "err := compute(); if err != nil {"
      explain: |-
        Two-statement form instead of the if-init compression.
        The if-init places the assignment INSIDE the if's
        first clause, separated from the condition by `;`.
        Both work; the if-init scopes `err` to the if-block
        only, keeping the outer scope clean.
    - match: "if err := compute() != nil {"
      explain: |-
        Missing the assignment + check separation. Shape is
        `if <init>; <condition> { ... }` — `;` between them.
        Without the semicolon, Go reads this as "assign
        `compute() != nil` (a bool) to err", which is a type
        error (compute returns error, not bool).
    - match: "if compute() != nil {"
      explain: |-
        Loses the error value — there's no way to RETURN it
        from inside the if-block because `err` was never
        bound. The if-init pattern's whole point is keeping
        the value handy for propagation/inspection inside the
        block.
    - match: "if err = compute(); err != nil {"
      explain: |-
        Assignment `=` instead of declaration `:=`. `=`
        requires `err` to already exist in scope; `:=`
        declares it. The if-init's left side conventionally
        declares (so the variable scopes to the if-block).
expectStdout: |
  computed
runtime: yaegi
blanks: [line]
hints:
  - "if-init shape: `if <init-stmt>; <condition> { ... }`. The init declares + assigns; the condition uses the declared var. For error handling: `if err := f(); err != nil { ... }`."
  - "`if err := compute(); err != nil {`."
  - "`if err := compute(); err != nil {`."
notes: |
  THE compressed error-handling idiom. Slot 3's three-line shape
  is for when you need the result AFTER the check; this slot's
  one-line if-init is for when you only care about the error.

  The if-init pattern carries beyond errors — same shape for
  comma-ok map lookups (Module 2.2), type assertions (theme
  4.1 slot 7), channel receives (Module 6). Once the muscle
  memory binds here, the same construct keeps showing up.

  Distractor bank covers the four most common syntax errors
  the if-init form invites:
    1. Two-statement form — works, but less idiomatic.
    2. Missing `;` — confuses parser, type error.
    3. No binding — loses the value for propagation.
    4. `=` instead of `:=` — scoping confusion.
