target: go
themeId: errors/packages-and-imports
type: mcq
order: 1
prompt: |
  Every Go file starts with a `package` declaration. Pick the
  line that declares this file as belonging to the `main`
  package — the convention for an executable's entry-point file.

  TypeScript doesn't have a package declaration concept
  (modules are file-based); Go's `package` line is mandatory
  and is the first non-comment line in every file.
generator:
  kind: variant
  variants:
    - id: main
      ts: |-
        // TS: no equivalent — files are modules implicitly.
        // Closest is `// @ts-check` or `"use strict"` at the
        // top, but package membership is structural in TS.
      canonical: "package main"
      distractors:
        - "import package main"
        - "package = main"
        - "module main"
hints:
  - "Two tokens: the keyword `package` followed by the package name. No quotes, no equals sign, no other modifiers."
  - "`package <name>`. For an entry-point binary, the name is the literal word `main`."
  - "`package main`."
runtime: none
notes: |
  Theme 5.4 opener. The `package main` declaration is the
  signal to the `go build` toolchain that this directory
  produces a binary (not a library). Combined with a `func
  main()`, it's the executable entry point.

  Distractors:
    1. `import package main` — confuses package declaration
       (this file IS in package X) with import (this file
       USES package X). They're different beats.
    2. `package = main` — TS-style assignment syntax.
       Go's declaration is whitespace-separated, no `=`.
    3. `module main` — confuses package (file-level grouping)
       with module (versioned dependency unit, covered in
       theme 5.5).
