target: go
themeId: errors/packages-and-imports
type: freeform
order: 9
prompt: |
  Theme 5.4 capstone — pull together package, import,
  capitalisation, and the package-qualified call pattern in a
  small program.

  Build a program that:
  1. `package main`.
  2. Imports `fmt`, `strings`, and `strconv`.
  3. In `func main`:
     - Convert the integer `42` to a string via
       `strconv.Itoa`.
     - Repeat that string 3 times via `strings.Repeat`.
     - Print via `fmt.Println`.

  Expected output: `424242`.

  This is the canonical "three packages working together"
  shape — the use of `strconv` introduces a third package
  while keeping the program single-file so it runs under
  Yaegi.
generator:
  kind: template
  vars: {}
  ts: |-
    console.log(String(42).repeat(3));
  canonical: |-
    package main

    import (
    	"fmt"
    	"strconv"
    	"strings"
    )

    func main() {
    	s := strconv.Itoa(42)
    	fmt.Println(strings.Repeat(s, 3))
    }
expectStdout: |
  424242
hints:
  - "Three imports, three calls: `strconv.Itoa(42)` → `strings.Repeat(s, 3)` → `fmt.Println(...)`."
  - "Import block sorted alphabetically: `fmt`, `strconv`, `strings`. All three names are exported (capital first letter)."
  - "See canonical."
runtime: yaegi
notes: |
  Theme 5.4 capstone. Three-package program — pin the idiom
  that any non-trivial Go program is structured around the
  qualified-call pattern.

  Inline alternative without the intermediate `s` variable
  also works:
  ```go
  fmt.Println(strings.Repeat(strconv.Itoa(42), 3))
  ```
  Both shapes are common in real Go; the named-variable form
  reads better for learners but the inline form is fine.
  Author chose the named form for clarity.

  Module 5 status after this slot: 4/5 themes done. Only
  5.5 (modules-and-gomod) remains, which will be MCQ-heavy
  because go.mod isn't a runnable artifact.
