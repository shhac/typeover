target: go
themeId: errors/packages-and-imports
type: mcq
order: 3
prompt: |
  Multi-package imports use the **grouped import block** form.
  Pick the idiomatic shape for importing `fmt` and `strings`.

  TS uses one `import` line per source. Go's idiom for 2+
  imports is a parenthesised block — `gofmt` enforces it, and
  the tooling sorts the entries alphabetically inside the
  block.
generator:
  kind: variant
  variants:
    - id: two-imports
      ts: |-
        // TS:
        //   import { format } from 'fmt';
        //   import { strings } from 'strings';
        // Go's idiom is the grouped form below.
      canonical: |-
        import (
        	"fmt"
        	"strings"
        )
      distractors:
        - |-
          import "fmt"
          import "strings"
        - |-
          import { fmt, strings }
        - |-
          import fmt, strings
hints:
  - "Parenthesised block, one import per line, each name in double quotes. `gofmt` will reshape any other form."
  - "`import ( ... )`, with `\"fmt\"` and `\"strings\"` each on their own line."
  - "Block form: `import (\\n\\t\"fmt\"\\n\\t\"strings\"\\n)`."
runtime: none
notes: |
  The grouped block is idiomatic for any 2+ imports. Single
  imports use the bare form `import "fmt"`, but the moment you
  add a second one, `gofmt` reshapes it into the block.

  Distractors:
    1. Two separate `import "X"` lines — works but non-idiomatic;
       `gofmt` will collapse them into the block.
    2. `import { fmt, strings }` — TS/ES module syntax with
       destructuring braces. Go imports the whole package,
       not specific names from it.
    3. `import fmt, strings` — comma-separated, no quotes,
       no parens. Closer to Python but still wrong shape.

  Tab indentation in the block is intentional — Go's whole
  ecosystem uses tabs for leading whitespace.
