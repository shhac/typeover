target: rust
themeId: rust/foundations/hello-and-printing
type: mcq
order: 2
prompt: |
  TypeScript interpolates variables into strings with template
  literals: `` `hi ${name}` ``. Rust uses a format string with
  `{}` placeholders, and the values come as additional macro
  arguments. Pick the idiomatic Rust translation.
generator:
  kind: variant
  variants:
    - id: greet
      ts: 'console.log(`hi ${name}`);'
      canonical: 'println!("hi {}", name);'
      distractors:
        - 'println!(`hi ${name}`);'
        - 'println!("hi $name");'
        - 'println!("hi " + name);'
    - id: count
      ts: 'console.log(`count: ${count}`);'
      canonical: 'println!("count: {}", count);'
      distractors:
        - 'println!(`count: ${count}`);'
        - 'println!("count: $count");'
        - 'println!("count: " + count);'
hints:
  - "`println!` takes a format string with `{}` as the placeholder, then the values as separate args after a comma. Different from TS's `${...}` inside a backtick string."
  - "Shape: `println!(\"text with {} here\", value);`. The `{}` is a placeholder; the value comes after the comma."
  - 'For the greet variant: `println!("hi {}", name);`'
runtime: none
notes: |
  Distractors cover three formatting-system slips:
   - Backticks + `${...}` — TS template-literal syntax leaked
     into the format string; Rust would print the literal
     characters `${name}`.
   - `$name` — shell-style interpolation. Doesn't exist in Rust.
   - String concatenation with `+` — works in TS, doesn't compile
     in Rust because `&str + &str` isn't defined (you'd need
     `String::from(...) + ...` or `format!`).

  Modern Rust also supports inline named captures
  (`println!("hi {name}")`) — a future exercise can introduce
  that variant once the basic `{}` shape is solid.
