target: rust
themeId: rust/foundations/hello-and-printing
type: fill-line
order: 6
prompt: |
  The program declares a name and needs to greet that person. Type
  the idiomatic Rust line that prints `hello, world` using
  `println!` with a `{}` placeholder.
generator:
  kind: template
  vars:
    line:
      - 'println!("hello, {}", name);'
  ts: |-
    const name = "world";
    console.log("hello, " + name);
  canonical: |-
    fn main() {
        let name: &str = "world";
        ${line}
    }
  distractors:
    - match: 'println!("hello, $name");'
      explain: |-
        Shell-style interpolation. Rust uses `{}` as the placeholder
        and passes the value as a separate argument: `println!("hello, {}", name);`.
    - match: 'println!("hello, " + name);'
      explain: |-
        Rust doesn't define `+` between `&str` and `&str`. The
        compiler would emit `cannot add `&str` to `&str``. Use the
        format-string + arg shape: `println!("hello, {}", name);`.
    - match: 'println!("hello, {n4me}");'
      explain: |-
        Close, but typo aside, the inline-capture form would only
        work if the captured name matches a variable in scope —
        the canonical here drills `\"{}\", value`. The next theme
        ex covers the inline-capture shorthand.
expectStdout: |
  hello, world
runtime: server
blanks: [line]
hints:
  - "Format string + value, separated by a comma. The placeholder is `{}` (curly braces, no dollar sign), and the value follows after the closing string quote."
  - "Shape: `println!(\"hello, {}\", name);`. Comma separates the format string from each value."
  - 'Type `println!("hello, {}", name);`.'
notes: |
  First fill-line in this theme; bridges the MCQ recognition of
  format strings (slot 02) into producing one under runtime grading.
  Distractors are the same wrong patterns from slot 02 plus a
  modern-but-not-yet-taught inline capture — the explain text
  treats that one differently because it actually works in
  current Rust.
