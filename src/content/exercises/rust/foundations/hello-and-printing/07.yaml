target: rust
themeId: rust/foundations/hello-and-printing
type: mcq
order: 7
prompt: |
  Rust 1.58 added *inline named captures*: when the format string
  references a variable already in scope, you can put the name
  directly inside the braces and skip the trailing argument list
  entirely. Pick the idiomatic modern translation.
generator:
  kind: variant
  variants:
    - id: greet
      ts: "console.log(`hi ${name}`);"
      canonical: 'println!("hi {name}");'
      distractors:
        - 'println!("hi ${name}");'
        - 'println!("hi $name");'
        - 'println!("hi name");'
    - id: result
      ts: "console.log(`result: ${total}`);"
      canonical: 'println!("result: {total}");'
      distractors:
        - 'println!("result: ${total}");'
        - 'println!("result: $total");'
        - 'println!("result: total");'
hints:
  - "Rust 1.58+ lets you put the variable name directly inside `{}` without listing it as a separate argument — as long as the variable is in scope at the call site. The braces stay; the `$` does NOT."
  - "Shape: `println!(\"text {name} text\");`. Note: `{name}` — no `$`, no dollar-sign-anything. The variable in scope is named `name`."
  - 'For the greet variant: `println!("hi {name}");`.'
runtime: none
notes: |
  Introduces the modern inline-capture shorthand. Distractors:
   - `${name}` — TS template-literal syntax leaking into Rust.
     Rust would print the literal `${name}`.
   - `$name` — shell-style.
   - `name` (no braces) — would print the literal word "name", not
     the variable's value. Common slip when the learner forgets
     that the braces ARE the placeholder marker.

  Both `"{}", name` (slot 06 shape) and `"{name}"` (this slot's
  shape) are idiomatic; learners should know both. The variant
  form forces them to recognise the in-scope-name capture pattern
  on two different variables.
