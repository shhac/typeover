target: rust
themeId: rust/foundations/variables
type: mcq
order: 4
prompt: |
  Rust allows *shadowing*: declaring a new binding with the same
  name as an existing one. The new declaration replaces what the
  name refers to from that point forward. This is **not** the same
  as `let mut` — it's a fresh `let` that happens to reuse the
  identifier. Pick the right way to parse a string into a number,
  rebinding the same name.
generator:
  kind: variant
  variants:
    - id: parse-int
      ts: "const raw: string = '42'; const n: number = parseInt(raw);"
      canonical: 'let raw: &str = "42"; let raw: i32 = raw.parse().unwrap();'
      distractors:
        - 'let raw: &str = "42"; raw = raw.parse().unwrap();'
        - 'let mut raw: &str = "42"; raw = raw.parse().unwrap();'
        - 'let raw: &str = "42"; let raw: i32 = parseInt(raw);'
    - id: trim
      ts: "const input: string = '  hi  '; const input: string = input.trim();"
      canonical: 'let input: &str = "  hi  "; let input: &str = input.trim();'
      distractors:
        - 'let input: &str = "  hi  "; input = input.trim();'
        - 'let mut input: &str = "  hi  "; input = input.trim();'
        - 'let input: &str = "  hi  "; input.trim();'
hints:
  - "Shadowing means the second declaration is a *new* `let`, not a reassignment. That's why the type can change (from `&str` to `i32`) — it's literally a different binding that reuses the name."
  - "Two `let` lines, same name on both. No `mut` needed: the second `let` doesn't modify the first binding, it replaces what the name refers to."
  - 'For the parse-int variant: `let raw: &str = "42"; let raw: i32 = raw.parse().unwrap();`'
runtime: none
notes: |
  Shadowing is one of the Rust patterns TS devs reliably trip on
  because TypeScript outright forbids it in the same scope (`Cannot
  redeclare block-scoped variable`). Distractors:
   - `raw = raw.parse()...` — reassignment instead of shadow.
     Compile error: type can't change, and the binding isn't `mut`.
   - `let mut raw ... ; raw = raw.parse()...` — adds `mut` to fix
     the previous error, but you still can't reassign a `&str` to
     an `i32`. Wrong tool.
   - `parseInt(raw)` — TS function name leaked. Rust uses
     `.parse()` with a turbofish or annotation to pick the target
     type.

  The parse-int variant introduces `.parse()` and `.unwrap()`
  without dwelling on them — the deeper Result story is a later
  theme. The trim variant keeps the same type on both sides so
  shadowing-without-type-change reads cleanly.
