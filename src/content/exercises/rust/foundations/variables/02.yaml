target: rust
themeId: rust/foundations/variables
type: mcq
order: 2
prompt: |
  TypeScript's `let` is mutable by default — you can reassign at
  will. Rust flips this: every `let` binding starts *immutable*,
  and you opt in to mutability with `let mut`. Pick the right
  declaration for a counter that the next line increments.
generator:
  kind: variant
  variants:
    - id: counter
      ts: "let counter: number = 0; counter = counter + 1;"
      canonical: "let mut counter: i32 = 0; counter = counter + 1;"
      distractors:
        - "let counter: i32 = 0; counter = counter + 1;"
        - "const mut counter: i32 = 0; counter = counter + 1;"
        - "var counter: i32 = 0; counter = counter + 1;"
    - id: total
      ts: "let total: number = 0; total = total + 10;"
      canonical: "let mut total: i32 = 0; total = total + 10;"
      distractors:
        - "let total: i32 = 0; total = total + 10;"
        - "const mut total: i32 = 0; total = total + 10;"
        - "var total: i32 = 0; total = total + 10;"
hints:
  - "Rust defaults to immutable. The reassignment on the second line means the binding has to be `mut` — without it, the compiler rejects `counter = counter + 1` with `cannot assign twice to immutable variable`."
  - "Shape: `let mut <name>: <type> = <value>;`. The `mut` slots in between `let` and the name."
  - "For the counter variant: `let mut counter: i32 = 0; counter = counter + 1;`."
runtime: none
notes: |
  The most important reflex shift in this theme. Distractors:
   - `let counter: i32 = 0;` — missing `mut`. Compiles for the
     declaration but errors on the next line's reassignment;
     the most common TS-dev slip.
   - `const mut counter` — combining Rust's `const` (compile-time
     constant; can't even be initialized with a runtime value)
     with `mut`. Both wrong; `const` is for true constants,
     not "regular variable that doesn't change."
   - `var counter` — Zig/JS reflex. `var` isn't a Rust keyword.

  Counter / total variants keep the shape simple while showing
  reassignment is the trigger.
