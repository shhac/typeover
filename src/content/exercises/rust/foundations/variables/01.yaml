target: rust
themeId: rust/foundations/variables
type: mcq
order: 1
prompt: |
  TypeScript declares a binding with `let` (or `const`) and writes
  the type annotation `: type` between the name and the `=`. Rust
  also uses `let`, also puts the annotation in the same slot —
  but numeric types are width-specific, not the single `number`.
  Pick the idiomatic Rust translation.
generator:
  kind: variant
  variants:
    - id: int
      ts: "let count: number = 5;"
      canonical: "let count: i32 = 5;"
      distractors:
        - "let count: number = 5;"
        - "let count: int = 5;"
        - "i32 count = 5;"
    - id: float
      ts: "let ratio: number = 0.5;"
      canonical: "let ratio: f64 = 0.5;"
      distractors:
        - "let ratio: number = 0.5;"
        - "let ratio: float = 0.5;"
        - "f64 ratio = 0.5;"
    - id: bool
      ts: "let ready: boolean = false;"
      canonical: "let ready: bool = false;"
      distractors:
        - "let ready: boolean = false;"
        - "let ready: Bool = false;"
        - "bool ready = false;"
hints:
  - "`let` stays. The annotation slot is the same (`: type` between name and `=`). The shift is on the type names: `number` becomes a width-specific integer (`i32`) or float (`f64`), and `boolean` becomes `bool`."
  - "Shape: `let <name>: <type> = <value>;`. Trailing semicolon required."
  - "For the int variant: `let count: i32 = 5;`."
runtime: none
notes: |
  Mirror of the Zig variables/01 — same TS source, different
  target. Variant MCQ across int / float / bool covers the three
  primitive groupings learners hit first. Distractors:
   - TS leakage (`number`, `boolean` literally).
   - Wrong type name (`int`, `float`, `Bool`) — close but not Rust.
   - C-style declaration (`type name = value`) — wrong shape.

  Mutability is intentionally NOT introduced here. Every binding
  starts immutable; exercise 02 teaches the `let mut` opt-in.
