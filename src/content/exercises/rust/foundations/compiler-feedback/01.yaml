target: rust
themeId: rust/foundations/compiler-feedback
type: mcq-explain
order: 1
prompt: |
  Rust's compiler emits diagnostics that look like the one below.
  Identify the PRIMARY error line — the one that names the error
  code and the short summary. The other lines are spans, notes,
  and help suggestions.

      error[E0277]: cannot multiply `i32` by `&str`
        --> src/main.rs:4:9
         |
       4 |     let _ = 7 * "hi";
         |         ^^^^^^^^^^^^
         = note: the trait `Mul<&str>` is not implemented for `i32`
      help: consider converting the value with `.parse::<i32>()`
generator:
  kind: variant
  variants:
    - id: e0277
      ts: |-
        // A TS error has one location and message:
        // error TS2362: The left-hand side of an arithmetic operation
        //   must be of type 'any', 'number', 'bigint' or an enum type.
      canonical: 'The `error[E0277]: cannot multiply ...` line — bracketed error code + short summary.'
      distractors:
        - 'The `--> src/main.rs:4:9` line — that''s the file/line/column span.'
        - 'The `= note: the trait Mul<&str> is not implemented ...` line — a related-fact note, not the headline.'
        - 'The `help: consider converting the value ...` line — a suggested fix, not the error itself.'
hints:
  - "The primary line starts with `error[EXXXX]:` — bracketed numeric error code, colon, summary."
  - "Not the `-->` (file:line:col span), not the `= note:` (related fact), not the `help:` (suggested fix)."
  - "`error[E0277]: cannot multiply ...`"
runtime: none
notes: |
  Establishes rustc's diagnostic anatomy. Distractors are the
  three sibling lines a learner has to scan past: the span,
  the note, and the help suggestion.
