target: rust
themeId: rust/foundations/compiler-feedback
type: mcq-explain
order: 2
prompt: |
  Inside the rustc diagnostic below, which line is the
  ACTIONABLE suggestion you can copy verbatim into your code?

      error[E0277]: cannot multiply `i32` by `&str`
        --> src/main.rs:4:9
         |
       4 |     let _ = 7 * "hi";
         = note: the trait `Mul<&str>` is not implemented for `i32`
      help: consider converting the value with `.parse::<i32>()`
generator:
  kind: variant
  variants:
    - id: parse-suggest
      ts: |-
        // TS surfaces a hint inline in the message:
        //   Did you mean to call '.toString()'?
      canonical: 'The `help: consider converting the value with .parse::<i32>()` line — `help:` lines hold the suggested fix, often pasteable as-is.'
      distractors:
        - 'The `error[E0277]: cannot multiply ...` line — that''s the error header.'
        - 'The `= note: the trait Mul<&str> is not implemented ...` line — a related fact, not an action.'
        - 'The `--> src/main.rs:4:9` line — the file/line/column span.'
hints:
  - "Lines that start with `help:` are rustc's suggested fixes — sometimes literal source the learner can paste in."
  - "The other three lines are the error header, the file/line span, and a related-trait note."
  - "`help: consider converting ...`"
runtime: none
notes: |
  Reinforces the `help:` line as the action surface. Common
  beginner failure: reading only the error header and missing
  the help directly below.
