target: rust
themeId: rust/ownership/moves-and-copy
type: mcq
order: 1
prompt: |
  In Rust, each value has exactly ONE owning binding at a time.
  After this assignment, which binding owns the `String`?
generator:
  kind: variant
  variants:
    - id: string-move
      ts: 'const a: string = "hi"; const b: string = a; // both still usable'
      canonical: 'After `let a = String::from("hi"); let b = a;` — `b` owns the String; `a` is no longer usable.'
      distractors:
        - '`a` still owns it; `b` is just a reference.'
        - 'Both `a` and `b` own it independently (cloned automatically).'
        - 'Neither — the String is dropped immediately after the second `let`.'
hints:
  - "Rust transfers ownership on assignment for heap-owning types like `String`. The original binding becomes inaccessible — the compiler treats further use as a use-after-move error."
  - "Same word the docs use: the value was MOVED from `a` to `b`."
  - "`b` owns it; `a` is no longer usable."
runtime: none
notes: |
  Establishes move-on-assignment for heap-owning types. TS
  reference uses string-equality semantics (both vars usable) to
  highlight the contrast — Rust's String is not Copy.
