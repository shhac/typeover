  Broken source:

      fn parse_age(s: &str) -> Option<i32> {
          s.parse().ok()
      }

      fn main() {
          let n = parse_age("hello").unwrap();
          println!("{}", n);
      }

  Fix `main` by handling the `None` case explicitly with
  `unwrap_or(0)` — so a parse failure prints `0` instead of
  panicking.

