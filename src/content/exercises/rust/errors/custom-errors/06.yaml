            }
        }
    }

    fn main() {
        let e = AppError::ParseFailed(String::from("abc"));
        println!("{}", e);
    }
runtime: server
notes: |
  Drills the full enum + Display impl combo. The `Display`
  trait is what `{}` formatting calls; without it, the
  println would only work with `{:?}` debug.
