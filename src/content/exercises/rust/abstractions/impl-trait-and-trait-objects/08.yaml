        }
    }

    fn chorus(speakers: &[Box<dyn Speaker>]) {
        for s in speakers {
            println!("{}", s.say());
        }
    }

    fn main() {
        let speakers: Vec<Box<dyn Speaker>> = vec![
            Box::new(Dog),
            Box::new(Cow),
        ];
        chorus(&speakers);
    }
runtime: server
notes: |
  Drills the canonical "function over heterogeneous
  collection" shape. The slice parameter `&[Box<dyn T>]`
  is symmetric with `&[T]` from the slices theme — same
  borrow shape, trait-object elements instead of plain
  T's.
