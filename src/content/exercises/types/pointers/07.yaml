target: go
themeId: types/pointers
type: fill-line
order: 7
prompt: |
  Construct a `*User` pointing at a freshly-initialised User
  struct. Use the IDIOMATIC `&T{}` form — `&` applied to a
  composite literal gives you a pointer to a newly-allocated
  struct populated with the named fields.

  Compare with `new(T)`: `new(User)` ALSO gives you a `*User`,
  but at a ZERO-valued struct (all fields empty). When you want
  to allocate AND initialise in one step, `&T{}` is the canon.

  The scaffold prints `p.name`; you write the construction.
  Expected output: `alice`.
generator:
  kind: template
  vars:
    line:
      - 'p := &User{name: "alice"}'
  ts: |-
    type User = { name: string };
    const p: User = { name: "alice" };  // TS pointers-vs-values invisible
    console.log(p.name);  // "alice"
  canonical: |-
    package main

    import "fmt"

    type User struct {
    	name string
    }

    func main() {
    	${line}
    	fmt.Println(p.name)
    }
  distractors:
    - match: 'p := new(User){name: "alice"}'
      explain: |-
        Can't combine `new()` with a composite literal — either
        `new(User)` (zero-valued) OR `&User{name: "alice"}`
        (initialised). Not both. The `&T{}` form is the idiomatic
        "allocate + initialise" path.
    - match: 'p := User{name: "alice"}'
      explain: |-
        Creates a VALUE of type User, not a pointer. `p` would
        be `User`, not `*User`. Scaffold then calls `p.name`
        which DOES work (Go auto-derefs for field access), but
        the variable's type is wrong — the prompt asks for a
        pointer.
    - match: 'p := &{name: "alice"}'
      explain: |-
        Bare-brace composite literal — Go can't infer the struct
        type from context. The type name must precede the brace:
        `&User{name: "alice"}`.
    - match: 'p := *User{name: "alice"}'
      explain: |-
        `*` on the value side is dereference, not allocation.
        You can't deref a literal; this is a type error. The
        operator pair: `&` to take an address, `*` to follow
        one. For "give me a new pointer to a literal", use `&`.
expectStdout: |
  alice
runtime: yaegi
blanks: [line]
hints:
  - "Two pieces: the address-of operator (`&`) and a composite struct literal (`User{name: \"alice\"}`). Put them together: `&User{name: \"alice\"}`."
  - "`p := &User{name: \"alice\"}`."
  - "`p := &User{name: \"alice\"}`."
notes: |
  THE allocation-via-pointer-literal pattern. `&T{}` is the Go
  idiom for "allocate and initialise in one step" — equivalent
  to C++ `new T{...}` or Java/C# `new T() { Name = ... }`.

  Pairs informationally with `new(T)`: both produce `*T`; `new`
  zeros, `&T{}` lets you initialise. The slot's notes call out
  the comparison so the learner has the full surface even though
  this slot only drills one half.

  Distractor bank covers the four most common confusions:
    1. Combining `new()` with composite literal — mixed paths.
    2. Forgetting `&` — produces a value, not a pointer.
    3. Bare-brace — type-inference doesn't work.
    4. `*` instead of `&` — operator-pair confusion (theme-wide
       thread).
