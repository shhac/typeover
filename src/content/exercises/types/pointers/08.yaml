target: go
themeId: types/pointers
type: freeform
order: 8
prompt: |
  Write a complete program that:

  1. Declares `a := 1` and `b := 2`.
  2. Defines `swap(p, q *int)` that swaps the values `*p` and
     `*q` point at.
  3. Calls `swap(&a, &b)` and prints `a` and `b` on separate
     lines.

  Expected output:
  ```
  2
  1
  ```

  This is the canonical "pointers let you mutate from a callee"
  example — TypeScript can't do this with primitives.

  TypeScript reference:
  ```ts
  // TS can't really do this with primitives — would need a box object:
  let a = 1; let b = 2;
  [a, b] = [b, a];        // destructure trick, NOT a callee swap
  console.log(a);          // 2
  console.log(b);          // 1
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    // Effectively impossible with primitives in TS; the destructure trick
    // does the swap inline, not via a callee.
    let a = 1; let b = 2;
    [a, b] = [b, a];
    console.log(a);
    console.log(b);
  canonical: |-
    package main

    import "fmt"

    func swap(p, q *int) {
    	*p, *q = *q, *p
    }

    func main() {
    	a := 1
    	b := 2
    	swap(&a, &b)
    	fmt.Println(a)
    	fmt.Println(b)
    }
expectStdout: |
  2
  1
hints:
  - "Three pieces: declare a and b, define swap taking two `*int`, call swap with `&a, &b`. Inside swap: `*p, *q = *q, *p` does the tuple-swap through the pointers."
  - "Same Go multi-assignment shape as `a, b = b, a` — but applied to the DEREFERENCED values: `*p, *q = *q, *p`."
  - "See canonical."
runtime: yaegi
notes: |
  End-to-end pointer-swap. Drills:
    - `&` operator (slots 2 + 4): take addresses at the call
      site.
    - `*` deref (slots 1 + 5): swap THROUGH the pointers.
    - Pointer-as-parameter (slot 6): how the callee receives
      addresses.
    - Multi-return / multi-assignment (Module 1 functions):
      tuple swap across two values.

  Authoring note: `func swap(p, q *int)` uses the shared-type
  parameter form — both p and q are `*int`, declared together
  with one type annotation. This is the Go idiom for
  same-typed adjacent parameters and is fair game by Module 3
  (introduced in Module 1's functions theme).
