target: go
themeId: types/pointers
type: mcq
order: 3
prompt: |
  What's the ZERO VALUE of a pointer? Same question as theme 3.1
  slot 3 was for structs, now scoped to pointer types.

  TypeScript's rough analog: a variable declared `let p: User`
  without an initialiser is `undefined`. Go gives every type a
  defined zero value — including pointers. Pick the line that
  correctly describes Go's behaviour given:

  ```go
  var p *int
  ```
generator:
  kind: variant
  variants:
    - id: int-ptr
      ts: 'let p: { value: number } | undefined;  // p === undefined'
      canonical: "p == nil"
      distractors:
        - "p == 0  // pointers are numeric addresses"
        - "p == undefined  // matches TS semantics"
        - "panic: p not initialized  // bare var is unusable"
    - id: user-ptr
      ts: 'let p: User | undefined;  // p === undefined'
      canonical: "p == nil"
      distractors:
        - "p == 0  // pointers are numeric addresses"
        - "p == undefined  // matches TS semantics"
        - "panic: p not initialized  // bare var is unusable"
    - id: str-ptr
      ts: 'let p: { value: string } | undefined;  // p === undefined'
      canonical: "p == nil"
      distractors:
        - "p == 0  // pointers are numeric addresses"
        - "p == undefined  // matches TS semantics"
        - "panic: p not initialized  // bare var is unusable"
hints:
  - "Go's zero-value rule covers pointers too. A bare `var p *T` produces a pointer that's NOT pointing at anything — `nil`. It's not zero-the-number, not undefined, not unusable — just nil."
  - "The keyword is one of the six Go nil-able types' shared sentinel value: pointer, interface, slice, map, channel, function."
  - "`p == nil`."
runtime: none
notes: |
  Pins the nil-pointer ground state. The TS analog is `undefined`,
  which Go doesn't have — but `nil` plays a similar role for the
  six nil-able types (pointer, interface, slice, map, channel,
  func). Worth knowing that BARE numbers/strings/bools/structs
  aren't nil-able (theme 3.1 slot 3 distractor 1).

  Distractors:
    1. `p == 0` — confuses pointer with numeric address. Yes,
       pointers carry numeric values internally, but the Go
       compiler doesn't let you compare a pointer to `0` —
       you'd get a type-mismatch error.
    2. `p == undefined` — TS keyword leak.
    3. "panic: not initialized" — `var p *T` doesn't panic.
       DEREFERENCING a nil pointer (`*p`) panics — distinct
       beat covered in a future slot.

  Yaegi caveat for downstream slots: nil-deref produces an
  opaque `reflect: ...` message instead of Go's canonical
  `runtime error: invalid memory address or nil pointer
  dereference` (design-docs/26 + /30). Slot 9 freeform that
  exercises nil-deref will match on `panic:` prefix only.
