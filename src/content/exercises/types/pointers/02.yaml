target: go
themeId: types/pointers
type: mcq
order: 2
prompt: |
  Pick the line that DECLARES a pointer `p` holding the address
  of `x`. Slot 1 went the other direction (deref to read);
  this slot goes the FIRST direction (take the address to
  create the pointer in the first place).

  Given `x := 42`, what line gives you a `*int` pointing at
  `x`?
generator:
  kind: variant
  variants:
    - id: int
      ts: |-
        let x = 42;
        // TS analog: const p = { ref: x }; — no real address-taking
      canonical: "p := &x"
      distractors:
        - "p := *x"
        - "p := pointer(x)"
        - "p := new(x)"
    - id: name
      ts: |-
        let name = "alice";
        // TS analog: const p = { ref: name }; — no real address-taking
      canonical: "p := &name"
      distractors:
        - "p := *name"
        - "p := pointer(name)"
        - "p := new(name)"
    - id: count
      ts: |-
        let count = 7;
        // TS analog: const p = { ref: count }; — no real address-taking
      canonical: "p := &count"
      distractors:
        - "p := *count"
        - "p := pointer(count)"
        - "p := new(count)"
hints:
  - "Slot 1's deref operator was `*`. The MIRROR operator — address-of — is `&`. Apply it to the variable name to produce a pointer."
  - "One character before the variable name."
  - "`p := &x`."
runtime: none
notes: |
  Counterpart to slot 1. Pins both halves of the `&` / `*`
  symmetry before any productive use. The TS analog comment is
  intentionally awkward — TypeScript HAS no first-class
  address-take; the closest analog is wrapping a value in an
  object, which doesn't really capture the semantics. This
  awkwardness is the lesson.

  Distractors:
    1. `*x` — applies the deref operator to a non-pointer.
       The operator-pair confusion from slot 1, mirrored.
    2. `pointer(x)` — invented function form. Some languages
       have explicit `pointer()` constructors; Go doesn't.
    3. `new(x)` — `new()` takes a TYPE, not a value. `new(int)`
       returns a `*int` pointing at a zero-valued int — NOT
       at `x`. Slot 7 will cover `new(T)` vs `&T{}`; flagging
       here as a common confusion.
