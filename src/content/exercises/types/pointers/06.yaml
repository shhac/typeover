target: go
themeId: types/pointers
type: fill-line
order: 6
prompt: |
  TypeScript can't pass an `int` by reference — primitives copy
  regardless. Go can: pass a `*int` and the callee can mutate
  the caller's variable through it. Write the call to `bump`
  that passes the ADDRESS of `n`.

  Expected output: `6`.

  TypeScript reference:
  ```ts
  // TS can't really do this with a primitive — wrap in an object:
  function bump(box: { value: number }) { box.value += 1; }
  const n = { value: 5 };
  bump(n);
  console.log(n.value);  // 6
  ```
generator:
  kind: template
  vars:
    line:
      - "bump(&n)"
  ts: |-
    function bump(box: { value: number }) { box.value += 1; }
    const n = { value: 5 };
    bump(n);
    console.log(n.value);  // 6
  canonical: |-
    package main

    import "fmt"

    func bump(p *int) {
    	*p++
    }

    func main() {
    	n := 5
    	${line}
    	fmt.Println(n)
    }
  distractors:
    - match: "bump(n)"
      explain: |-
        Passes the VALUE 5, not a pointer to `n`. `bump`'s
        signature is `func bump(p *int)` — the type system would
        reject `bump(n)` because `n` is an `int`, not `*int`.
        Use the address-of operator: `bump(&n)`.
    - match: "bump(*n)"
      explain: |-
        Deref on a non-pointer. `n` is already an `int`; `*n`
        is a type error. Address-of is `&n`; deref is `*p`. They
        go in opposite directions.
    - match: "bump(new(int))"
      explain: |-
        Creates a FRESH `*int` pointing at a zero-valued int,
        passes it to bump. The mutation happens (the fresh int
        becomes 1), but the result is discarded — `n` in main
        stays 5. To mutate `n`, take its address with `&n`.
    - match: "bump(&5)"
      explain: |-
        Can't take the address of a literal. `&` needs an
        addressable expression — typically a named variable
        (`&n`), a field of an addressable struct, or an
        indexable element. Slot 1 of theme 3.2 noted Yaegi
        is permissive here vs real `go build`; we don't drill
        the boundary.
expectStdout: |
  6
runtime: yaegi
blanks: [line]
hints:
  - "`bump` wants a `*int` — a pointer to int. You have a plain `int` (`n`). Use the `&` operator to take its address."
  - "`bump(&n)`."
  - "`bump(&n)`."
notes: |
  Productive use of the `&` from slots 2 + 4. Smaller cousin of
  theme 3.1 slot 6 (struct pass-by-pointer) — same divergence,
  primitive scope so the lesson is purely about the operator
  pair, not about struct mechanics.

  Distractor bank covers the three pointer/value confusions plus
  the `new(int)` red herring that returns a fresh zero-pointer
  instead of a pointer to `n`.
