target: go
themeId: types/structs
type: fill-line
order: 7
prompt: |
  Structs can hold other structs. Field access just chains — `.`
  per level, same as TypeScript. Type the line that prints the
  inner `city` field.

  TypeScript reference:
  ```ts
  type Address = { city: string; zip: string };
  type User = { name: string; addr: Address };
  const u: User = {
    name: "alice",
    addr: { city: "NYC", zip: "10001" },
  };
  console.log(u.addr.city);  // "NYC"
  ```

  Expected output: `NYC`.
generator:
  kind: template
  vars:
    line:
      - "fmt.Println(u.addr.city)"
  ts: |-
    type Address = { city: string; zip: string };
    type User = { name: string; addr: Address };
    const u: User = {
      name: "alice",
      addr: { city: "NYC", zip: "10001" },
    };
    console.log(u.addr.city);  // "NYC"
  canonical: |-
    package main

    import "fmt"

    type Address struct {
    	city string
    	zip  string
    }

    type User struct {
    	name string
    	addr Address
    }

    func main() {
    	u := User{
    		name: "alice",
    		addr: Address{city: "NYC", zip: "10001"},
    	}
    	${line}
    }
  distractors:
    - match: "fmt.Println(u.city)"
      explain: |-
        `city` isn't a top-level field of `User` — it lives inside
        the nested `Address` struct under `u.addr`. You need
        `u.addr.city`. Go doesn't promote nested fields to the
        outer struct unless you use embedding (anonymous-field
        composition — covered in module 7).
    - match: 'fmt.Println(u.addr["city"])'
      explain: |-
        Bracket-index syntax is for maps and slices. Struct field
        access is the dot operator, even when chained: `u.addr.city`.
    - match: "fmt.Println(u.addr->city)"
      explain: |-
        C / C++ arrow-deref syntax. Go has no `->`; field access
        through a struct OR a pointer-to-struct both use `.`
        (Go auto-dereferences pointers for field access).
expectStdout: |
  NYC
runtime: yaegi
blanks: [line]
hints:
  - "Same `.` operator as TypeScript, chained per level. The path is variable → outer-field → inner-field."
  - "Three tokens with dots between: `u`, `addr`, `city`."
  - "`fmt.Println(u.addr.city)`."
notes: |
  Drilling nested access — the cheap-but-load-bearing pattern of
  navigating struct-of-struct. The chain works the same way in
  TS, so the lesson here is reinforcement (Go does what you
  expect) rather than divergence.

  Out of scope: embedded fields (anonymous composition) — which
  WOULD promote `city` to `u.city`. That's module 7's
  `idioms/embedding` theme. Distractor #1 flags this so a learner
  who's read ahead doesn't get confused; the exercise itself
  keeps explicit composition.

  Why fill-line not fill-word: the LINE is the productive unit —
  the chained access reads naturally as one expression. Splitting
  into multiple blanks ("type `addr` here, type `city` there")
  would shatter that.
