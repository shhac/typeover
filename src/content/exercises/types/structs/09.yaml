target: go
themeId: types/structs
type: freeform
order: 9
prompt: |
  Theme capstone: build a small program with NESTED structs and
  print one field at each level of nesting.

  Model: a `Book` with a `title string`, `pages int`, and an
  `author Author` field. `Author` is `{ name string; born int
  }`. Build a `b := Book{...}` with the author Audre Lorde, born
  1934, book "Sister Outsider", 256 pages.

  Print, one per line:
  ```
  Sister Outsider
  256
  Audre Lorde
  1934
  ```

  Drills: struct declaration (slot 1), nested struct literal (slot
  2), nested field access (slot 7), and the zero-value rule (slot
  3) is silent here — every field is explicitly assigned, so the
  zero rule isn't visible, but the literal SHAPE relies on you
  knowing all fields are accounted for.

  TypeScript reference:
  ```ts
  type Author = { name: string; born: number };
  type Book = { title: string; pages: number; author: Author };
  const b: Book = {
    title: "Sister Outsider",
    pages: 256,
    author: { name: "Audre Lorde", born: 1934 },
  };
  console.log(b.title);
  console.log(b.pages);
  console.log(b.author.name);
  console.log(b.author.born);
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    type Author = { name: string; born: number };
    type Book = { title: string; pages: number; author: Author };
    const b: Book = {
      title: "Sister Outsider",
      pages: 256,
      author: { name: "Audre Lorde", born: 1934 },
    };
    console.log(b.title);
    console.log(b.pages);
    console.log(b.author.name);
    console.log(b.author.born);
  canonical: |-
    package main

    import "fmt"

    type Author struct {
    	name string
    	born int
    }

    type Book struct {
    	title  string
    	pages  int
    	author Author
    }

    func main() {
    	b := Book{
    		title:  "Sister Outsider",
    		pages:  256,
    		author: Author{name: "Audre Lorde", born: 1934},
    	}
    	fmt.Println(b.title)
    	fmt.Println(b.pages)
    	fmt.Println(b.author.name)
    	fmt.Println(b.author.born)
    }
expectStdout: |
  Sister Outsider
  256
  Audre Lorde
  1934
hints:
  - "Two struct types: `Author` (declared first because `Book` references it) and `Book`. Use named-field literals for both; nest `Author{...}` inside `Book{...}`."
  - "Access chains through the dot: `b.title`, `b.pages`, `b.author.name`, `b.author.born`. Each print is its own `fmt.Println` call."
  - "See canonical."
runtime: yaegi
notes: |
  Pulling together every slot in this theme. Author chose Audre
  Lorde / Sister Outsider as the example because (a) it's a real
  book a learner might recognise and (b) it's not a tutorial-
  canon "Foo Bar" example that fades into noise. Pedagogy lives in
  the texture.

  Declaration order matters: `Author` must come BEFORE `Book`
  because Go's identifier resolution within a package is
  order-INDEPENDENT for top-level decls, BUT readability favors
  declaring the dependency first. Either order compiles.

  Future Module 3 themes will lean on this capstone — methods
  (3.2) attach to one of these struct types; pointers (3.3) hand
  out `&b`; nil-and-zero-values (3.4) returns to the zero-value
  rule with deeper field types.
