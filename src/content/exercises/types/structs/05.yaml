target: go
themeId: types/structs
type: fill-word
order: 5
prompt: |
  Type the FIELD NAME that's missing from this struct literal.
  Named fields are positional-order-INDEPENDENT — the compiler
  pairs `key: value` by the field name, so authors can list them
  in any order and adding a field upstream doesn't shift the
  meaning of existing literals.
generator:
  kind: template
  vars:
    field: [age]
  ts: |-
    type User = { name: string; age: number };
    const u: User = { name: "alice", age: 30 };
  canonical: |-
    type User struct {
    	name string
    	age  int
    }
    u := User{name: "alice", ${field}: 30}
blanks: [field]
hints:
  - "The struct declares two fields: `name` and `age`. The literal already assigns `name`; the blank is the OTHER field's key."
  - "Three letters."
  - "`age`."
runtime: none
notes: |
  Drilling that named-field literals use the field NAME (not the
  declaration index), and that ORDER of named keys is irrelevant —
  `User{age: 30, name: "alice"}` and `User{name: "alice", age: 30}`
  compile identically.

  Why not a variant cycle: same reason as slot 04 — template
  vars pick independently, so misaligned (ts shows `name: "alice",
  age: 30`; blank's correct value is `title`) would confuse. The
  drill is one consistent pattern.

  Out of scope for this slot: omitting fields (Go uses the zero
  value for any field NOT named — slot 03 already pinned that).
  The "what if you skip a field?" beat is left implicit; if it
  causes confusion in practice, add a slot 04.5.
