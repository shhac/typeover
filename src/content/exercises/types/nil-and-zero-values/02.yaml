target: go
themeId: types/nil-and-zero-values
type: mcq
order: 2
prompt: |
  Only some Go types can hold `nil`. Numbers, strings, structs,
  and booleans CAN'T — their zero values are 0, "", the
  zero-struct, and false respectively, none of which is nil.

  The nil-able types share a property: they're all REFERENCE
  shapes under the hood (a pointer-y header that can point at
  nothing).

  Which of the following is the COMPLETE list of nil-able types
  in Go?
generator:
  kind: template
  vars:
    answer: ["pointer, interface, slice, map, channel, function"]
  ts: |-
    // TS analog: any reference can be null/undefined.
    // Go is stricter — only six specific kinds of types can be nil.
  canonical: ${answer}
  distractors:
    - "everything (every value can be nil)"
    - "pointer, interface, struct"
    - "any reference type, including string"
hints:
  - "Two halves: the THREE you definitely know hold pointer-like headers (pointer, slice, map), and the THREE that aren't always obvious (interface, channel, function). Six total."
  - "The full list is: pointer, interface, slice, map, channel, function. Bools/numbers/strings/arrays/structs are NOT nil-able."
  - "`pointer, interface, slice, map, channel, function`."
runtime: none
notes: |
  The canonical nil-able-types list. Worth knowing as a lookup
  because it shapes a lot of API design — functions returning
  pointers/maps/slices/channels can signal "no result" with nil;
  functions returning bare structs/strings/ints can't (they have
  to use the zero value or comma-ok).

  Distractors:
    1. "everything" — TS reflex, where most things can be
       null/undefined.
    2. "pointer, interface, struct" — struct is NOT nil-able
       (theme 3.1 slot 3's distractor 1 returns here).
    3. "any reference type, including string" — string ISN'T a
       reference type in Go; it's a value with reference-shaped
       internals, but you can't make it nil.

  Author note: array IS NOT nil-able. `[3]int` zero value is
  `[0 0 0]`, not nil. Frequently confused with slice; called out
  here so the freeform later doesn't accidentally use `[N]int`
  expecting nil-able shape.
