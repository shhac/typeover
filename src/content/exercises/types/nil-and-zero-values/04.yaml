target: go
themeId: types/nil-and-zero-values
type: fill-word
order: 4
prompt: |
  Type the keyword that represents "no value" for any of Go's
  nil-able types (pointer, interface, slice, map, channel,
  function).
generator:
  kind: template
  vars:
    nilkw: ["nil"]
  ts: |-
    let p: { x: number } | null = null;
  canonical: |-
    var p *int = ${nilkw}
blanks: [nilkw]
hints:
  - "Three letters. Lower-case. Not `null`, not `undefined`, not `None`."
  - "Same word as in Lisp."
  - "`nil`."
runtime: none
notes: |
  Smallest possible drill: type the keyword. Counterpart to slot
  2 (which is the RECOGNITION of which types are nil-able);
  this slot is the PRODUCTION of the keyword itself. The
  three-letter blank cements the muscle memory the slot 5
  fill-line + slot 6 freeform will exercise.

  No distractors — the keyword IS the answer. Three letters,
  one keyword, one drill.
