target: go
themeId: types/nil-and-zero-values
type: mcq
order: 3
prompt: |
  THE classic Go gotcha. Consider:

  ```go
  type Error interface { Error() string }
  type MyErr struct{}
  func (m *MyErr) Error() string { return "my error" }

  func mightFail() Error {
      var p *MyErr     // p is a nil *MyErr
      return p          // returned as an Error interface
  }

  e := mightFail()
  fmt.Println(e == nil)
  ```

  What does this print?
generator:
  kind: template
  vars:
    answer: ["false (because e holds a non-nil interface wrapping a nil pointer)"]
  ts: |-
    // TS has nothing quite like this — interfaces in TS are
    // structural and don't carry a separate type descriptor.
  canonical: ${answer}
  distractors:
    - "true (a nil pointer wrapped in an interface IS a nil interface)"
    - "panic: nil pointer (the deref happens at the comparison)"
    - "compile error (can't compare interface to nil)"
hints:
  - "An interface value in Go is a TWO-WORD struct: (type descriptor, data pointer). It's nil only when BOTH halves are nil. Returning a typed nil pointer through an interface return type fills in the TYPE half — the interface is non-nil even though the pointed-at-value is."
  - "Wrapping a nil concrete in an interface produces a non-nil interface."
  - "`false (...)`."
runtime: none
notes: |
  THE headline trap of the nil/zero theme. Production Go bug
  bank #1 — has bitten Kubernetes, Docker, gRPC, basically
  every major Go codebase at least once. Worth pinning here as
  recognition so the freeform later (or downstream module 4
  interfaces work) doesn't get bitten by it.

  Per design-docs/26 pre-flight, this WORKS on Yaegi — the
  trap reproduces exactly (e == nil → false). A freeform later
  in this theme could demonstrate it runnably.

  Distractors:
    1. "true" — the intuitive (wrong) answer; this is the
       failure mode learners actually hit.
    2. "panic: nil pointer" — confuses comparison with deref.
       `e == nil` does NOT deref; it compares the interface
       header against the nil-interface sentinel.
    3. "compile error" — interfaces ARE comparable to nil in
       Go; that's the whole point of the trap. The comparison
       just doesn't do what you'd expect.

  Slot's TS analog comment notes that TS doesn't really have
  an equivalent — its interfaces are structural and don't
  carry runtime type info. So this is one of the few "purely
  Go" gotchas in Module 3.
