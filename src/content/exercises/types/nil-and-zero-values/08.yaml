target: go
themeId: types/nil-and-zero-values
type: fill-line
order: 8
prompt: |
  Range over a nil slice does ZERO iterations — no panic, no
  special case. This is another zero-value-is-useful pattern:
  consumers don't need to nil-check before iterating.

  Write the `sum(xs []int)` helper that returns the total of
  its argument. Caller passes both a nil slice and a populated
  one — expected output `0` then `6`.

  Expected output:
  ```
  0
  6
  ```
generator:
  kind: template
  vars:
    line:
      - "for _, x := range xs { total += x }"
  ts: |-
    function sum(xs: number[] | null): number {
      if (xs == null) return 0;  // TS requires the guard
      return xs.reduce((a, b) => a + b, 0);
    }
  canonical: |-
    package main

    import "fmt"

    func sum(xs []int) int {
    	total := 0
    	${line}
    	return total
    }

    func main() {
    	var nothing []int
    	fmt.Println(sum(nothing))
    	fmt.Println(sum([]int{1, 2, 3}))
    }
  distractors:
    - match: 'if xs == nil { return 0 }; for _, x := range xs { total += x }'
      explain: |-
        The guard is unnecessary — `range` over a nil slice is
        already a no-op (zero iterations). The bare loop handles
        both nil and empty correctly. Defensive nil-checks like
        this are TS-leak patterns; Go's zero-value semantics
        let you skip them.
    - match: "for x := range xs { total += x }"
      explain: |-
        One-value range form on a slice gives the INDEX, not the
        value (Module 2 theme 2.3 slot 2 trap). For the value,
        use the two-value form with `_` to drop the index:
        `for _, x := range xs`.
    - match: "for _, x := range xs { total = x }"
      explain: |-
        Assignment instead of accumulation — `total` ends up
        equal to the LAST element, not the sum. Use `+=` to
        accumulate.
expectStdout: |
  0
  6
runtime: yaegi
blanks: [line]
hints:
  - "Two-value `range` over the slice: `for _, x := range xs { ... }`. Accumulate into `total` with `+=`. No nil-check needed — `range nil` is a clean no-op."
  - "`for _, x := range xs { total += x }`."
  - "`for _, x := range xs { total += x }`."
notes: |
  Zero-value-is-useful for slices applied to `range`: a nil
  slice's iteration count is zero, so `sum(nil) == 0` falls out
  for free. No special case needed at the API boundary.

  Distractor #1 (the defensive nil-check) is THE most common
  TS-leak — `xs.reduce()` would throw on null, so a TS dev
  reaches for the guard. Pinning it as wrong here cements the
  idiom: idiomatic Go doesn't sprinkle these checks unless
  there's a real reason.

  Distractor #2 (one-value range) is theme 2.3's biggest trap
  returning as the second-most-common error.
