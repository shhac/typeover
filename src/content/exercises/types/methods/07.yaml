target: go
themeId: types/methods
type: fill-line
order: 7
prompt: |
  Write the call to `p.area()` and print the result. `area` is a
  VALUE-receiver method on `Rect` (no mutation needed — it just
  computes width × height). Same dot-syntax call regardless of
  receiver kind; auto-addressing rule means the call site stays
  uniform.

  Expected output: `12` (3 × 4).
generator:
  kind: template
  vars:
    line:
      - "fmt.Println(p.area())"
  ts: |-
    class Rect { w: number; h: number; area() { return this.w * this.h; } }
    const p = new Rect(); p.w = 3; p.h = 4;
    console.log(p.area());   // 12
  canonical: |-
    package main

    import "fmt"

    type Rect struct {
    	w int
    	h int
    }

    func (r Rect) area() int {
    	return r.w * r.h
    }

    func main() {
    	p := Rect{w: 3, h: 4}
    	${line}
    }
  distractors:
    - match: "fmt.Println(area(p))"
      explain: |-
        `area` is a method on `Rect`, not a free function. Call
        it through the value with the dot: `p.area()`. The
        function-call form `area(p)` is what you'd write if
        `area` were declared as `func area(r Rect) int` (free
        function), which is a DIFFERENT shape.
    - match: "fmt.Println(Rect.area(p))"
      explain: |-
        C# / Java static-dispatch syntax. Go has no
        `TypeName.method(receiver, ...)` form. Methods live on
        instances; the call is always `receiver.method(...)`.
    - match: "fmt.Println(p.w * p.h)"
      explain: |-
        Sidesteps the method entirely. The exercise is asking
        you to CALL `area()` — that's how the API is meant to
        be used. Inlining the math defeats the point.
    - match: "fmt.Println((&p).area())"
      explain: |-
        Verbose but technically valid for a pointer receiver —
        not needed here (area is a value-receiver method),
        AND not idiomatic even for pointer receivers because
        Go's auto-addressing makes the bare `p.method()` work.
expectStdout: |
  12
runtime: yaegi
blanks: [line]
hints:
  - "Same dot-syntax as TS: `p.area()`. Wrap in `fmt.Println` to print the result. Go's auto-addressing rule means no explicit `&` needed even though `area`'s declaration uses a value receiver."
  - "`fmt.Println(p.area())`."
  - "`fmt.Println(p.area())`."
notes: |
  Counterpart to slot 6 — value receiver instead of pointer.
  Together they pin the call-site UNIFORMITY: `p.area()` and
  `c.bump()` look identical even though one's a value-receiver
  method and the other's pointer-receiver. The auto-addressing
  rule (slot 3 MCQ) lets the call site stay clean.

  Distractor 4 — `(&p).area()` — surfaces the explicit-address
  form again. Marked wrong here because (a) area's receiver is
  a VALUE, not a pointer; the address is irrelevant, and (b)
  even for pointer receivers, the bare form is idiomatic.

  Pairs with slot 6 to drill: pointer receiver when MUTATING,
  value receiver when READING. The choice is the developer's;
  the call site doesn't care.
