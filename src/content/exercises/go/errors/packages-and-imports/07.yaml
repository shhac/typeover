target: go
themeId: go/errors/packages-and-imports
type: fill-line
order: 7
prompt: |
  Type the call to `strings.Repeat` that produces `abcabcabc`
  (the string `"abc"` repeated 3 times). This drills the
  package-qualified call pattern from exercise 2's capitalisation
  rule — `Repeat` is capitalised because it's exported by
  `strings`.

  Expected output: `abcabcabc`.
generator:
  kind: template
  vars:
    line:
      - 'fmt.Println(strings.Repeat("abc", 3))'
  ts: |-
    // TS: console.log("abc".repeat(3));
  canonical: |-
    package main

    import (
    	"fmt"
    	"strings"
    )

    func main() {
    	${line}
    }
  distractors:
    - match: 'fmt.Println(Repeat("abc", 3))'
      explain: |-
        Missing `strings.` qualifier. Imported names are
        accessed THROUGH the package — `strings.Repeat`, not
        bare `Repeat`. Unlike TS destructuring, Go imports
        the package whole.
    - match: 'fmt.Println(strings.repeat("abc", 3))'
      explain: |-
        Lowercase `repeat` — that would be package-private.
        `Repeat` is exported (capital R), so the qualifier
        must be `strings.Repeat`.
    - match: 'Println(strings.Repeat("abc", 3))'
      explain: |-
        Missing `fmt.` qualifier on `Println`. Same rule on
        the other side — `fmt.Println`, not bare `Println`.
        Both packages need their qualifier.
    - match: 'strings.Repeat("abc", 3)'
      explain: |-
        Computes the value but doesn't print it. The slot
        wants `Hello, World!`-style output; that means
        wrapping in `fmt.Println(...)`.
expectStdout: |
  abcabcabc
runtime: yaegi
blanks: [line]
hints:
  - "Two package qualifiers: `fmt.Println(...)` wrapping `strings.Repeat(...)`. `Repeat` takes (string, int)."
  - "`fmt.Println(strings.Repeat(\"abc\", 3))`."
  - "See canonical."
notes: |
  Pure exercise of the package-qualified call idiom. Both
  exported names from both imported packages — drills the
  capitalisation rule (slot 2) and the import idiom (slot 3)
  together.

  Distractor #1 ("forget the qualifier") is the most common
  TS-import bleedover; learners coming from `import { x }`
  habits expect `x` to be in scope unqualified.
