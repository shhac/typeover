target: go
themeId: go/errors/type-assertions
type: mcq
order: 3
prompt: |
  Pick the IDIOMATIC Go declaration of a CUSTOM ERROR TYPE —
  the pattern callers will type-assert / type-switch on with
  comma-ok or `errors.As`.

  Custom error types are how you carry STRUCTURED context with
  an error (status codes, field paths, retry hints). The
  pattern: a struct with relevant fields + a pointer-receiver
  `Error() string` method.
generator:
  kind: variant
  variants:
    - id: notfound
      ts: |-
        // TS: class NotFoundError extends Error { id: number; constructor(id: number) { super(); this.id = id; } }
      canonical: |-
        type NotFoundError struct {
        	ID int
        }
        func (e *NotFoundError) Error() string {
        	return fmt.Sprintf("not found: %d", e.ID)
        }
      distractors:
        - |-
          type NotFoundError struct {
            ID int
          }
          // No Error() method — won't satisfy `error` interface
        - |-
          type NotFoundError = error
          func (e *NotFoundError) Error() string {
            return "not found"
          }
        - |-
          type NotFoundError interface {
            ID int
          }
hints:
  - "Two pieces: a struct holding the structured context, AND an `Error() string` method (pointer-receiver convention, theme 3.2 exercise 2 consistency rule). The struct + method together implicitly satisfy the `error` interface (theme 4.1 exercise 2)."
  - "Struct with fields, then a method `Error() string` returning a formatted message — pointer receiver."
  - "`type NotFoundError struct { ... }; func (e *NotFoundError) Error() string { ... }`."
runtime: none
notes: |
  Pulls together: theme 3.1 (struct), theme 3.2 (pointer
  receiver method), theme 4.1 (implicit interface
  satisfaction), theme 5.1 (the `error` interface).

  Distractors:
    1. Struct WITHOUT the Error() method — doesn't satisfy
       the `error` interface. Compile error at the
       `var e error = &NotFoundError{...}` assignment site.
    2. `type X = error` — type ALIAS to error, not a custom
       type. You can't add methods to an alias of a
       predeclared type.
    3. `type X interface { ID int }` — interfaces don't have
       fields. Theme 4.1 slot 1's distractor returns.
