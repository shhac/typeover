target: go
themeId: go/errors/is-and-as
type: mcq
order: 3
prompt: |
  Pick the IDIOMATIC Go declaration of a SENTINEL ERROR — a
  package-scope value callers compare against with `errors.Is`.
  These are how stdlib packages signal specific failure modes
  (e.g., `io.EOF`, `sql.ErrNoRows`, `os.ErrNotExist`).
generator:
  kind: variant
  variants:
    - id: notfound
      ts: |-
        // TS: export const ErrNotFound = Symbol("not found");
        // (or a singleton Error subclass)
      canonical: 'var ErrNotFound = errors.New("not found")'
      distractors:
        - 'const ErrNotFound = "not found"'
        - 'type ErrNotFound struct{}'
        - 'var ErrNotFound = "not found"'
hints:
  - "Package-scope `var`. Exported (capital first letter). Value built with `errors.New(...)`. Convention: prefix the name with `Err` so callers know at a glance it's a sentinel."
  - "`var ErrXxx = errors.New(\"...\")`."
  - "`var ErrNotFound = errors.New(\"not found\")`."
runtime: none
notes: |
  Pins the sentinel-error idiom. Three properties:
    1. `var` at package scope (NOT `const` — errors.New isn't
       a compile-time constant expression).
    2. Exported name (capital first letter, theme 4.1 slot 4
       convention) so callers in other packages can match.
    3. `Err` prefix (the de-facto Go convention — every stdlib
       sentinel uses it).

  Distractors:
    1. `const "not found"` — string constant, not an error.
       Can't be passed to `errors.Is` (wrong type).
    2. `type ErrNotFound struct{}` — declares a TYPE, not an
       instance. Useful if you want `errors.As` matching by
       TYPE, but for `errors.Is`-style sentinel matching you
       need an instance.
    3. `var ErrNotFound = "not found"` — string `var`,
       same problem as #1.

  Slot 6 fill-line will exercise this productively. The
  capstone freeform (slot 8) chains multiple sentinels through
  wrap layers to drill the `errors.Is` traversal.
