target: go
themeId: go/errors/modules-and-gomod
type: mcq
order: 2
prompt: |
  Go module paths look like URLs (`github.com/user/repo`,
  `golang.org/x/text`). Pick the statement that is TRUE about
  module paths.
generator:
  kind: variant
  variants:
    - id: identity
      ts: |-
        // TS: package names are arbitrary identifiers (`react`,
        // `lodash`) plus optional org scope (`@scope/name`).
        // Go uses URL-shaped paths to encode origin + identity.
      canonical: "The path is an IDENTIFIER — it doesn't have to resolve to a live URL; for non-public modules (local, internal) it's still URL-shaped by convention."
      distractors:
        - "The path MUST resolve to a Git repo over HTTPS, or `go build` fails."
        - "Module paths must start with `github.com/` — other hosts are unsupported."
        - "The path is the binary's name; the compiler emits `<path>.exe`."
hints:
  - "Think about what the path means at compile time vs at `go get` time. For internal-only modules, the path is just a unique name."
  - "Resolution to a real URL only matters when you're FETCHING the module (e.g. `go get`). For purely local builds, the path is just an identifier."
  - "Identifier-only: doesn't have to resolve for local builds."
runtime: none
notes: |
  Common misconception coming from npm — TS devs assume the
  module path is the fetch URL. It IS the fetch URL when
  `go get` runs, but for a self-contained codebase that
  imports only its own packages plus stdlib, the path is
  just a unique identifier.

  Distractors:
    1. "MUST resolve" — false. `go build` against local files
       doesn't fetch anything. The path becomes important when
       you `go get` or another module wants to import yours.
    2. "Must start with github.com" — false. Any
       URL-shaped path works; corporate codebases use their
       internal Git host (`git.company.com/team/proj`).
    3. "Path is the binary name" — false. Binary name is the
       last segment of the path (`yourthing`), but the binary
       is produced by `go build` and named based on the
       directory or the `-o` flag — not the full module path.

  This MCQ defuses the "do I need a real GitHub repo?"
  question that often blocks first-time module users.
