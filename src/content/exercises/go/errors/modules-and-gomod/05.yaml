target: go
themeId: go/errors/modules-and-gomod
type: mcq
order: 5
prompt: |
  Pick the line that goes inside a `require ( ... )` block in
  go.mod for the `github.com/google/uuid` dependency at
  version `v1.6.0`.

  TypeScript: `"uuid": "^9.0.0"` in package.json dependencies.
  Go's shape is space-separated `<path> <version>`, with
  semver prefixed by `v`.
generator:
  kind: variant
  variants:
    - id: require-line
      ts: |-
        // TS: "uuid": "^9.0.0"
        // Go: github.com/google/uuid v1.6.0
      canonical: "github.com/google/uuid v1.6.0"
      distractors:
        - '"github.com/google/uuid": "v1.6.0"'
        - "require github.com/google/uuid v1.6.0"
        - "github.com/google/uuid: 1.6.0"
hints:
  - "Two space-separated tokens. No quotes, no colon, no JSON. The version starts with a literal `v`."
  - "`<module-path> <version>`. Version is `v<semver>` (the `v` prefix is mandatory)."
  - "`github.com/google/uuid v1.6.0`."
runtime: none
notes: |
  Mechanical fix on the most common copy-paste mistake.
  Versions in go.mod are tag-shaped (`v1.6.0`) because that's
  the literal Git tag the module proxy fetches.

  Distractors:
    1. JSON-shape with colon — package.json habit; go.mod is
       whitespace-separated key-value.
    2. Includes the leading `require` keyword — wrong because
       inside a `require (...)` block you DON'T repeat the
       keyword on each line (only the BLOCK is prefixed with
       `require`). Single-import `require` lines outside a
       block DO use the keyword.
    3. No `v` prefix — `1.6.0` would be rejected; module
       proxy expects `v1.6.0` matching the Git tag convention.
