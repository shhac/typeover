target: go
themeId: go/errors/the-error-pattern
type: freeform
order: 8
prompt: |
  Write a complete program with `divide(a, b int) (int, error)`
  + a `main` that calls it twice — once with a divisor of 0
  (error case), once with a valid divisor (success case) — and
  prints results / errors appropriately.

  Expected output:
  ```
  error: divide by zero
  result: 5
  ```

  Drills the full (T, error) shape from exercises 1-3 + the
  errors.New construction from exercise 6.

  TypeScript reference:
  ```ts
  function divide(a: number, b: number): { value: number; err: Error | null } {
    if (b === 0) return { value: 0, err: new Error("divide by zero") };
    return { value: a / b, err: null };
  }
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    function divide(a: number, b: number): { value: number; err: Error | null } {
      if (b === 0) return { value: 0, err: new Error("divide by zero") };
      return { value: a / b, err: null };
    }
    let r = divide(10, 0);
    if (r.err) { console.log("error:", r.err.message); }
    r = divide(10, 2);
    if (!r.err) { console.log("result:", r.value); }
  canonical: |-
    package main

    import (
    	"errors"
    	"fmt"
    )

    func divide(a, b int) (int, error) {
    	if b == 0 {
    		return 0, errors.New("divide by zero")
    	}
    	return a / b, nil
    }

    func main() {
    	q, err := divide(10, 0)
    	if err != nil {
    		fmt.Println("error:", err)
    	} else {
    		fmt.Println("result:", q)
    	}
    	q, err = divide(10, 2)
    	if err != nil {
    		fmt.Println("error:", err)
    	} else {
    		fmt.Println("result:", q)
    	}
    }
expectStdout: |
  error: divide by zero
  result: 5
hints:
  - "Three pieces: `divide` returning `(int, error)`, then in main two call-and-check blocks. On the error path: print `\"error:\", err`. On success: print `\"result:\", q`."
  - "`errors.New(\"divide by zero\")` on the bad path; `nil` on the good path."
  - "See canonical."
runtime: yaegi
notes: |
  End-to-end of the basic error pattern. No wrapping, no
  sentinel values, no custom types — just the bare `(T, error)`
  + check-and-branch. Slot 9 will add wrapping with
  `fmt.Errorf %w` + `errors.Is` for unwrapping.
