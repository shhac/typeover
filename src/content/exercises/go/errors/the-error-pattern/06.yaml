target: go
themeId: go/errors/the-error-pattern
type: fill-line
order: 6
prompt: |
  Construct a new error with a string message. `errors.New` is
  the simplest builder — takes a string, returns an `error`.

  The scaffold defines `divide(a, b int) (int, error)`. Write
  the line that returns 0 and a "divide by zero" error when
  `b == 0`. The if-check is already in the scaffold; only the
  return line is missing.

  Expected output:
  ```
  divide by zero
  ```
generator:
  kind: template
  vars:
    line:
      - 'return 0, errors.New("divide by zero")'
  ts: |-
    function divide(a: number, b: number): { value: number; err: Error | null } {
      if (b === 0) return { value: 0, err: new Error("divide by zero") };
      return { value: a / b, err: null };
    }
    const { value, err } = divide(10, 0);
    if (err) { console.log(err.message); }
  canonical: |-
    package main

    import (
    	"errors"
    	"fmt"
    )

    func divide(a, b int) (int, error) {
    	if b == 0 {
    		${line}
    	}
    	return a / b, nil
    }

    func main() {
    	_, err := divide(10, 0)
    	if err != nil {
    		fmt.Println(err)
    	}
    }
  distractors:
    - match: 'return errors.New("divide by zero")'
      explain: |-
        Single-value return — but `divide` returns `(int, error)`,
        two values. You need BOTH: result first, error second.
        On the error path the result is conventionally the zero
        value for its type (here `0` for int).
    - match: 'throw errors.New("divide by zero")'
      explain: |-
        Java/JS keyword leak — Go has no `throw`. Errors are
        RETURNED via the (T, error) tuple, not thrown.
    - match: 'return 0, "divide by zero"'
      explain: |-
        String, not an error. The error slot needs a value that
        SATISFIES the `error` interface (something with an
        `Error() string` method). A bare string doesn't —
        compile error. Use `errors.New("...")` to wrap a string
        into a real error value.
    - match: 'return 0, error("divide by zero")'
      explain: |-
        `error` is a TYPE, not a constructor. There's no
        `error(...)` callable form. Use `errors.New(...)` from
        the stdlib (or `fmt.Errorf` for formatting + wrapping).
expectStdout: |
  divide by zero
runtime: yaegi
blanks: [line]
hints:
  - "Two-value return: zero-value of the result type first, then the error. Build the error with `errors.New(\"...\")` from the stdlib `errors` package."
  - "`return 0, errors.New(\"divide by zero\")`."
  - "`return 0, errors.New(\"divide by zero\")`."
notes: |
  THE basic error-construction shape. Pairs with slot 5 (`nil`
  for the no-error path) and slot 3 (the caller's check-and-
  early-return).

  Distractor bank covers the four most common mis-shapes:
    1. Single-value return — forgets the result.
    2. `throw` — exception-leak.
    3. String instead of error — confuses the slot type.
    4. `error("...")` — confuses type with constructor.

  Yaegi runs `errors.New` cleanly (probed this tick); no
  workaround needed.
