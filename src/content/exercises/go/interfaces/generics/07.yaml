target: go
themeId: go/interfaces/generics
type: fill-line
order: 7
prompt: |
  Instantiate a generic STRUCT type: create a `Pair[string,
  int]` literal holding `{"alice", 30}`. Go's type-parameter
  inference works for FUNCTIONS (no need to write
  `Identity[int](42)`) but for STRUCT LITERALS the type
  arguments are usually explicit.

  The scaffold has the `Pair[K, V]` type, prints `p.K` and `p.V`.
  Type the construction line.

  Expected output:
  ```
  alice
  30
  ```
generator:
  kind: template
  vars:
    line:
      - 'p := Pair[string, int]{Key: "alice", Val: 30}'
  ts: |-
    type Pair<K, V> = { k: K; v: V };
    const p: Pair<string, number> = { k: "alice", v: 30 };
    console.log(p.k);
    console.log(p.v);
  canonical: |-
    package main

    import "fmt"

    type Pair[K, V any] struct {
    	Key K
    	Val V
    }

    func main() {
    	${line}
    	fmt.Println(p.Key)
    	fmt.Println(p.Val)
    }
  distractors:
    - match: 'p := Pair{Key: "alice", Val: 30}'
      explain: |-
        Missing the type arguments. Generic struct literals need
        the type parameters specified: `Pair[string, int]{...}`.
        Type inference for struct literals is limited; explicit
        is the safe form.
    - match: 'p := Pair<string, int>{Key: "alice", Val: 30}'
      explain: |-
        TS-style angle brackets — Go uses SQUARE brackets for
        type arguments at the instantiation site: `Pair[string,
        int]`.
    - match: 'p := new(Pair[string, int]){Key: "alice", Val: 30}'
      explain: |-
        `new(T)` returns a `*T` pointing at a zero-valued T.
        Can't combine with a composite literal (theme 3.1 slot
        2 distractor returns). For "allocate-and-initialise",
        use `&Pair[string, int]{...}` if you want a pointer;
        otherwise the bare composite-literal form.
    - match: 'p := Pair[string, int]{"alice", 30}'
      explain: |-
        Positional literal — works on this struct (matches the
        field order), but theme 3.1 slot 2 flagged this as a
        maintenance hazard. Named fields are the idiomatic
        choice: `Pair[string, int]{Key: "alice", Val: 30}`.
expectStdout: |
  alice
  30
runtime: yaegi
blanks: [line]
hints:
  - "Generic instantiation at a literal site: TypeName followed by `[<type-args>]` and the composite literal: `Pair[string, int]{K: ..., V: ...}`. Square brackets for the type list, named fields inside the brace."
  - "`p := Pair[string, int]{K: \"alice\", V: 30}`."
  - "`p := Pair[string, int]{K: \"alice\", V: 30}`."
notes: |
  Demonstrates GENERIC TYPE instantiation (struct), as opposed
  to slot 6's generic FUNCTION instantiation. Functions infer
  the type argument from value arguments; struct literals don't
  (in general), so explicit type arguments are the norm.

  Distractor bank covers the four most common confusions:
    1. Missing type args — inference doesn't cover this case.
    2. TS angle brackets — keyword leak.
    3. `new(T){...}` — theme 3.1 slot 2 distractor returns.
    4. Positional literal — theme 3.1 slot 2's anti-pattern.

  Sets up slot 8 (generic Stack) by demonstrating that struct
  type parameters can be USED at the type-arg list AND in the
  field types.
