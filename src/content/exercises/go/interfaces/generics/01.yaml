target: go
themeId: go/interfaces/generics
type: mcq
order: 1
prompt: |
  Translate the TypeScript generic identity function to Go.
  Generics landed in Go 1.18 and look almost like TS — type
  parameters in SQUARE BRACKETS, before the value parameters.
generator:
  kind: variant
  variants:
    - id: identity
      ts: |-
        function identity<T>(v: T): T {
          return v;
        }
      canonical: |-
        func Identity[T any](v T) T {
        	return v
        }
      distractors:
        - |-
          func Identity<T>(v T) T {
            return v
          }
        - |-
          func Identity(v any) any {
            return v
          }
        - |-
          func [T any] Identity(v T) T {
            return v
          }
    - id: first
      ts: |-
        function first<T>(xs: T[]): T {
          return xs[0];
        }
      canonical: |-
        func First[T any](xs []T) T {
        	return xs[0]
        }
      distractors:
        - |-
          func First<T>(xs []T) T {
            return xs[0]
          }
        - |-
          func First(xs []any) any {
            return xs[0]
          }
        - |-
          func [T any] First(xs []T) T {
            return xs[0]
          }
    - id: wrap
      ts: |-
        function wrap<T>(v: T): T[] {
          return [v];
        }
      canonical: |-
        func Wrap[T any](v T) []T {
        	return []T{v}
        }
      distractors:
        - |-
          func Wrap<T>(v T) []T {
            return [v]
          }
        - |-
          func Wrap(v any) []any {
            return []any{v}
          }
        - |-
          func [T any] Wrap(v T) []T {
            return []T{v}
          }
hints:
  - "Type parameters go in SQUARE BRACKETS (Go uses `[T any]`, NOT TypeScript's `<T>`). They appear BEFORE the value parameters, AFTER the function name."
  - "Shape: `func Name[T any](params) returns { body }`. The `any` is the constraint — it means \"any type\" (no restriction)."
  - "`func Identity[T any](v T) T { ... }`."
runtime: none
notes: |
  Theme 4.2 opener. Generics syntax in Go differs from TS in
  just the brackets (`[]` not `<>`) and the constraint placement
  (each param needs an explicit constraint — `any` is the
  permissive default). Otherwise the mental model transfers.

  Distractors:
    1. `<T>` angle brackets — TS keyword leak. Go uses square
       brackets to avoid the ambiguity with shift operators
       that bedevils C++/Java/TS.
    2. `(v any) any` — non-generic; loses the type relationship
       between input and output. Calling `Identity[int](42)`
       returns `int`; the `any any` version returns `any`,
       which the caller has to type-assert.
    3. `func [T any] Name(...)` — type parameters in the wrong
       position. They go AFTER the function name, BEFORE the
       value parameter list.

  Convention note: type parameter names are conventionally
  capital single letters (T, K, V, E). Lowercase works but
  isn't idiomatic.
