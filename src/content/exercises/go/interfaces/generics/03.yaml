target: go
themeId: go/interfaces/generics
type: mcq
order: 3
prompt: |
  TypeScript constrains a generic with a union of literal types
  or a base interface. Go uses a TYPE SET constraint — a
  union of TYPES, separated by `|`, written inline as the
  constraint expression OR named as an interface.

  Pick the Go form that constrains `T` to either `int` OR
  `float64`.
generator:
  kind: variant
  variants:
    - id: minfn
      ts: |-
        function min<T extends number | bigint>(a: T, b: T): T { ... }
      canonical: "func Min[T int | float64](a, b T) T { ... }"
      distractors:
        - "func Min[T extends int | float64](a, b T) T { ... }"
        - "func Min<T extends int | float64>(a, b T) T { ... }"
        - "func Min[T any: int | float64](a, b T) T { ... }"
    - id: addfn
      ts: |-
        function add<T extends number | string>(a: T, b: T): T { ... }
      canonical: "func Add[T int | string](a, b T) T { ... }"
      distractors:
        - "func Add[T extends int | string](a, b T) T { ... }"
        - "func Add<T extends int | string>(a, b T) T { ... }"
        - "func Add[T any: int | string](a, b T) T { ... }"
    - id: doublefn
      ts: |-
        function double<T extends number>(v: T): T { ... }
      canonical: "func Double[T int | float64](v T) T { ... }"
      distractors:
        - "func Double[T extends int | float64](v T) T { ... }"
        - "func Double<T extends int | float64>(v T) T { ... }"
        - "func Double[T any: int | float64](v T) T { ... }"
hints:
  - "Type-set syntax: just `[T <type1> | <type2> | ...]`. NO `extends` keyword, NO `<>` brackets, NO `any:` prefix — the type list IS the constraint."
  - "Shape: `[T int | float64]`. The constraint sits where `any` would; instead of \"any type\" it says \"any of these types\"."
  - "`func Min[T int | float64](...)`."
runtime: none
notes: |
  Inline type-set constraints. The cleaner named form (a
  CONSTRAINT INTERFACE):
    ```go
    type Number interface { int | float64 }
    func Min[T Number](a, b T) T { ... }
    ```
  …is more idiomatic for reusable constraints. Slot 9 freeform
  will exercise the named form; this slot covers the inline form
  so the relationship to TS unions is clearest.

  Distractors:
    1. `extends` keyword — TS leak.
    2. `<>` brackets — TS leak.
    3. `any:` prefix — invented form, looks like it might mix
       `any` and the type set.

  Performance / pedagogy note: type-set constraints are
  REFERENCE-COUNTED at runtime (in some Go implementations),
  but the conceptual model is "compile-time monomorphisation
  with a runtime tag." Out of scope for this slot.
