target: go
themeId: go/interfaces/interfaces
type: freeform
order: 9
prompt: |
  Theme capstone — interface COMPOSITION via embedding. Build:

  1. `type Reader interface { Read() string }`
  2. `type Writer interface { Write(s string) }`
  3. `type ReadWriter interface { Reader; Writer }` — composes
     both via embedding. ReadWriter requires BOTH methods.
  4. `type Buf struct { s string }` with pointer-receiver
     methods `Read() string` returning `b.s` and `Write(s
     string)` setting `b.s = s`. Buf satisfies ReadWriter
     implicitly.
  5. In `main`: `var rw ReadWriter = &Buf{}; rw.Write("hi");
     fmt.Println(rw.Read())`.

  Expected output: `hi`.

  Drills interface composition (the embedded-interface idiom,
  pattern `io.ReadWriter` from the stdlib). This is the second
  load-bearing interface beat after implicit satisfaction.

  TypeScript reference:
  ```ts
  interface Reader { read(): string }
  interface Writer { write(s: string): void }
  interface ReadWriter extends Reader, Writer {}
  class Buf implements ReadWriter {
    s = "";
    read() { return this.s; }
    write(s: string) { this.s = s; }
  }
  const rw: ReadWriter = new Buf();
  rw.write("hi");
  console.log(rw.read());
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    interface Reader { read(): string }
    interface Writer { write(s: string): void }
    interface ReadWriter extends Reader, Writer {}
    class Buf implements ReadWriter {
      s = "";
      read() { return this.s; }
      write(s: string) { this.s = s; }
    }
    const rw: ReadWriter = new Buf();
    rw.write("hi");
    console.log(rw.read());
  canonical: |-
    package main

    import "fmt"

    type Reader interface {
    	Read() string
    }

    type Writer interface {
    	Write(s string)
    }

    type ReadWriter interface {
    	Reader
    	Writer
    }

    type Buf struct {
    	s string
    }

    func (b *Buf) Read() string {
    	return b.s
    }

    func (b *Buf) Write(s string) {
    	b.s = s
    }

    func main() {
    	var rw ReadWriter = &Buf{}
    	rw.Write("hi")
    	fmt.Println(rw.Read())
    }
expectStdout: |
  hi
hints:
  - "Composition: list the embedded interfaces inside the new interface's brace, one per line, no commas. `type ReadWriter interface { Reader; Writer }` says ReadWriter has every method of Reader AND every method of Writer."
  - "Buf needs POINTER receivers because Write mutates b.s. The assignment `var rw ReadWriter = &Buf{}` passes a pointer so Buf's pointer-receiver methods satisfy the interface."
  - "See canonical."
runtime: yaegi
notes: |
  Theme 4.1 capstone. Composition is THE second pillar of Go
  interfaces (after implicit satisfaction). The stdlib uses it
  everywhere — `io.ReadWriter`, `io.ReadWriteCloser`,
  `sort.Interface`, `error` chains.

  Pointer-receiver requirement is load-bearing here: Write
  mutates the struct, so it has to be `*Buf`. The interface
  variable `var rw ReadWriter = &Buf{}` takes a pointer so the
  pointer-receiver methods participate.

  Theme 4.1 done. Next: theme 4.2 generics (which the slot-6
  fill-line interface idiom forward-references — same
  composition shape, type parameters added).
