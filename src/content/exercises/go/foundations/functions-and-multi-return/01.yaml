target: go
themeId: go/foundations/functions-and-multi-return
type: mcq
order: 1
prompt: |
  TypeScript and Go both have first-class functions, but the syntax
  differs in three reflexive ways. Pick the Go translation.
generator:
  kind: variant
  variants:
    - id: double
      ts: 'function double(x: number): number { return x * 2; }'
      canonical: 'func double(x int) int { return x * 2 }'
      distractors:
        - 'function double(x int) int { return x * 2 }'
        - 'func double(x: int): int { return x * 2 }'
        - 'def double(x int) -> int { return x * 2 }'
    - id: greet
      ts: 'function greet(name: string): string { return "hi " + name; }'
      canonical: 'func greet(name string) string { return "hi " + name }'
      distractors:
        - 'function greet(name string) string { return "hi " + name }'
        - 'func greet(name: string): string { return "hi " + name }'
        - 'func greet(string name) string { return "hi " + name }'
    - id: is-zero
      ts: 'function isZero(n: number): boolean { return n === 0; }'
      canonical: 'func isZero(n int) bool { return n == 0 }'
      distractors:
        - 'function isZero(n int) bool { return n == 0 }'
        - 'func isZero(n int): boolean { return n == 0 }'
        - 'func isZero(n int) bool { return n === 0 }'
hints:
  - "Three reflexive shifts from TS: the keyword is `func` (not `function`); the parameter type goes *after* the name with no colon (not `name: type`); and the return type goes *after* the closing paren with no colon either (not `: type`)."
  - "Shape: `func name(arg type) returnType { body }`. The Go type system is positional — types follow the name they're describing in every context. The colons are TS-only."
  - "For `function double(x: number): number`, Go writes `func double(x int) int`. Booleans use `bool` (not `boolean`); equality is `==` (not `===`)."
notes: |
  First Theme 6 exercise. The most reflexive translation in the
  module — every TS dev's `function` muscle memory rewires here.
  Three shifts to drill:
   - Keyword: `func`, not `function`
   - Positional types: name first, then type (no `:`)
   - Return type: after the param list (no `:`)

  Plus two reminders of earlier-theme content: `bool` (not
  `boolean`) and `==` (not `===`) inside the body.

  Variants cover:
   - Numeric in / out (the canonical primitive case)
   - String in / out (mixes in a `string` parameter type)
   - Boolean return (`bool` reminder + `==` from Theme 4)

  Distractors:
   - Keep `function` keyword (TS leakage)
   - Keep TS-style colons in either parameter or return position
   - Other-language shapes (Python def + arrow, C-style `type name`)
   - For the third variant: keep `===` to test that the body-syntax
     reminder lands

  Variant kind so each example is self-contained at the
  syntax/semantic level.
runtime: none
