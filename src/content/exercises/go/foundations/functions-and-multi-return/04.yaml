target: go
themeId: go/foundations/functions-and-multi-return
type: mcq
order: 4
prompt: |
  Exercise 3 covered the `(T, error)` return-tuple signature. To put a
  *value* into the error half of that tuple, Go uses a tiny stdlib
  helper. Which one constructs a new error from a string?
generator:
  kind: template
  vars:
    msg:
      - "empty input"
      - "not found"
      - "timed out"
      - "invalid id"
      - "out of range"
  ts: |-
    new Error("${msg}")
  canonical: |-
    errors.New("${msg}")
  distractors:
    - 'error.new("${msg}")'
    - 'new Error("${msg}")'
    - 'Error("${msg}")'
    - 'errors.Error("${msg}")'
hints:
  - |-
    Go's `error` is an interface — `Error() string`. To build one
    from a string, you reach for the `errors` package. The
    constructor takes the message and returns an `error` value
    ready to be returned alongside the zero-value.
  - |-
    Shape: `errors.New("message")`. Lowercase package, capital
    function name (Go's "exported identifier starts uppercase"
    rule). Returns an `error`, not a string.
  - |-
    `errors.New("${msg}")`
notes: |
  Introduced 2026-05-20 to fix a design-docs/02 MCQ-first
  violation flagged by the foundations theme audit. The previous
  slot 6 fill-line (now slot 7) required the learner to produce
  `errors.New(...)` in the blank, but the construction never
  appeared in any prior MCQ — only the signature shape did. This
  MCQ is the recognition slot; the fill-line three slots later
  is the production slot.

  Distractors:
    1. `error.new("...")` — wrong capitalisation (Go is case
       sensitive; package `errors`, function `New`).
    2. `new Error("...")` — JavaScript / TypeScript shape.
    3. `Error("...")` — looks like a constructor; Go's built-in
       `error` is an interface, not callable.
    4. `errors.Error("...")` — wrong function name; the function
       is named after what it does (`New`), not the type it
       returns.
runtime: none
