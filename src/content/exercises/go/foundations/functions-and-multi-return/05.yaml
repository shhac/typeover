target: go
themeId: go/foundations/functions-and-multi-return
type: fill-word
order: 5
prompt: |
  Slot 1 covered the function-signature shape by recognition. Now
  produce it: fill in the keyword and the return type.
generator:
  kind: template
  vars:
    name: [double, square, increment, halve, negate]
    kw: [func]
    type: [int]
  ts: |-
    function ${name}(x: number): number { return x * 2; }
  canonical: |-
    ${kw} ${name}(x int) ${type} { return x * 2 }
blanks: [kw, type]
hints:
  - "Two blanks. The keyword that introduces a function in Go is four letters, not eight. The return type — for an integer literal arithmetic result — is the same default integer type Theme 2 established."
  - "Keyword: `func`. Return type: `int`."
  - "Canonical: `func double(x int) int { return x * 2 }`."
notes: |
  First Theme 6 fill-word. Drills the function-signature reflex from
  slot 1's MCQ via production. Two blanks: keyword `func` and the
  return type `int` (Theme 2 reminder).

  The parameter `x int` is filled in (literal), since the type-after-
  name reflex was already covered explicitly in slot 1. Slot 4 focuses
  on the two most-confusable TS→Go shifts: `function` → `func`, and
  the return type *position* (after the params, no colon).
runtime: none
