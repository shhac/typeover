target: go
themeId: go/foundations/numeric-primitives
type: fill-word
order: 4
prompt: |
  Exercise 2 covered which Go type a decimal literal defaults to. Now
  write it — fill in the keyword and the type so the Go declaration
  is explicit about both.
generator:
  kind: template
  vars:
    name: [pi, ratio, factor, gravity, scale]
    value: ["3.14", "1.5", "0.5", "9.8", "2.0"]
    kw: [var]
    type: [float64]
  ts: |-
    let ${name}: number = ${value};
  canonical: |-
    ${kw} ${name} ${type} = ${value}
blanks: [kw, type]
hints:
  - "Two blanks. The keyword introduces a typed declaration in Go (it's not `let`, not `:=`). The type is what exercise 2 covered as the default for a decimal literal."
  - "Keyword: `var`. Type: ends in `64` and starts with the word for floating-point."
  - "Fills: `var` and `float64`."
notes: |
  Companion to slot 2's MCQ. Same template shape as Theme 1's
  exercise 5 (var + int) but for floating-point — drills the same
  mechanic across both numeric categories so the learner has
  reflexes for either.

  As with prior fill-words, the literal-pool trick (`kw: [var]`,
  `type: [float64]`) models constants as single-element template
  vars. Still parked against task #38 (schema-level `literals:`
  field) — now five fill-word exercises use this pattern across
  two themes; consolidation time draws nearer.
runtime: none
