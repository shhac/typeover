target: go
themeId: go/foundations/numeric-primitives
type: mcq
order: 2
prompt: |
  Adding a decimal point to a literal changes its default Go type.
  Pick the Go translation of this TS.
generator:
  kind: template
  vars:
    name: [pi, ratio, factor, gravity, scale]
    value: ["3.14", "1.5", "0.5", "9.8", "2.0"]
  ts: |-
    let ${name}: number = ${value};
  canonical: |-
    var ${name} float64 = ${value}
  distractors:
    - "var ${name} float = ${value}"
    - "var ${name} number = ${value}"
    - "var ${name} int = ${value}"
hints:
  - "Floating-point in Go uses a numbered suffix — Go is explicit about width here in a way TS isn't. There's no plain `float` type."
  - "Two options: `float32` and `float64`. The default — the one you'd reach for unless you have a memory budget reason — is the wider one."
  - "`var ${name} float64 = ${value}`"
notes: |
  Pairs with slot 1: same `let name: number = value` translation,
  but a decimal literal switches the answer to `float64`. Teaches
  that Go's "default" depends on the literal shape, not just the
  TS annotation.

  Distractors:
   - `float` — doesn't exist as a bare type in Go.
   - `number` — TypeScript's name again.
   - `int` — would actually fail to compile (`3.14` can't initialise
     an `int`). Pedagogically useful: shows that the default-type
     inference is not arbitrary; it's anchored to the literal.
runtime: none
