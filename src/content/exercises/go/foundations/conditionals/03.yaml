target: go
themeId: go/foundations/conditionals
type: mcq
order: 3
prompt: |
  TypeScript's `switch` falls through unless you explicitly `break`
  out of each case — forget a break and execution drops into the
  next case (a classic source of bugs). Go reversed this default:
  each case ends implicitly. Pick the idiomatic Go translation.
generator:
  kind: variant
  variants:
    - id: small-numbers
      ts: |
        switch (n) {
          case 1: doOne(); break;
          case 2: doTwo(); break;
          default: doDefault();
        }
      canonical: |-
        switch n {
        case 1:
            doOne()
        case 2:
            doTwo()
        default:
            doDefault()
        }
      distractors:
        - |-
          switch n {
          case 1:
              doOne()
              break
          case 2:
              doTwo()
              break
          default:
              doDefault()
          }
        - |-
          switch (n) {
          case 1: doOne()
          case 2: doTwo()
          default: doDefault()
          }
        - |-
          switch n:
              case 1: doOne()
              case 2: doTwo()
              default: doDefault()
    - id: string-match
      ts: |
        switch (kind) {
          case "add": handleAdd(); break;
          case "rm": handleRemove(); break;
          default: unknown();
        }
      canonical: |-
        switch kind {
        case "add":
            handleAdd()
        case "rm":
            handleRemove()
        default:
            unknown()
        }
      distractors:
        - |-
          switch kind {
          case "add":
              handleAdd()
              break
          case "rm":
              handleRemove()
              break
          default:
              unknown()
          }
        - |-
          switch (kind) {
          case "add": handleAdd();
          case "rm": handleRemove();
          default: unknown();
          }
        - |-
          match kind {
              "add" => handleAdd(),
              "rm" => handleRemove(),
              _ => unknown(),
          }
hints:
  - "Three differences from TS: no parens around the value being switched, no explicit `break` after each case, and Go's syntax doesn't use a colon-and-brace style like Rust's `match`. Each case ends when the next `case` or `default` keyword appears."
  - "If you want the *opposite* behaviour — to fall through to the next case — Go has a `fallthrough` keyword you can put as the last statement in a case. It's rare in practice. Default is no fall-through."
  - "The canonical drops the `break` from each case. Same shape as the TS but cleaner — no parens around `n`, no `break` at the end of cases. `default` works the same."
notes: |
  Teaches the most pragmatic switch difference: Go reversed C's
  default fall-through. This is the single biggest TS→Go gotcha
  in switch statements (forgotten `break` in TS is a real bug
  source; the Go default just removes the problem).

  Variants cover the two common shapes: numeric dispatch and
  string-keyed dispatch. Both are realistic — handler routing
  and command parsing are everyday Go.

  Distractors:
   - Same canonical *with* explicit `break` — would compile in Go
     (break is allowed as a no-op in cases) but is unidiomatic
     noise. Real Go programmers spot this immediately.
   - Optional parens with the TS-style one-line case bodies.
   - Other-language syntax: Python-style colon dispatch and
     Rust-style `match` with `=>`. Both clearly wrong but
     plausible-looking traps.

  Variant kind for the same reason as slots 1 and 2 — each
  scenario has its own data shape.
runtime: none
