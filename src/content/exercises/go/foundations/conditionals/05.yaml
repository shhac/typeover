target: go
themeId: go/foundations/conditionals
type: fill-word
order: 5
prompt: |
  Theme 4 slot 2 covered the short-statement-if form. Now write
  the comparison: fill in the operator and the nil literal that Go
  uses for "result of this call is empty/not-found."
generator:
  kind: template
  vars:
    fname: [openFile, lookup, parse, fetch]
    arg: [path, id, s, url]
    err: [err]
    op: ["!="]
    nil_lit: [nil]
  ts: |-
    const ${err} = ${fname}(${arg});
    if (${err} !== null) { return ${err}; }
  canonical: |-
    if ${err} := ${fname}(${arg}); ${err} ${op} ${nil_lit} { return ${err} }
blanks: [op, nil_lit]
hints:
  - "Two blanks. Go uses the same comparison operators as TS but without the strict-equality variants. The 'empty' / 'no value' marker also differs from TS — Go doesn't have null or undefined."
  - "The operator is two characters, the same one TS uses for not-equal-loose-equality. The literal is four letters, lowercase, and Go's pre-declared name for the zero value of pointers/interfaces/maps/etc."
  - "`!=` and `nil`. Canonical: `if err := f(arg); err != nil { return err }`."
notes: |
  First Theme 4 fill-word. Drills production of the short-
  statement-if comparison shape — the canonical Go error check
  that dominates real codebases. The learner saw it in the slot 2
  MCQ; now they write the operator and nil literal themselves.

  The setup half of the canonical (`if err := f(arg);`) is fully
  filled in so the learner can focus on what slot 2 introduced
  conceptually: `!= nil` instead of `!== null`.
runtime: none
