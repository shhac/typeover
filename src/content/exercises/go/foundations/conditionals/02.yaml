target: go
themeId: go/foundations/conditionals
type: mcq
order: 2
prompt: |
  Go has a special form of `if` that lets you declare and check a
  value in one statement, scoping the declaration to the if/else
  block. This is how virtually all error-handling in real Go reads.
  Pick the idiomatic translation.
generator:
  kind: variant
  variants:
    - id: open-file
      ts: |
        const err = openFile(path);
        if (err !== null) {
          return err;
        }
      canonical: 'if err := openFile(path); err != nil { return err }'
      distractors:
        - 'err := openFile(path); if err != nil { return err }'
        - 'if err = openFile(path); err != nil { return err }'
        - 'if (err := openFile(path)) != nil { return err }'
    - id: lookup-user
      ts: |
        const user = lookup(id);
        if (user !== null) {
          greet(user);
        }
      canonical: 'if user := lookup(id); user != nil { greet(user) }'
      distractors:
        - 'user := lookup(id); if user != nil { greet(user) }'
        - 'if (user := lookup(id)); user != nil { greet(user) }'
        - 'let user = lookup(id); if user !== null { greet(user) }'
    - id: parse-number
      ts: |
        const n = parseNumber(s);
        if (n !== 0) {
          process(n);
        }
      canonical: 'if n := parseNumber(s); n != 0 { process(n) }'
      distractors:
        - 'n := parseNumber(s); if n != 0 { process(n) }'
        - 'if n := parseNumber(s) != 0 { process(n) }'
        - 'if (n := parseNumber(s); n != 0) { process(n) }'
hints:
  - "Go's shape is `if SETUP; CONDITION { body }` — note the semicolon between setup and condition. The setup declares with `:=`, not `=`. The whole thing is one statement; the declaration is scoped to the if/else block, not the surrounding function."
  - "Watch the distinctions: `:=` for declaration (not `=`), no parens anywhere, and the semicolon is *required* between setup and condition."
  - "The pattern is `if name := call(); name != nil { ... }`. The two-statement form (declare first, then check) also works, but the inline form scopes `name` to just the if and signals 'check the result of this call' in one phrase."
notes: |
  Teaches Go's most distinctive control-flow idiom — the short-
  statement-if. This pattern dominates Go codebases (every err-
  returning call uses it), so introducing it early is high-value.

  Three variants cover three real shapes: error-returning I/O, a
  lookup that may return nil, and a parse that may return zero.
  All three are concrete real-world cases the learner will see in
  practice.

  Distractors:
   - Two-statement form (declare separately, then check) — also
     compiles but loses the scoping and is unidiomatic when the
     result is only used inside the if.
   - `if err = openFile(path)` — `=` instead of `:=`. Compiles if
     `err` was previously declared, but in this context shadows
     the wrong thing.
   - Wrong paren placement (`(err := f()) != nil`) — looks
     plausible but Go grammar doesn't accept `:=` as an
     expression; it's only a statement.
   - TS-style with `let` and `===` — illustrates that the *Go*
     equivalent must drop both.

  Variant kind because each scenario has its own function and
  return-type semantics that don't templatise cleanly.
runtime: none
