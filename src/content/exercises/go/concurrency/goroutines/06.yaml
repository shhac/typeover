target: go
themeId: go/concurrency/goroutines
type: fill-line
order: 6
prompt: |
  Write the launch line — start an anonymous function as a
  goroutine that prints `"hi from goroutine"` and signals
  completion by sending `true` on the `done` channel.

  Expected output: `hi from goroutine`.
generator:
  kind: template
  vars:
    line:
      - 'go func() { fmt.Println("hi from goroutine"); done <- true }()'
  ts: |-
    // TS: setTimeout(() => { console.log("hi"); done.resolve(); }, 0);
  canonical: |-
    package main

    import "fmt"

    func main() {
    	done := make(chan bool)
    	${line}
    	<-done
    }
  distractors:
    - match: 'func() { fmt.Println("hi from goroutine"); done <- true }()'
      explain: |-
        Missing the `go` keyword — this runs the anonymous
        function SYNCHRONOUSLY. It still prints, but it's
        not a goroutine. The slot specifically wants concurrent
        execution.
    - match: 'go func() { fmt.Println("hi from goroutine"); done <- true }'
      explain: |-
        Missing the trailing `()` — without it you've defined
        the function but never INVOKED it. `go` needs a
        function CALL, not a function VALUE. Pattern:
        `go func() { ... }()` — definition + immediate
        invocation.
    - match: 'go func() { fmt.Println("hi from goroutine") }()'
      explain: |-
        Missing the `done <- true` send — main's `<-done`
        will block forever waiting for a send that never
        comes. (Yaegi reports a deadlock; real Go panics
        with `all goroutines are asleep - deadlock!`.)
expectStdout: |
  hi from goroutine
runtime: yaegi
blanks: [line]
hints:
  - "Three pieces: `go` keyword, anonymous function body with `fmt.Println(...)` and `done <- true`, trailing `()` to invoke."
  - "`go func() { fmt.Println(\"hi from goroutine\"); done <- true }()`."
  - "See canonical."
notes: |
  First runnable goroutine slot. The `done <- true` + `<-done`
  pair is the simplest synchronisation primitive — a
  rendezvous. Theme 6.2 (channels) drills this pattern more
  deeply; here it just gates main's exit so the goroutine's
  output isn't lost.

  Yaegi handles this cleanly per the 2026-05-21 probe in
  design-docs/30.
