target: go
themeId: go/concurrency/sync
type: fill-line
order: 6
prompt: |
  Write the two lines that guard `count++` with the
  defer-unlock idiom. The scaffold declares `var mu
  sync.Mutex` and `count := 0`. Type the lock + deferred
  unlock pair.

  Expected output: `1`.
generator:
  kind: template
  vars:
    line:
      - "mu.Lock(); defer mu.Unlock()"
  ts: |-
    // TS: await mu.acquire(); try { ... } finally { mu.release(); }
  canonical: |-
    package main

    import (
    	"fmt"
    	"sync"
    )

    func increment(mu *sync.Mutex, count *int) {
    	${line}
    	*count++
    }

    func main() {
    	var mu sync.Mutex
    	count := 0
    	increment(&mu, &count)
    	fmt.Println(count)
    }
  distractors:
    - match: "mu.Lock(); mu.Unlock()"
      explain: |-
        Bare unlock instead of `defer mu.Unlock()`. Works for
        happy path but loses panic-safety and early-return
        safety. The defer is the canonical idiom.
    - match: "defer mu.Lock(); defer mu.Unlock()"
      explain: |-
        Defers the LOCK — meaning the work happens BEFORE
        the lock acquires. The lock has to happen IMMEDIATELY;
        only the unlock is deferred.
    - match: "mu.Lock(); defer mu.Lock()"
      explain: |-
        Defers another Lock instead of Unlock — would
        deadlock on the next iteration.
expectStdout: |
  1
runtime: yaegi
blanks: [line]
hints:
  - "Two statements on one line, semicolon-separated: `mu.Lock()` (acquires immediately) and `defer mu.Unlock()` (releases on function return)."
  - "`mu.Lock(); defer mu.Unlock()`."
  - "`mu.Lock(); defer mu.Unlock()`."
notes: |
  Drills the lock-defer-unlock idiom from MCQ slot 2.
  Author note: `increment` takes pointers because Go's
  function args are pass-by-value — without the pointer,
  changes to `count` wouldn't survive return (theme 3.1
  slot 6 lesson).

  Yaegi handles sync.Mutex cleanly per the 2026-05-21 probe
  + sync-vendor.
