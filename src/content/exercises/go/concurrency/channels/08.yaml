target: go
themeId: go/concurrency/channels
type: freeform
order: 8
prompt: |
  Build a small program demonstrating the producer-consumer
  pattern with a buffered channel and `for v := range ch`.

  1. Make a buffered channel `ch := make(chan int, 3)`.
  2. Send `1`, `2`, `3` (in that order).
  3. Call `close(ch)`.
  4. Use `for v := range ch { ... }` to drain and print each
     value.

  Expected output:
  ```
  1
  2
  3
  ```

  The range loop reads until the channel is both closed AND
  drained. Without `close(ch)` the loop would block forever
  after draining the buffer.
generator:
  kind: template
  vars: {}
  ts: |-
    // TS: const buf = [1, 2, 3]; for (const v of buf) console.log(v);
  canonical: |-
    package main

    import "fmt"

    func main() {
    	ch := make(chan int, 3)
    	ch <- 1
    	ch <- 2
    	ch <- 3
    	close(ch)
    	for v := range ch {
    		fmt.Println(v)
    	}
    }
expectStdout: |
  1
  2
  3
hints:
  - "Four pieces: `make(chan int, 3)`, three `ch <-` sends, `close(ch)`, then `for v := range ch { fmt.Println(v) }`."
  - "Range needs the close to terminate. Without it the loop hangs after draining the buffer."
  - "See canonical."
runtime: yaegi
notes: |
  First freeform of the theme. Drills the most ergonomic
  channel-drain idiom (`for v := range ch`) plus its
  dependence on close.

  Single-goroutine intentionally — keeps the example small
  while drilling the buffered-channel + range + close
  triad. Slot 9 adds the goroutine.
