target: go
themeId: go/concurrency/channels
type: fill-word
order: 4
prompt: |
  Type the keyword that declares a channel TYPE. Like `slice`
  uses `[]T` and `map` uses `map[K]V`, channels use this
  keyword followed by their element type.
generator:
  kind: template
  vars:
    word:
      - "chan"
  ts: |-
    // TS: no equivalent.
  canonical: |-
    package main

    import "fmt"

    func main() {
    	ch := make(${word} int, 2)
    	ch <- 10
    	ch <- 20
    	close(ch)
    	for v := range ch {
    		fmt.Println(v)
    	}
    }
runtime: none
blanks: [word]
hints:
  - "Four letters, lowercase. Short for the English word `channel`."
  - "`chan`."
  - "`chan`."
notes: |
  Pin the keyword. The surrounding code shows the full
  buffered-channel + close + range idiom that slots 7-9
  build on.

  Yaegi handles buffered channels + range over close
  cleanly per the 2026-05-21 probe.
