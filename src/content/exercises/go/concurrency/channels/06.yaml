target: go
themeId: go/concurrency/channels
type: fill-line
order: 6
prompt: |
  Write the receive line that reads from `ch` and stores the
  value in a new variable `v`.

  Expected output: `42`.
generator:
  kind: template
  vars:
    line:
      - "v := <-ch"
  ts: |-
    // TS analog: const v = await ch.next(); — but Go's receive is sync.
  canonical: |-
    package main

    import "fmt"

    func main() {
    	ch := make(chan int, 1)
    	ch <- 42
    	${line}
    	fmt.Println(v)
    }
  distractors:
    - match: "v := ch->"
      explain: |-
        Wrong arrow direction. Go's receive operator is `<-`
        BEFORE the channel name (`<-ch`); the `->` shape
        isn't valid Go.
    - match: "v := ch<-"
      explain: |-
        That's the SEND direction (channel `<-` value). The
        receive flips the arrow: `<-ch` reads FROM the
        channel.
    - match: "v := receive(ch)"
      explain: |-
        Java/C-style function call; Go's receive is an
        OPERATOR (`<-`), not a function. The `<-` operator
        is the language-level primitive.
expectStdout: |
  42
runtime: yaegi
blanks: [line]
hints:
  - "Receive is an operator: `<-ch` (arrow pointing TOWARDS you from the channel). Pattern: `v := <-ch`."
  - "`v := <-ch`."
  - "`v := <-ch`."
notes: |
  Drill the receive operator. Pairs with slot 4's send
  shape (`ch <- v`) — the asymmetry of the arrow is
  visually informative: arrow leaves you on send, arrives at
  you on receive.

  Yaegi handles buffered single-value send/receive cleanly.
