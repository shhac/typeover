target: go
themeId: go/concurrency/channels
type: freeform
order: 9
prompt: |
  Theme 6.2 capstone — producer goroutine + consumer in main,
  coordinated entirely by a channel and its close.

  1. Make an unbuffered channel `ch := make(chan int)`.
  2. Launch a goroutine that:
     - Sends `1`, `2`, `3` on `ch`.
     - Calls `close(ch)` when done.
  3. In main, use `for v := range ch { fmt.Println(v) }` to
     drain.

  Expected output:
  ```
  1
  2
  3
  ```

  This is the canonical producer-consumer shape. The
  unbuffered channel synchronises each send with its
  corresponding receive — every iteration of the producer's
  loop blocks until the consumer is ready to read. The close
  is what lets main's range terminate cleanly.
generator:
  kind: template
  vars: {}
  ts: |-
    // TS: async generator + for-await loop.
  canonical: |-
    package main

    import "fmt"

    func main() {
    	ch := make(chan int)
    	go func() {
    		for i := 1; i <= 3; i++ {
    			ch <- i
    		}
    		close(ch)
    	}()
    	for v := range ch {
    		fmt.Println(v)
    	}
    }
hints:
  - "Three pieces: unbuffered `make(chan int)`, anonymous goroutine that sends 1..3 then closes, main consumer using `for v := range ch`."
  - "Producer convention: close AFTER all sends are done. Without close, main's range hangs."
  - "See canonical."
expectStdout: |
  1
  2
  3
runtime: yaegi
notes: |
  Theme 6.2 capstone — the canonical producer-consumer
  pattern. Three load-bearing ideas:

  1. **Unbuffered channel synchronises** each send with its
     receive — naturally throttles the producer to the
     consumer's pace.
  2. **Producer closes** when done sending — only the
     producer knows.
  3. **Consumer's `for v := range ch`** drains until close —
     no manual loop bookkeeping.

  Compare with slot 8 (buffered, no goroutine, no consumer-
  driven backpressure): this slot adds the goroutine + the
  natural backpressure of the unbuffered channel.

  Module 6 status: 2 of 4 themes done. Themes 6.3 (select)
  and 6.4 (sync) remain. Both have full Yaegi support per
  the 2026-05-21 probe + sync vendoring.
