target: go
themeId: go/concurrency/channels
type: mcq
order: 3
prompt: |
  After you've finished sending on a channel, you can call
  `close(ch)`. Pick the statement that's TRUE about closing.
generator:
  kind: variant
  variants:
    - id: close-semantics
      ts: |-
        // TS: stream.end() / Subject.complete() — similar shape.
      canonical: "Sending on a closed channel PANICS. Receiving from a closed channel returns the zero value immediately + the comma-ok form returns `ok = false`. Only the SENDER should close — never the receiver."
      distractors:
        - "Closing is symmetric — either sender or receiver can close, and the call blocks until both ends acknowledge."
        - "Closing is purely advisory; sends still work, receives still block as normal."
        - "Closing returns the buffered messages immediately to the caller as a slice."
hints:
  - "Two beats: what does send-on-closed do? what does receive-from-closed do? Plus the convention about WHO closes."
  - "Send panics. Receive returns zero-value (with ok=false in comma-ok form). Sender closes."
  - "Send-on-closed = panic; receive-from-closed = zero + !ok; only sender closes."
runtime: none
notes: |
  Three load-bearing facts in one MCQ:
  1. Send-on-closed panics — irrecoverable.
  2. Receive-from-closed is graceful — gives you the zero
     value and (with comma-ok) a `false` signal.
  3. Convention: only the sender closes (only the sender
     knows when no more sends will happen).

  Slot 8's `for v := range ch` form depends on close — the
  range loop terminates when the channel is closed and drained.

  Distractors:
    1. "Symmetric" — false. The send/receive panic asymmetry
       is the whole reason for the "sender closes" rule.
    2. "Advisory" — false. Send-on-closed is a hard panic.
    3. "Returns buffered as slice" — invented. `close` returns
       nothing; it just marks the channel.
