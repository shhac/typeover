target: go
themeId: go/concurrency/select
type: freeform
order: 8
prompt: |
  Build a small program with the `select + time.After`
  timeout pattern — Go's canonical "wait for X but give up
  after Y" idiom.

  1. Make `ch := make(chan string)` (unbuffered, no sender).
  2. `select` on:
     - `case v := <-ch:` — print `got:` + v
     - `case <-time.After(50 * time.Millisecond):` — print
       `timeout`
  3. With no sender, the receive blocks forever and the
     timeout case wins.

  Expected output: `timeout`.

  `time.After(d)` returns a `<-chan Time` that fires once
  after duration `d`. This is the standard timeout idiom in
  every Go networking / RPC library.
generator:
  kind: template
  vars: {}
  ts: |-
    // TS: Promise.race([fetch(...), new Promise((_, r) => setTimeout(() => r("timeout"), 50))])
  canonical: |-
    package main

    import (
    	"fmt"
    	"time"
    )

    func main() {
    	ch := make(chan string)
    	select {
    	case v := <-ch:
    		fmt.Println("got:", v)
    	case <-time.After(50 * time.Millisecond):
    		fmt.Println("timeout")
    	}
    }
expectStdout: |
  timeout
hints:
  - "Three pieces: `make(chan string)`, the two-case select with `<-ch` and `<-time.After(50 * time.Millisecond)`, and the matching print statements."
  - "`time.After(d)` returns a one-shot timer channel. Importing `\"time\"` is required."
  - "See canonical."
runtime: yaegi
notes: |
  THE canonical Go timeout pattern. Every networking /
  RPC / DB client in the stdlib uses some variant of this.

  Yaegi support: `time` package vendored 2026-05-21
  (this tick) — see design-docs/30. Before that vendoring,
  this slot would have been impossible to make runnable;
  now it's a clean canonical.

  Duration syntax `50 * time.Millisecond` is Go's idiom:
  `time.Millisecond` is a `Duration` constant; multiply by
  a literal to get the duration you want.
