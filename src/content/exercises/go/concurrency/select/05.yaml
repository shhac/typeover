target: go
themeId: go/concurrency/select
type: fill-word
order: 5
prompt: |
  Type the keyword used inside a `select` block to mark the
  non-blocking fallback case — the one that runs immediately
  when no channel case is ready.
generator:
  kind: template
  vars:
    word:
      - "default"
  ts: |-
    // TS: equivalent of a switch-statement `default` keyword,
    // but for select it means "non-blocking poll".
  canonical: |-
    package main

    import "fmt"

    func main() {
    	ch := make(chan int)
    	select {
    	case v := <-ch:
    		fmt.Println("got:", v)
    	${word}:
    		fmt.Println("nothing ready")
    	}
    }
runtime: none
blanks: [word]
hints:
  - "Seven letters. Same keyword as `switch` uses for the catch-all branch — but in `select` it's specifically the non-blocking fallback."
  - "`default`."
  - "`default`."
notes: |
  Same word as switch's catch-all, but different mechanic:
  in `select`, `default` makes the whole block non-blocking.

  Slot 7 verifies the runnable form of this pattern.
