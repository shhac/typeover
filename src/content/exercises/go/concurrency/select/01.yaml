target: go
themeId: go/concurrency/select
type: mcq
order: 1
prompt: |
  `select` is Go's primitive for waiting on multiple channel
  operations at once. Pick the line that opens a `select`
  block — the shape that's distinct from `switch`.

  TypeScript: `Promise.race([...])` is the closest analog
  but races resolved values, not channel operations.
generator:
  kind: variant
  variants:
    - id: select-no-arg
      ts: |-
        // TS: const v = await Promise.race([p1, p2]); — settles on
        // the first promise to fulfil. Go's `select` is similar
        // shape but waits on channel READINESS, not values.
      canonical: "select {"
      distractors:
        - "select v := <-ch1 {"
        - "switch select {"
        - "go select {"
hints:
  - "Bare keyword + opening brace. No subject expression, no condition — `select` introspects all its CASES."
  - "`select` (six letters, lowercase) followed by `{`. Nothing in between."
  - "`select {`."
runtime: none
notes: |
  Theme 6.3 opener. Key distinction from `switch`: `switch
  <expr>` takes a subject; `select` takes none — each case
  is itself a channel operation. The "subject" is implicit:
  whichever channel operation becomes ready first.

  Distractors:
    1. `select v := <-ch1 {` — confuses select with switch's
       subject expression. Channel ops belong INSIDE cases.
    2. `switch select {` — invented combo word.
    3. `go select {` — `go` launches goroutines; doesn't
       apply to `select` (select is itself a blocking
       statement, not a function call).
