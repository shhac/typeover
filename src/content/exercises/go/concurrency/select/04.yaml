target: go
themeId: go/concurrency/select
type: fill-word
order: 4
prompt: |
  Type the keyword that opens a multi-channel wait block.
generator:
  kind: template
  vars:
    word:
      - "select"
  ts: |-
    // TS: Promise.race(...) — but Go's keyword IS the keyword.
  canonical: |-
    package main

    import "fmt"

    func main() {
    	c1 := make(chan string, 1)
    	c1 <- "ready"
    	${word} {
    	case v := <-c1:
    		fmt.Println(v)
    	}
    }
runtime: none
blanks: [word]
hints:
  - "Six letters, lowercase. SQL has a same-spelled keyword for a totally different thing."
  - "`select`."
  - "`select`."
notes: |
  Pin the keyword. The body shape (case + channel op) is
  what slots 6-9 drill.
