target: go
themeId: go/collections/iteration
type: fill-word
order: 8
prompt: |
  Iterate over a map and print every key→value pair. Fill in the
  two range variables in the correct order.

  TypeScript:
  ```ts
  for (const [k, v] of Object.entries(prices)) {
    console.log(k, v);
  }
  ```

  Trap: TS `.forEach((v, k) => ...)` puts value FIRST. Go's range
  is the OPPOSITE — KEY first, value second.
generator:
  kind: template
  vars:
    name: [prices]
    k_var: [k]
    v_var: [v]
  ts: |-
    for (const [k, v] of Object.entries(${name})) {
      console.log(k, v);
    }
  canonical: |-
    for ${k_var}, ${v_var} := range ${name} { fmt.Println(${k_var}, ${v_var}) }
blanks: [k_var, v_var]
hints:
  - "Two single-letter range variables. KEY first, then VALUE — same positional discipline as exercise 4's two-value form."
  - "`k` then `v`. Reversing them is the most common TS-`.forEach` leak."
  - "`k`, `v`."
runtime: none
notes: |
  Drills the positional KEY-FIRST order one more time, now in a
  fill-word context (production, not recognition). Fill-word with
  TWO blanks is the right shape — the learner has to commit to BOTH
  positions independently, surfacing any "value-first" muscle
  memory from TS's `.forEach((v, k) => ...)`.

  Why drill this again so soon: theme 2.3's central asymmetry is
  range semantics by collection type. Slot 4's MCQ pinned the
  shape; slot 8 forces production. Together they constitute the
  three-stage TS-habit reset: see it, recognise it, type it.

  Out of scope: deterministic iteration order — covered in slot 9's
  string range and slot 11's freeform (sort keys for stable
  printout).
