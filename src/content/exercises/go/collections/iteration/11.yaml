target: go
themeId: go/collections/iteration
type: freeform
order: 11
prompt: |
  Capstone: write a `reverse(s string) string` function that
  reverses a string CORRECTLY — including multi-byte (UTF-8)
  characters. `main` calls `reverse("héllo")` and prints the
  result.

  Expected output: `olléh`.

  TypeScript reference (which gets this right out of the box
  thanks to the spread+iterator combo):
  ```ts
  function reverse(s: string): string {
    return [...s].reverse().join("");
  }
  console.log(reverse("héllo"));  // "olléh"
  ```

  Trap: a `[]byte` reverse looks right on ASCII but mojibakes
  multi-byte runes. The byte sequence for `é` is `\xc3\xa9` — flip
  those two bytes and you get `\xa9\xc3`, which is invalid UTF-8
  and renders as garbage. Convert to `[]rune` to reverse code
  points instead.
generator:
  kind: template
  vars: {}
  ts: |-
    function reverse(s: string): string {
      return [...s].reverse().join("");
    }
    console.log(reverse("héllo"));  // "olléh"
  canonical: |-
    package main

    import "fmt"

    func reverse(s string) string {
    	r := []rune(s)
    	for i, j := 0, len(r)-1; i < j; i, j = i+1, j-1 {
    		r[i], r[j] = r[j], r[i]
    	}
    	return string(r)
    }

    func main() {
    	fmt.Println(reverse("héllo"))
    }
expectStdout: |
  olléh
runtime: yaegi
hints:
  - "A `string` in Go is a sequence of bytes (UTF-8). Indexing or `[]byte(s)` gives you bytes — fine for ASCII, broken for accented / CJK characters. Convert to `[]rune(s)` to work in CODE POINTS."
  - "Standard two-pointer reverse: `i, j := 0, len(r)-1`, swap `r[i], r[j]`, advance `i++, j--` until they cross. The trick is the multi-assignment syntax: `i, j = i+1, j-1` (single statement)."
  - "See canonical: `r := []rune(s)` → two-pointer swap loop → `string(r)` to convert back."
notes: |
  Theme 2.3's capstone, exercising every divergence:
    - `[]rune(s)` conversion — runes vs bytes, the strings-bytes-
      runes lesson from Module 1 brought back productively.
    - Multi-assignment in for-clause `i, j = i+1, j-1`.
    - Index-swap on a slice (`r[i], r[j] = r[j], r[i]`).
    - `string(r)` to convert back.

  expectStdout is set to a SINGLE input case (`"héllo"`) — the
  brief's "hidden test capstone" idea (ASCII + accented + CJK +
  empty + single rune) needs a richer grader than the v0 stdout-
  match. Captured as a roadmap item in design-docs/23. The single-
  case version still gates against byte-reverse submissions because
  the `é` mojibakes.

  Out of scope (deferred):
    - Multi-case hidden tests (would require a structured grader).
    - Combining-mark / grapheme-cluster awareness — the `[]rune`
      reverse still splits accents from their base char if they're
      stored as separate code points (e.g. NFD-decomposed). Real
      "reverse a string" handles graphemes, not just runes — but
      that's a much bigger lesson than this slot needs to teach.
