target: go
themeId: go/collections/maps
type: mcq
order: 4
prompt: |
  Exercise 3 pinned the trap: missing-key lookup returns the zero value,
  same as a present-but-zero entry. Pick the idiomatic Go check for
  "is key `name` PRESENT in `scores`?" — the antidote to that trap.

  TypeScript habit:
  ```ts
  if (name in scores) { /* present */ }
  // or: if (scores[name] !== undefined) { /* present */ }
  ```
generator:
  kind: variant
  variants:
    - id: scores
      ts: "if (name in scores) { /* present */ }"
      canonical: 'if v, ok := scores[name]; ok { /* use v */ }'
      distractors:
        - 'if scores[name] != 0 { /* present */ }'
        - 'if scores[name] != nil { /* present */ }'
        - 'if _, exists := scores.get(name); exists { /* present */ }'
    - id: cache
      ts: "if (key in cache) { /* present */ }"
      canonical: 'if v, ok := cache[key]; ok { /* use v */ }'
      distractors:
        - 'if cache[key] != 0 { /* present */ }'
        - 'if cache[key] != nil { /* present */ }'
        - 'if _, exists := cache.get(key); exists { /* present */ }'
    - id: ages
      ts: "if ('alice' in ages) { /* present */ }"
      canonical: 'if v, ok := ages["alice"]; ok { /* use v */ }'
      distractors:
        - 'if ages["alice"] != 0 { /* present */ }'
        - 'if ages["alice"] != nil { /* present */ }'
        - 'if _, exists := ages.get("alice"); exists { /* present */ }'
hints:
  - "Go's map index can return TWO values. The second is a `bool` — `true` if the key was present, `false` if missing. The convention is `v, ok := m[k]`."
  - "The `if v, ok := m[k]; ok` form combines the lookup with the presence test in one statement. `v` is in scope only inside the if-block."
  - "`v, ok := m[k]` is the comma-ok idiom — the load-bearing one."
runtime: none
notes: |
  Distractors are the four shapes a TS dev reaches for first:
    1. `m[k] != 0` — false negative for a present-zero entry. The
       whole point of comma-ok is that you CAN'T distinguish
       missing from zero by looking at the value.
    2. `m[k] != nil` — int can't be nil (won't compile for
       `map[string]int`). On a `map[string]*T` it might compile
       but doesn't tell you presence — `*T` can be nil AND present.
    3. `.get(...)` method — Go's map lookup isn't a method call.
       Just index.

  Comma-ok is THE map idiom — it also generalises to type
  assertions (`v, ok := x.(T)`) and channel receives (`v, ok :=
  <-ch`). Worth pinning early.
