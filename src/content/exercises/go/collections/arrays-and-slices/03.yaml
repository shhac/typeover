target: go
themeId: go/collections/arrays-and-slices
type: mcq
order: 3
prompt: |
  TypeScript needs `.fill(0)` to actually populate the array.
  Translate to idiomatic Go — the result is a slice of N real
  zeros, not a sparse array.
generator:
  kind: template
  vars:
    name: [buf, scores, counts, tally, slots]
    n: ["5", "8", "10", "16", "32"]
  ts: |-
    const ${name} = new Array<number>(${n}).fill(0);
  canonical: |-
    ${name} := make([]int, ${n})
  distractors:
    - "${name} := []int{${n}}"
    - "${name} := new([]int, ${n})"
    - "${name} := []int(${n})"
hints:
  - "Go's built-in for sizing collections is `make`. The first arg is the type, the second is the *length* — and `make` fills every exercise with the zero value of the element type."
  - "`make([]T, n)` allocates a slice of length n, filled with zeros."
  - "`${name} := make([]int, ${n})`"
runtime: none
notes: |
  Distractors:
    1. `[]int{n}` — a one-element slice containing the literal `n`,
       NOT a slice of length n. The most common beginner trap.
       (`[]int{5}` is `len=1`, not `len=5`.)
    2. `new([]int, n)` — `new` returns a pointer to a zeroed slice
       header; it takes one type argument, not two. Confuses
       `make` (built-in for slice/map/channel construction) with
       `new` (zero-pointer for any type).
    3. `[]int(n)` — looks like a type conversion. `int(x)` converts
       a value to int; `[]int(x)` would try to convert x to a
       slice, which only works for `[]byte` ↔ `string`. Not what
       we want.

  Sets up slot 4's `make([]T, len, cap)` distinction by establishing
  that `make`'s second arg is the LENGTH.
