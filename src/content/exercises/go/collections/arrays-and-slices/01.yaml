target: go
themeId: go/collections/arrays-and-slices
type: mcq
order: 1
prompt: |
  Translate this TypeScript to idiomatic Go. The collection should
  grow with `append` later — pick the form that lets you do that.
generator:
  kind: template
  vars:
    name: [xs, scores, nums, items, prices]
    a: ["1", "5", "10", "100", "0"]
    b: ["2", "6", "20", "200", "1"]
    c: ["3", "7", "30", "300", "2"]
  ts: |-
    const ${name} = [${a}, ${b}, ${c}];
  canonical: |-
    ${name} := []int{${a}, ${b}, ${c}}
  distractors:
    - "${name} := [3]int{${a}, ${b}, ${c}}"
    - "${name} := Array<int>{${a}, ${b}, ${c}}"
    - "${name} := [int]{${a}, ${b}, ${c}}"
hints:
  - "Go separates two shapes that TS collapses into one: a fixed-length array (length in the type) and a slice (the one you actually use). TS `[1, 2, 3]` becomes the *slice* by default."
  - "The slice type is empty brackets, then the element type, then a brace literal: `[]int{...}`."
  - "`${name} := []int{${a}, ${b}, ${c}}`"
runtime: none
notes: |
  Distractors:
    1. `[3]int{...}` — compiles, but locks the length 3 into the
       type. Can't append to it. Teaches: idiomatic Go reaches for
       `[]T` first; `[N]T` is for cases where the length IS the
       API (e.g. `[16]byte` for an MD5 digest).
    2. `Array<int>{...}` — TS generic leak. No `Array<T>` type
       in Go; collection shape is part of the type, not a generic
       wrapper.
    3. `[int]{...}` — Wrong bracket order; reads like Python's
       type-parameterised list. Go's slice type is `[]T`, not
       `[T]`.
  Module 2 opener — central reality: slices are what you use.
