target: go
themeId: go/collections/arrays-and-slices
type: fill-line
order: 11
prompt: |
  Sort `xs` in place, then find the index of `7`. The program prints
  the sorted slice on one line and the index of `7` on the next.

  Two stdlib packages: `sort.Ints` (the int-specific sorter) and
  `slices.Index` (the modern, Go 1.21+ slice operations). Both
  take the slice as the first argument — neither is a method.

  Expected output: `[1 1 3 4 7]` then `4`. Type the two-statement
  line that does both, in order.
generator:
  kind: template
  vars:
    line:
      - "sort.Ints(xs); i := slices.Index(xs, 7)"
  ts: |-
    const xs = [3, 1, 7, 4, 1];
    xs.sort((a, b) => a - b);
    const i = xs.indexOf(7);
    console.log(xs);   // [1, 1, 3, 4, 7]
    console.log(i);    // 4
  canonical: |-
    package main

    import (
    	"fmt"
    	"slices"
    	"sort"
    )

    func main() {
    	xs := []int{3, 1, 7, 4, 1}
    	${line}
    	fmt.Println(xs)
    	fmt.Println(i)
    }
  distractors:
    - match: "xs = sort.Ints(xs); i := slices.Index(xs, 7)"
      explain: |-
        `sort.Ints` mutates in place — it returns NOTHING. The
        `xs =` assignment would fail to compile ("`sort.Ints` used
        as value"). Just call it bare; the slice is sorted by the
        side effect. (Same goes for the modern `slices.Sort`.)
    - match: "sort.Ints(xs); i := slices.IndexOf(xs, 7)"
      explain: |-
        TS-style name. Go's stdlib calls it `slices.Index` (not
        `IndexOf`). Returns `-1` when not present, same contract
        as TS's `indexOf`.
    - match: "xs.sort(); i := xs.indexOf(7)"
      explain: |-
        TS methods. Slices don't have methods in Go; the operations
        live in stdlib packages (`sort`, `slices`) as free-standing
        functions with the slice as the first argument.
    - match: "sort.Sort(xs); i := slices.Index(xs, 7)"
      explain: |-
        `sort.Sort` takes a `sort.Interface` (implementing `Len`,
        `Less`, `Swap`) — too much ceremony for a slice of ints.
        The type-specific helpers are `sort.Ints`, `sort.Strings`,
        `sort.Float64s` — much friendlier for the common cases.
expectStdout: |
  [1 1 3 4 7]
  4
runtime: yaegi
alternateCanonicals:
  - "slices.Sort(xs); i := slices.Index(xs, 7)"
successNote: |
  Heads-up: the modern Go 1.21+ canonical is `slices.Sort(xs); i :=
  slices.Index(xs, 7)` — same shape, one package, no `sort` import
  needed. typeover's in-browser Go runtime (Yaegi) doesn't yet
  support the generic stdlib (`slices.Sort` et al.), so we grade the
  pre-generics path (`sort.Ints`) instead. If you typed
  `slices.Sort`, that's the answer you'd write in production — we
  still accepted it.
blanks: [line]
hints:
  - "`sort.Ints(s)` sorts an int slice in place (returns nothing). `slices.Index(s, x)` returns the index of `x`, or `-1` if absent."
  - "Two statements on one line, separated by `;`. The first call mutates `xs`; the second uses `:=` to declare `i`."
  - "`sort.Ints(xs); i := slices.Index(xs, 7)`."
notes: |
  Capstone for the `sort.*` + `slices.*` package after slot 10's
  `slices.Contains` intro. Two operations on one line drills the
  "in-place vs returns-value" asymmetry of stdlib functions — TS's
  `Array.prototype.sort` also mutates AND returns; Go's
  `sort.Ints` only mutates.

  Authoring choice: Go 1.21's `slices.Sort` would be the most
  modern canonical, but typeover's Yaegi runtime doesn't yet
  support the generic stdlib functions with `cmp.Ordered`
  constraint. `sort.Ints` is the pre-generics path — still common
  in shipped Go code — and Yaegi runs it. When Yaegi catches up,
  swap the canonical to `slices.Sort(xs)` and adjust the import.

  The distractor bank teaches against the four most common
  authoring mistakes: drop-the-return, TS-style naming, method
  call, over-ceremony with `sort.Interface`.
