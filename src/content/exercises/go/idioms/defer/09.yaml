target: go
themeId: go/idioms/defer
type: freeform
order: 9
prompt: |
  Theme 7.1 capstone — pull together defer + resource
  cleanup + LIFO order via the "fake file" pattern. (We
  don't have `os` vendored, so the program models a file
  via a struct.)

  1. Declare `type file struct{ name string }` with a
     method `func (f *file) Close() { fmt.Println("closing",
     f.name) }`.
  2. Helper `func openFile(name string) *file { fmt.Println("opening", name); return &file{name: name} }`.
  3. In `main`, open `"a"` and `"b"` (in that order),
     `defer X.Close()` after each open.

  Expected output (open in order, close LIFO):
  ```
  opening a
  opening b
  closing b
  closing a
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    // TS: try { const a = openA(); try { const b = openB(); ... } finally { b.close() } } finally { a.close() }
  canonical: |-
    package main

    import "fmt"

    type file struct {
    	name string
    }

    func (f *file) Close() {
    	fmt.Println("closing", f.name)
    }

    func openFile(name string) *file {
    	fmt.Println("opening", name)
    	return &file{name: name}
    }

    func main() {
    	a := openFile("a")
    	defer a.Close()
    	b := openFile("b")
    	defer b.Close()
    }
expectStdout: |
  opening a
  opening b
  closing b
  closing a
hints:
  - "Four pieces: `type file struct { name string }`, the `Close()` method, the `openFile` helper, and main's two `openFile` + `defer X.Close()` pairs."
  - "Defer-Close immediately after each open — this is the canonical resource-acquisition idiom."
  - "See canonical."
runtime: yaegi
notes: |
  Theme 7.1 capstone. The "acquire then defer release"
  pattern is the most pervasive defer use in production
  Go. Real-world equivalent:
  ```
  f, err := os.Open("a")
  if err != nil { return err }
  defer f.Close()
  ```

