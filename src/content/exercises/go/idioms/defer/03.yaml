target: go
themeId: go/idioms/defer
type: mcq
order: 3
prompt: |
  **When are the arguments to a deferred call evaluated?**
  This is the most common defer gotcha.

  ```go
  i := 1
  defer fmt.Println("i =", i)
  i = 2
  // function returns — what prints?
  ```

  Pick the answer.
generator:
  kind: variant
  variants:
    - id: defer-args-eval
      ts: |-
        // TS: closure-capture by reference (always sees latest).
        // Go's defer captures arguments BY VALUE at the defer site.
      canonical: "Arguments are evaluated at the `defer` SITE (the line you wrote `defer` on). Output: `i = 1`."
      distractors:
        - "Arguments are evaluated when the deferred call FIRES (at return time). Output: `i = 2`."
        - "Arguments are evaluated lazily — only if the value is actually used. Compiler erases this defer entirely."
        - "Each goroutine sees its own copy; output depends on scheduling."
hints:
  - "Defer captures the CURRENT values of its arguments — so the call is fully bound at the defer line, with only the EXECUTION delayed."
  - "Args evaluated at defer site. Captured BY VALUE. Output: `i = 1`."
  - "Eval at defer site → captures `i = 1`."
runtime: none
notes: |
  THE defer gotcha. This is on every Go interview list and
  catches everyone the first time.

  Workaround: if you want the latest value, wrap in a
  closure: `defer func() { fmt.Println("i =", i) }()` —
  closure captures `i` BY REFERENCE, so the eventual call
  sees whatever value `i` has at return time.

  Distractors:
    1. "At fire time" — the natural-but-wrong guess.
    2. "Lazy" — invented; no such Go semantic.
    3. "Per-goroutine" — defers run on the same goroutine
       that declared them; no copy-per-goroutine.

  Slot 7 drills the closure-wrap workaround.
