target: go
themeId: go/idioms/defer
type: mcq
order: 2
prompt: |
  Multiple `defer` statements in the same function run in a
  specific order on return. Pick the description of that
  order.
generator:
  kind: variant
  variants:
    - id: lifo
      ts: |-
        // TS: try/finally doesn't stack — nested try/finally
        // unwinds inner-first naturally. Defer formalises this
        // as a stack: last in, first out.
      canonical: "Last-in, first-out (LIFO). The most recently deferred call runs first; the earliest runs last."
      distractors:
        - "First-in, first-out (FIFO) — same order they were written."
        - "All defers run concurrently in their own goroutines."
        - "Defers run in declaration order BEFORE the return, not after."
hints:
  - "Think of a stack. Push on `defer`, pop on return. Which end of the stack runs first?"
  - "LIFO. Most recent defer fires first. Earliest defer fires last."
  - "LIFO."
runtime: none
notes: |
  The LIFO order matches the natural intuition of nested
  try/finally: outer setup, inner setup, inner cleanup,
  outer cleanup.

  Distractors:
    1. FIFO — opposite of correct. Common wrong guess.
    2. "Concurrent" — defers run on the same goroutine that
       declared them; no concurrency.
    3. "Before return" — defers fire AFTER the return-value
       is computed but BEFORE control transfers to the
       caller. Not before the return statement itself.

  Slot 8's freeform demonstrates the LIFO order with three
  defers printing in reverse declaration order.
