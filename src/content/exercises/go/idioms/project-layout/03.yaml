target: go
themeId: go/idioms/project-layout
type: mcq
order: 3
prompt: |
  Pick the statement that's TRUE about Go's standard
  project layout conventions outside of `cmd/` and
  `internal/`.
generator:
  kind: variant
  variants:
    - id: keep-it-flat
      ts: |-
        // TS: heavy convention via tsconfig, src/, dist/.
        // Go: flat by default — the language doesn't prescribe.
      canonical: "Outside `cmd/` and `internal/`, layout is largely up to you. Start FLAT — one package at the module root — and grow into subdirectories only when the package gets too large or has a clear sub-concern."
      distractors:
        - "The `github.com/golang-standards/project-layout` repo is the OFFICIAL Go layout standard; every project must follow it."
        - "Every Go project must use `pkg/` for library code, `api/` for API definitions, and `web/` for frontend assets."
        - "Go requires `src/` at the module root; all `.go` files must be inside it."
hints:
  - "The Go team has stated explicit non-preferences. Outside cmd + internal, nothing is mandatory; the only universal advice is to start small."
  - "Free-form. Start flat. The popular `project-layout` repo is NOT official."
  - "Layout is up to you; start flat."
runtime: none
notes: |
  Common misconception: TypeScript / Java devs assume Go
  has an opinionated layout standard. It doesn't, outside
  the two enforced bits (`cmd/`, `internal/`). The Go core
  team has explicitly stated that `golang-standards/
  project-layout` is community convention and over-
  prescribes for small projects.

  Practical advice:
  - **Start flat**: one package at module root.
  - **Split when growth requires**: extract a `parser/`
    subpackage when the parsing concerns are too big to
    sit at root level.
  - **`internal/` for "don't expose this"**: any time you
    want to keep an API out of external consumers' reach.

  Distractors:
    1. "project-layout is OFFICIAL" — false (this is the
       most common mistake).
    2. "Every project must use pkg/api/web" — over-
       prescribed; no Go requirement.
    3. "src/ required" — invented; Go has no src/ tradition.
