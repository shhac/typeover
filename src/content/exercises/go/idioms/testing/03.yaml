target: go
themeId: go/idioms/testing
type: mcq
order: 3
prompt: |
  Pick the IDIOMATIC failure-reporting line inside a Go
  test function. (`got` and `want` are local variables;
  `t` is the `*testing.T`.)

  TypeScript: `expect(got).toBe(want)`. Go has no
  assertion library — testing.T's methods + a bare `if`
  are the whole vocabulary.
generator:
  kind: variant
  variants:
    - id: errorf-got-want
      ts: |-
        // TS: expect(got).toBe(want);
        // Go: if got != want { t.Errorf("got %v, want %v", got, want) }
      canonical: "if got != want { t.Errorf(\"got %v, want %v\", got, want) }"
      distractors:
        - "t.AssertEqual(got, want)"
        - "expect(got).toEqual(want)"
        - "assert(got == want)"
hints:
  - "Two parts: an `if` checking inequality, followed by `t.Errorf` with a `got %v, want %v` format string. No assertion library."
  - "`if got != want { t.Errorf(\"got %v, want %v\", got, want) }`."
  - "if-then-Errorf with got/want phrasing."
runtime: none
notes: |
  The Go test idiom is deliberately bare:
    `if got != want { t.Errorf("got %v, want %v", got, want) }`
  Used pervasively in stdlib + ecosystem. `t.Errorf` marks
  the test failed but continues; `t.Fatalf` marks failed
  AND stops the test function immediately.

  Distractors:
    1. `t.AssertEqual` — invented; the stdlib `testing.T`
       has Error/Errorf/Fatal/Fatalf/Log/Logf/Run/Helper —
       no AssertEqual.
    2. `expect(...).toEqual(...)` — Jest/Vitest.
    3. `assert(got == want)` — Python / C-style; Go has no
       `assert` builtin.

  Slot 8 demonstrates this pattern with a mock T (since
  Yaegi can't import `testing`).
