target: go
themeId: go/idioms/gotchas
type: fill-line
order: 7
prompt: |
  Demonstrate **slice aliasing**. The scaffold creates
  `a := []int{1, 2, 3, 4}` and a slice `b := a[1:3]`.
  Write the line that mutates `b[0]` to `99`. Then the
  print of `a` will reveal the aliasing.

  Expected output: `[1 99 3 4]`.
generator:
  kind: template
  vars:
    line:
      - "b[0] = 99"
  ts: |-
    // TS: arr.slice(1, 3) COPIES — no aliasing. b[0] = 99 leaves a alone.
  canonical: |-
    package main

    import "fmt"

    func main() {
    	a := []int{1, 2, 3, 4}
    	b := a[1:3]
    	${line}
    	fmt.Println(a)
    }
  distractors:
    - match: "a[0] = 99"
      explain: |-
        Directly mutates a[0] — that's not aliasing, that's
        just direct assignment. The slot asks you to mutate
        through b and observe the bleed-through.
    - match: "b = append(b, 99)"
      explain: |-
        Appends doesn't directly mutate elements; depending
        on cap it may even allocate a new backing array
        (breaking aliasing). The cleanest aliasing demo is
        direct index assignment.
    - match: "copy(b, []int{99})"
      explain: |-
        Works (mutates b[0] = 99 via copy), but a bit
        elaborate for a single-element write. Direct
        assignment is cleaner.
expectStdout: |
  [1 99 3 4]
runtime: yaegi
blanks: [line]
hints:
  - "Direct index assignment on b: `b[0] = 99`. Then print a to see the aliasing."
  - "`b[0] = 99`."
  - "`b[0] = 99`."
notes: |
  Runnable evidence of the aliasing from MCQ slot 2.
  `b` is a 2-element view into `a`'s backing array
  starting at offset 1; writing through `b[0]` is the
  same memory cell as `a[1]`.
