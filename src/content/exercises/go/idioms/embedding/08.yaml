target: go
themeId: go/idioms/embedding
type: freeform
order: 8
prompt: |
  Demonstrate **method override via embedding**. Build:

  1. `type Animal struct{ Name string }` with method
     `Describe() string` returning `"animal " + Name`.
  2. `type Dog struct{ Animal }` (embeds Animal) with its
     OWN `Describe() string` returning `"dog " + Animal.Describe()`.
  3. In main, create `d := Dog{Animal: Animal{Name: "Rex"}}`
     and `fmt.Println(d.Describe())`.

  Expected output: `dog animal Rex`.

  This is Go's equivalent of `super.method()` — the outer's
  Describe overrides the promoted one but can still
  reference it via `Animal.Describe()`.
generator:
  kind: template
  vars: {}
  ts: |-
    // TS: class Dog extends Animal { describe() { return "dog " + super.describe() } }
  canonical: |-
    package main

    import "fmt"

    type Animal struct {
    	Name string
    }

    func (a Animal) Describe() string {
    	return "animal " + a.Name
    }

    type Dog struct {
    	Animal
    }

    func (d Dog) Describe() string {
    	return "dog " + d.Animal.Describe()
    }

    func main() {
    	d := Dog{Animal: Animal{Name: "Rex"}}
    	fmt.Println(d.Describe())
    }
expectStdout: |
  dog animal Rex
hints:
  - "Two types each with a Describe method. Dog's Describe calls `d.Animal.Describe()` explicitly to reuse the inner's behaviour."
  - "Override: define the same-named method on the outer type. Reach the promoted one via `outer.EmbeddedType.Method()`."
  - "See canonical."
runtime: yaegi
notes: |
  Drills the override + super-call pattern. The `d.Animal.
  Describe()` form is Go's `super.describe()` — explicit
  forwarding through the embedded type's name.

  Without the outer's own Describe, the call `d.Describe()`
  would invoke the promoted Animal version directly.
