target: go
themeId: go/idioms/embedding
type: fill-line
order: 6
prompt: |
  Write the composite literal that constructs a `Dog` with
  `Name: "Rex"` and `Breed: "Lab"`. The scaffold defines
  the types; you're typing the construction line in `main`.

  Expected output: `Rex Lab`.
generator:
  kind: template
  vars:
    line:
      - 'd := Dog{Animal: Animal{Name: "Rex"}, Breed: "Lab"}'
  ts: |-
    // TS: const d = new Dog("Rex", "Lab")
  canonical: |-
    package main

    import "fmt"

    type Animal struct{ Name string }
    type Dog struct {
    	Animal
    	Breed string
    }

    func main() {
    	${line}
    	fmt.Println(d.Name, d.Breed)
    }
  distractors:
    - match: 'd := Dog{Name: "Rex", Breed: "Lab"}'
      explain: |-
        Tries to set the promoted `Name` directly. Promoted
        fields can be ACCESSED on the outer (`d.Name`) but
        in composite literals you must use the embedded
        type's name as the field key: `Animal: Animal{Name: "Rex"}`.
    - match: 'd := Dog{"Rex", "Lab"}'
      explain: |-
        Positional literals don't work cleanly for embedded
        types — the first position is the EMBEDDED VALUE
        (an Animal), not its Name. Would need
        `Dog{Animal{"Rex"}, "Lab"}`.
    - match: 'd := new Dog(Animal{"Rex"}, "Lab")'
      explain: |-
        Java/TS constructor syntax. Go's `new(T)` allocates a
        zero-value pointer; it doesn't take constructor args.
        Use composite literal with field names.
expectStdout: |
  Rex Lab
runtime: yaegi
blanks: [line]
hints:
  - "Three pieces: `d := Dog{`, field `Animal: Animal{Name: \"Rex\"}`, field `Breed: \"Lab\"`, `}`."
  - "`d := Dog{Animal: Animal{Name: \"Rex\"}, Breed: \"Lab\"}`."
  - "See canonical."
notes: |
  Drills MCQ slot 3's composite-literal shape. Also
  demonstrates promoted-field ACCESS (`d.Name`, `d.Breed`)
  in the print — that part Just Works without going
  through `d.Animal.Name`.
