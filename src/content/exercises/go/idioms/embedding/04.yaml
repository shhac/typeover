target: go
themeId: go/idioms/embedding
type: fill-word
order: 4
prompt: |
  Type the SINGLE WORD that goes in the blank to embed
  `Animal` into `Dog`. (Hint: it's just the type name —
  no other syntax.)
generator:
  kind: template
  vars:
    word:
      - "Animal"
  ts: |-
    // TS: extends Animal — but Go uses bare type name as a field.
  canonical: |-
    package main

    import "fmt"

    type Animal struct {
    	Name string
    }

    func (a Animal) Describe() string {
    	return "I am " + a.Name
    }

    type Dog struct {
    	${word}
    	Breed string
    }

    func main() {
    	d := Dog{Animal: Animal{Name: "Rex"}, Breed: "Lab"}
    	fmt.Println(d.Describe())
    }
runtime: none
blanks: [word]
hints:
  - "An embedded field is the TYPE NAME on its own line — no field name, no colon, no shape. Just the type."
  - "`Animal`."
  - "`Animal`."
notes: |
  The syntactic minimalism of embedding is the point — a
  bare type name on its own line IS the embed. No keyword,
  no annotation.
