target: go
themeId: go/idioms/context
type: mcq
order: 2
prompt: |
  Pick the line that creates a CANCELLABLE child context from
  a parent `ctx`. The result should be a pair: the child
  context AND a function the caller invokes to cancel it.

  TypeScript: `const ctrl = new AbortController()` returns
  a controller; you read `.signal` and call `.abort()`.
  Go's shape is similar but returns the context + cancel
  function as a pair.
generator:
  kind: variant
  variants:
    - id: with-cancel
      ts: |-
        // TS: const ctrl = new AbortController(); signal = ctrl.signal; abort = ctrl.abort.bind(ctrl);
        // Go: ctx, cancel := context.WithCancel(parent)
      canonical: "ctx, cancel := context.WithCancel(parent)"
      distractors:
        - "ctx := context.WithCancel(parent)"
        - "ctx := parent.WithCancel()"
        - "cancel := parent.Cancel(); ctx := parent"
hints:
  - "Multi-return: the function returns BOTH the new context and the cancel func. Caller usually `defer`s the cancel."
  - "`ctx, cancel := context.WithCancel(parent)`."
  - "`ctx, cancel := context.WithCancel(parent)`."
runtime: none
notes: |
  `context.WithCancel` is the most basic derivation. Sister
  functions:
  - `context.WithTimeout(parent, d)` — auto-cancels after d.
  - `context.WithDeadline(parent, t)` — auto-cancels at t.
  - `context.WithValue(parent, k, v)` — adds a request-scoped
    value (slot 9 capstone touches this).

  Distractors:
    1. Single return — drops the cancel function. Real call
       has two returns; you MUST keep both.
    2. Method-call shape — context.Context is an INTERFACE,
       and derivation is via package-level functions, not
       methods.
    3. Backwards order + missing cancel function — invented.

  Convention: `defer cancel()` immediately after this call,
  even if you also cancel manually elsewhere — releases
  resources held by the context.
