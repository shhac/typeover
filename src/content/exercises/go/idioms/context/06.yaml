target: go
themeId: go/idioms/context
type: fill-line
order: 6
prompt: |
  Type the derivation line that creates a cancellable child
  context from `context.Background()` and binds the cancel
  function to `cancel`.

  Expected output: `context canceled`.

  The scaffold immediately calls `cancel()` and then prints
  the context's `Err()`.
generator:
  kind: template
  vars:
    line:
      - "ctx, cancel := context.WithCancel(context.Background())"
  ts: |-
    // TS: const ctrl = new AbortController();
  canonical: |-
    package main

    import (
    	"context"
    	"fmt"
    )

    func main() {
    	${line}
    	cancel()
    	fmt.Println(ctx.Err())
    }
  distractors:
    - match: "ctx := context.WithCancel(context.Background())"
      explain: |-
        Drops the cancel function. `context.WithCancel`
        returns a (Context, CancelFunc) pair — you MUST
        receive both or the compiler complains about
        unused/missing values.
    - match: "ctx, cancel := context.Background().WithCancel()"
      explain: |-
        Method-call shape — `Context` is an interface and
        derivation is via package-level functions, not
        methods.
    - match: "cancel, ctx := context.WithCancel(context.Background())"
      explain: |-
        Return-order swap. The convention is `(Context,
        CancelFunc)` — context first.
expectStdout: |
  context canceled
runtime: yaegi
blanks: [line]
hints:
  - "Multi-return assignment: `ctx, cancel := context.WithCancel(context.Background())`."
  - "`ctx, cancel := context.WithCancel(context.Background())`."
  - "See canonical."
notes: |
  Drills the derivation idiom from MCQ slot 2. In production
  the canonical follow-up is `defer cancel()` to release
  context resources — omitted here only because the slot
  is about the derivation shape, not the cleanup pattern.
