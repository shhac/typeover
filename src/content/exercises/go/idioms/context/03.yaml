target: go
themeId: go/idioms/context
type: mcq
order: 3
prompt: |
  Inside a goroutine doing long work, how do you LISTEN for
  cancellation from a `ctx context.Context` parameter?

  TypeScript: `signal.addEventListener("abort", ...)`.
  Go's idiom uses a channel + select.
generator:
  kind: variant
  variants:
    - id: select-ctx-done
      ts: |-
        // TS: if (signal.aborted) return; or signal.addEventListener("abort", ...).
        // Go: select { case <-ctx.Done(): ... }
      canonical: "Receive from `ctx.Done()` in a `select` — the channel closes when the context is cancelled. `case <-ctx.Done(): return ctx.Err()`."
      distractors:
        - "Check `ctx.IsCancelled()` in a polling loop."
        - "Register a callback with `ctx.OnCancel(func() { ... })`."
        - "Use `defer ctx.Wait()` — it blocks the caller until cancellation."
hints:
  - "`Done()` returns a CHANNEL that closes on cancellation. Receive from it in a select to non-blockingly detect cancellation."
  - "`select { case <-ctx.Done(): ... }` — receive blocks until close."
  - "`<-ctx.Done()` inside a select."
runtime: none
notes: |
  Channel-based cancellation is the load-bearing context
  idiom. `ctx.Done()` returns a `<-chan struct{}` that's
  closed when the context is cancelled — receiving from a
  closed channel returns immediately (theme 6.2 slot 3
  lesson), which lets a select case fire instantly.

  Pair with `ctx.Err()` to discriminate cancel reasons:
  `context.Canceled` (explicit cancel call) vs
  `context.DeadlineExceeded` (WithTimeout / WithDeadline
  expired).

  Distractors:
    1. `IsCancelled()` polling — invented and would hold
       CPU. Channel close is the right primitive.
    2. `OnCancel` callback — TypeScript habit; Go uses
       channels, not callbacks.
    3. `defer ctx.Wait()` — invented; Context has no Wait.
