target: go
themeId: go/types/structs
type: freeform
order: 8
prompt: |
  Build a small program that:

  1. Declares a `Counter` struct with a single `int` field named
     `n`.
  2. Creates `c := Counter{n: 5}`.
  3. Calls `bump(&c)` where `bump` takes a `*Counter` and
     increments `c.n` (pattern from slot 6).
  4. Prints the resulting `c.n`.

  Expected output: `6` (the mutation through the pointer survives
  return, unlike the pass-by-value version).

  TypeScript reference:
  ```ts
  type Counter = { n: number };
  function bump(c: Counter) { c.n += 1; }
  const c: Counter = { n: 5 };
  bump(c);
  console.log(c.n);  // 6 — TS objects share by reference
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    type Counter = { n: number };
    function bump(c: Counter) { c.n += 1; }
    const c: Counter = { n: 5 };
    bump(c);
    console.log(c.n);
  canonical: |-
    package main

    import "fmt"

    type Counter struct {
    	n int
    }

    func bump(c *Counter) {
    	c.n++
    }

    func main() {
    	c := Counter{n: 5}
    	bump(&c)
    	fmt.Println(c.n)
    }
expectStdout: |
  6
runtime: yaegi
hints:
  - "Three pieces: (1) `type Counter struct { n int }`, (2) `bump(c *Counter) { c.n++ }`, (3) `c := Counter{n: 5}; bump(&c); fmt.Println(c.n)`."
  - "The mutation only survives because `bump` takes a POINTER (`*Counter`). Value parameter would copy and the mutation would be invisible."
  - "See canonical."
notes: |
  End-to-end exercise pulling together the three load-bearing
  beats from earlier slots:
    - struct declaration (slot 1)
    - struct literal with named fields (slot 2)
    - pass-by-pointer for mutation (slot 6)

  Author had to write `c.n++` (auto-deref through pointer) — the
  hint copy doesn't explicitly call out the auto-deref because
  it Just Works; a learner who tried `(*c).n++` would still pass.
  If feedback shows that's a paper-cut, surface in slot 6's
  hint chain.
