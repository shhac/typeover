target: go
themeId: go/types/structs
type: fill-line
order: 6
prompt: |
  TS-leak alert. In TypeScript, passing an object to a function
  shares the reference — callee mutations are visible to the
  caller. In Go, structs are VALUE TYPES: passing a struct copies
  the whole thing, and the callee's mutations vanish on return.

  Fix the broken `bump` so calling it from `main` actually
  increments `c.n`. The blank is the function PARAMETER list —
  type the linenature that takes the struct in a way the callee
  CAN mutate.

  Expected output: `6` (the bump should land). The caller passes
  with `&c` already wired up; only the parameter list is wrong.
generator:
  kind: template
  vars:
    line:
      - "c *Counter"
  ts: |-
    type Counter = { n: number };
    function bump(c: Counter) { c.n += 1; }   // works in TS — objects share
    const c: Counter = { n: 5 };
    bump(c);
    console.log(c.n);   // 6 — but Go won't do this with a value param
  canonical: |-
    package main

    import "fmt"

    type Counter struct {
    	n int
    }

    func bump(${line}) {
    	c.n++
    }

    func main() {
    	c := Counter{n: 5}
    	bump(&c)
    	fmt.Println(c.n)
    }
  distractors:
    - match: "c Counter"
      explain: |-
        That's pass-by-VALUE — `c` inside `bump` is a COPY of the
        caller's struct. `c.n++` mutates the copy, then the
        function returns and the copy is discarded. The caller's
        `c.n` stays at 5. Type the pointer form so the callee
        gets a handle to the caller's storage.
    - match: "c &Counter"
      explain: |-
        Mixed up where `&` goes. `&` is the ADDRESS-OF operator —
        you write it at the CALL SITE (`bump(&c)`, already in
        place) to take a pointer-to-c. The TYPE side uses `*` to
        say "a pointer to a Counter". So the parameter list is
        `c *Counter`, not `c &Counter`.
    - match: "&c Counter"
      explain: |-
        Wrong slot for `&` again. Parameter declarations are
        `<name> <type>` — `&c Counter` declares a parameter
        literally named `&c`, which isn't a valid identifier.
        The type modifier is `*Counter`.
    - match: "c **Counter"
      explain: |-
        Pointer-to-pointer. Works for nested indirection
        scenarios but is overkill here — there's no pointer
        already in flight to take the address OF. Single `*`
        is what `bump(&c)` produces.
expectStdout: |
  6
runtime: yaegi
blanks: [line]
hints:
  - "Go's structs pass by VALUE. To let the callee mutate the caller's struct, pass a POINTER instead. The caller has already done its part: `bump(&c)` takes the address. You need to change the parameter list to accept a pointer."
  - "Parameter shape: `<name> <type>`. The type is `*Counter` (pointer-to-Counter). Name is `c`, same as before."
  - "`c *Counter`."
notes: |
  THE pass-by-value beat for structs. Direct mirror of Module 2
  Theme 2.1 slot 8 (`xs []int` vs `xs [3]int`) — same divergence,
  different surface: slices have a reference-shaped header (the
  slot 8 lesson), structs don't (this slot's lesson).

  Distractor bank captures the four most common TS-dev mistakes:
    1. Plain `c Counter` — the actual bug; this is what they'd
       write if they forgot the value-vs-reference distinction.
    2. `c &Counter` — `&` on the type side. The `*` / `&` symmetry
       is a frequent confusion.
    3. `&c Counter` — `&` on the name side. Same confusion,
       different position.
    4. `c **Counter` — over-correction once they know `*` is
       involved.

  Auto-deref note: `c.n++` inside the function works without
  writing `(*c).n++` because Go auto-dereferences pointers for
  field access. The author doesn't need a separate slot to teach
  this; it Just Works. Worth flagging in the hint copy if a
  future learner trips on it.
