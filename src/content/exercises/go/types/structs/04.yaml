target: go
themeId: go/types/structs
type: fill-word
order: 4
prompt: |
  Type the field-access expression. Same `.` operator as
  TypeScript — no special syntax, no `[]` indexing, no `get`. The
  blank is the whole `varname.fieldname` expression.
generator:
  kind: template
  vars:
    expression: ["u.name"]
  ts: |-
    type User = { name: string; age: number };
    const u: User = { name: "alice", age: 30 };
    console.log(u.name);  // "alice"
  canonical: |-
    type User struct {
    	name string
    	age  int
    }
    u := User{name: "alice", age: 30}
    fmt.Println(${expression})
blanks: [expression]
hints:
  - "Go's field access uses `.` between the value and the field name — identical syntax to TypeScript / JavaScript. There's no method-style getter."
  - "Two tokens with a dot between: variable name on the left, field name on the right."
  - "`u.name`."
runtime: none
notes: |
  Field access is the smallest mechanical beat in Module 3. The
  syntax is identical to TS, so this slot exists to (a) ANCHOR
  that fact (no surprise — `.` works as expected) and (b) bind
  the field-access muscle memory before slot 6 hands the learner
  field-write semantics where the pass-by-value trap surfaces.

  Single-value `vars` because the drill is the SYNTAX (one
  pattern), not a variant cycle — Template generator picks each
  var independently, so multi-pool vars here would produce
  Frankenstein renderings (e.g. TS shows `u.name` but the
  Go scaffold blank's surrounding context says `p.<BLANK>`).
  When 3.1 needs cross-cutting variation, use a variant-kind
  MCQ (see slots 01-03).
