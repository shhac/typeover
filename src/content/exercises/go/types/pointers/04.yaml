target: go
themeId: go/types/pointers
type: fill-word
order: 4
prompt: |
  Take the address of `x` to create the pointer. The blank is the
  single operator that goes before the variable name.

  This is the "take a pointer" half of the `&` / `*` pair. Slot
  5 will be the deref half.
generator:
  kind: template
  vars:
    addr: ["&"]
  ts: |-
    let x = 42;
    // const p = { ref: x };  // TS has no address-of
  canonical: |-
    x := 42
    p := ${addr}x
blanks: [addr]
hints:
  - "Address-of operator. One character. It's the OPPOSITE of the deref operator from slot 1 — they form the `&` / `*` pair."
  - "Single character. C/C++ uses the same symbol for the same purpose."
  - "`&`."
runtime: none
notes: |
  One-character drill for the address-of operator. The slim
  surface is the whole point — typing `&` once cements that
  this is THE operator for "give me a pointer to this value".
  Pairs with slot 5 (deref) for the mirror beat.
