target: go
themeId: go/types/pointers
type: freeform
order: 9
prompt: |
  Theme capstone: a `describe(p *int)` function that prints either
  `got <value>` (when p is non-nil) or `(nil)` (when p is nil).
  Then call it twice from main — once with `&n` (a non-nil
  pointer) and once with bare `nil`.

  The lesson: ALWAYS check pointers for nil before dereferencing.
  A bare `*p` on a nil pointer panics (`runtime error: invalid
  memory address or nil pointer dereference` in real Go;
  Yaegi shows an opaque variant — design-docs/30). Production
  code defensively guards with `if p == nil { ... }`.

  Expected output:
  ```
  got 7
  (nil)
  ```

  TypeScript reference:
  ```ts
  function describe(p: { value: number } | null) {
    if (p === null) { console.log("(nil)"); return; }
    console.log("got " + p.value);
  }
  const n = { value: 7 };
  describe(n);
  describe(null);
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    function describe(p: { value: number } | null) {
      if (p === null) { console.log("(nil)"); return; }
      console.log("got " + p.value);
    }
    const n = { value: 7 };
    describe(n);
    describe(null);
  canonical: |-
    package main

    import "fmt"

    func describe(p *int) {
    	if p == nil {
    		fmt.Println("(nil)")
    		return
    	}
    	fmt.Println("got", *p)
    }

    func main() {
    	n := 7
    	describe(&n)
    	describe(nil)
    }
expectStdout: |
  got 7
  (nil)
hints:
  - "Two paths: if p is nil, print `(nil)` and return early. Otherwise dereference with `*p` to get the value, print `got <value>`."
  - "`fmt.Println(\"got\", *p)` is the idiomatic two-arg form — Println joins them with a space. No string concat needed."
  - "See canonical."
runtime: yaegi
notes: |
  Capstone — pulls together every operator-pair beat in this
  theme:
    - Nil-check on a pointer (slot 3 MCQ).
    - Deref to read (slots 1, 5).
    - Address-of to construct (slots 2, 4).
    - Pointer-as-parameter (slot 6).

  Yaegi caveat: we deliberately don't have the canonical TRIGGER
  a nil deref panic. The opaque `reflect: ...` error Yaegi
  produces would make stdout matching brittle and the lesson
  would feel like a bug rather than a teaching beat. The
  `(nil)` BRANCH is the path the learner needs to write; the
  defensive early-return is the muscle-memory bind.

  Module 3 milestone: with this slot landed, theme 3.3 is
  complete (9 slots, 4 runnable canonicals). Themes 3.1, 3.2,
  3.3 done; only 3.4 (nil-and-zero-values) remains in Module 3.
