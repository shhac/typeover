target: go
themeId: go/types/pointers
type: mcq
order: 1
prompt: |
  TypeScript hides pointer-vs-value behind "objects are
  references, primitives copy". Go makes the distinction
  EXPLICIT with two operators:

  - `&x` — ADDRESS-OF: produces a pointer to `x`.
  - `*p` — DEREFERENCE: reads through the pointer to the value.

  Pick the line that prints `42` given:
  ```go
  x := 42
  p := &x
  ```
  …where `p` holds the address of `x` and you want to print
  the value at that address.
generator:
  kind: variant
  variants:
    - id: int
      ts: |-
        // TS analog: implicit; const p = { value: x } and read p.value
        let x = 42;
        let p = { value: x };
        console.log(p.value);  // 42
      canonical: "fmt.Println(*p)"
      distractors:
        - "fmt.Println(&p)"
        - "fmt.Println(p)"
        - "fmt.Println(p->value)"
    - id: name
      ts: |-
        let name = "alice";
        let p = { value: name };
        console.log(p.value);  // alice
      canonical: "fmt.Println(*p)"
      distractors:
        - "fmt.Println(&p)"
        - "fmt.Println(p)"
        - "fmt.Println(p->value)"
    - id: count
      ts: |-
        let count = 7;
        let p = { value: count };
        console.log(p.value);  // 7
      canonical: "fmt.Println(*p)"
      distractors:
        - "fmt.Println(&p)"
        - "fmt.Println(p)"
        - "fmt.Println(p->value)"
hints:
  - "`&` and `*` are mirror operators. `&x` produces a pointer; `*p` reads through one. To go from `p := &x` BACK to the value of `x`, you dereference: `*p`."
  - "One character before `p`. The same character that turns `T` into `*T` in a type position (pointer-to-T)."
  - "`fmt.Println(*p)`."
runtime: none
notes: |
  Theme 3.3 opener. The `&` / `*` symmetry is the load-bearing
  Go-vs-TS divergence here. TS lets you reach through references
  with the same `.field` syntax for both pointer-like and value-
  like cases (because everything's behind a JS reference under
  the hood). Go makes the indirection explicit.

  Distractors:
    1. `&p` — prints the address-of-the-pointer (pointer-to-
       pointer). Operator confusion.
    2. `p` — prints the pointer itself (a hex address like
       `0xc000010098`), not the value it points to.
    3. `p->value` — C/C++ arrow-deref. Go has NO `->`. Field
       access through a pointer uses the bare `.` (Go auto-
       dereferences pointers for field access — covered in
       theme 3.1 slot 7's distractor and theme 3.2 slot 5).

  Variant kind drills the same `*p` deref across three pool
  scopes — pedagogy is the syntax, not the value type.

  Author note for theme 3.3: nil-pointer-deref under Yaegi
  produces an opaque `reflect: ...` error message rather than
  Go's canonical `runtime error: invalid memory address or nil
  pointer dereference` (design-docs/26 pre-flight). Slot
  authoring should grade stderr on the `panic:` prefix only,
  not the full message text — captured here so the freeform slots
  later in this theme don't trip on it.
