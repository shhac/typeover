target: go
themeId: go/types/methods
type: mcq
order: 2
prompt: |
  Go methods can take their receiver by VALUE (`func (c Counter)
  bump()`) or by POINTER (`func (c *Counter) bump()`). The choice
  isn't cosmetic — it determines whether the method can MUTATE the
  caller's struct.

  The TypeScript `bump` below mutates `this.n`. Pick the Go
  receiver shape that ACTUALLY mutates the caller's `Counter`
  (not a copy).
generator:
  kind: variant
  variants:
    - id: counter
      ts: |-
        class Counter {
          n: number = 0;
          bump() { this.n += 1; }
        }
      canonical: "func (c *Counter) bump() { c.n++ }"
      distractors:
        - "func (c Counter) bump() { c.n++ }"
        - "func (c &Counter) bump() { c.n++ }"
        - "func bump(c *Counter) { c.n++ }"
    - id: cart
      ts: |-
        class Cart {
          items: number = 0;
          add(n: number) { this.items += n; }
        }
      canonical: "func (c *Cart) add(n int) { c.items += n }"
      distractors:
        - "func (c Cart) add(n int) { c.items += n }"
        - "func (c &Cart) add(n int) { c.items += n }"
        - "func add(c *Cart, n int) { c.items += n }"
    - id: scale
      ts: |-
        class Point {
          x: number = 0; y: number = 0;
          scale(k: number) { this.x *= k; this.y *= k; }
        }
      canonical: "func (p *Point) scale(k int) { p.x *= k; p.y *= k }"
      distractors:
        - "func (p Point) scale(k int) { p.x *= k; p.y *= k }"
        - "func (p &Point) scale(k int) { p.x *= k; p.y *= k }"
        - "func scale(p *Point, k int) { p.x *= k; p.y *= k }"
hints:
  - "Value receivers (`c Counter`) get a COPY of the caller's struct — mutations vanish on return. Pointer receivers (`c *Counter`) get a handle to the caller's storage — mutations stick. Mirror of theme 3.1 exercise 6: same divergence, now scoped to methods."
  - "The type modifier on the receiver is `*Counter` (pointer-to-Counter). The `&` symbol is for the CALL site (taking the address), not the type."
  - "`func (c *Counter) bump() { c.n++ }`."
runtime: none
notes: |
  THE structural choice for methods. The rule of thumb most Go
  style guides converge on:
    - Pointer receiver if the method MUTATES the struct.
    - Pointer receiver if the struct is LARGE (avoid copying).
    - Value receiver for small, immutable-feeling types
      (Point, time.Time, color.RGBA).
    - Be CONSISTENT within a type: if any method takes *T, all
      methods do (mixing pointer + value receivers is a known
      footgun for interface satisfaction).

  Distractor bank:
    1. `func (c Counter) bump()` — value receiver. The actual
       common bug; the mutation is lost on return.
    2. `func (c &Counter) bump()` — `&` on the type side. Same
       symmetry confusion as theme 3.1 slot 6.
    3. `func bump(c *Counter)` — receiver as a normal parameter.
       Works in spirit but it's no longer a method; you'd call
       it as `bump(&c)` not `c.bump()`. Slot 1 already pinned
       this distinction; reinforcing here so it doesn't slip.

  Yaegi-runs-it caveat (design-docs/26 + /30): Yaegi DOES
  enforce the receiver-name and receiver-type syntax correctly
  here — the lesson lands cleanly at runtime in slot 6's
  fill-line, which builds on this MCQ.
