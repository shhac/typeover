target: go
themeId: go/types/methods
type: fill-word
order: 4
prompt: |
  Make the receiver a POINTER receiver so `bump` can mutate the
  caller's `Counter`. The blank is the type-side modifier.

  Without it, `bump` takes a copy and the mutation is invisible
  to `main` — same as exercise 6 of theme 3.1, now method-shaped.
generator:
  kind: template
  vars:
    ptr: ["*"]
  ts: |-
    class Counter { n = 0; bump() { this.n += 1; } }
    const c = new Counter();
    c.bump();
  canonical: |-
    type Counter struct {
    	n int
    }

    func (c ${ptr}Counter) bump() {
    	c.n++
    }
blanks: [ptr]
hints:
  - "The pointer-receiver shape uses an asterisk before the type name in the receiver list."
  - "One character. The same character that turns `T` into `*T` (pointer to T) anywhere else in Go."
  - "`*`."
runtime: none
notes: |
  Tightest mechanical drill: one character. The whole point of
  this fill is the muscle-memory mapping "this method should
  mutate → put a `*` before the receiver type". By forcing the
  learner to TYPE the asterisk, they commit to the value-vs-
  pointer choice rather than picking it from a list.

  Pairs with slot 2's MCQ which surfaced the choice; this slot
  makes them produce the right form. Slot 6 fill-line then
  exercises it end-to-end.
