target: go
themeId: go/types/methods
type: freeform
order: 9
prompt: |
  Theme capstone: a small Stack-of-int implementation with
  multiple methods. The methods are intentionally inconsistent in
  TypeScript (pushes mutate, peeks don't) — translate to Go
  using POINTER receivers throughout for consistency, even on the
  read-only `peek`. Go style-guide consensus: if any method on T
  uses *T, all should.

  Build:
  1. `type Stack struct { items []int }`
  2. `(s *Stack) push(v int)` — append to items.
  3. `(s *Stack) pop() int` — remove and return the last item.
  4. `(s *Stack) peek() int` — return the last item without
     removing.

  In `main`: push 10, 20, 30 in that order, then print
  `s.peek()`, `s.pop()`, `s.peek()` — one per line.

  Expected output:
  ```
  30
  30
  20
  ```

  Drills: pointer-receiver consistency rule, method
  composition, slice mutation through a struct field
  (collections-meets-types crossover).

  TypeScript reference:
  ```ts
  class Stack {
    items: number[] = [];
    push(v: number) { this.items.push(v); }
    pop() { return this.items.pop()!; }
    peek() { return this.items[this.items.length - 1]; }
  }
  const s = new Stack();
  s.push(10); s.push(20); s.push(30);
  console.log(s.peek()); // 30
  console.log(s.pop());  // 30
  console.log(s.peek()); // 20
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    class Stack {
      items: number[] = [];
      push(v: number) { this.items.push(v); }
      pop() { return this.items.pop()!; }
      peek() { return this.items[this.items.length - 1]; }
    }
    const s = new Stack();
    s.push(10); s.push(20); s.push(30);
    console.log(s.peek());
    console.log(s.pop());
    console.log(s.peek());
  canonical: |-
    package main

    import "fmt"

    type Stack struct {
    	items []int
    }

    func (s *Stack) push(v int) {
    	s.items = append(s.items, v)
    }

    func (s *Stack) pop() int {
    	v := s.items[len(s.items)-1]
    	s.items = s.items[:len(s.items)-1]
    	return v
    }

    func (s *Stack) peek() int {
    	return s.items[len(s.items)-1]
    }

    func main() {
    	s := Stack{}
    	s.push(10)
    	s.push(20)
    	s.push(30)
    	fmt.Println(s.peek())
    	fmt.Println(s.pop())
    	fmt.Println(s.peek())
    }
expectStdout: |
  30
  30
  20
hints:
  - "Three methods, all pointer receivers (`*Stack`). `push` appends to `s.items`; `pop` reads the last element, shrinks the slice with `s.items[:len(s.items)-1]`, returns the read value; `peek` reads without shrinking."
  - "Don't forget to ASSIGN BACK after `append` — `s.items = append(s.items, v)` (Module 2 theme 2.1 exercise 5)."
  - "See canonical."
runtime: yaegi
notes: |
  Capstone exercise pulling theme 3.2 (methods) together with
  Module 2's collection lessons (append-return-must-assign-back,
  slice mutation through a struct field). Three-method type
  exercises the consistency rule (all pointer receivers) and the
  slice-mutation idiom (`append` + reassign, `s[:len-1]` slicing
  for pop).

  Authoring note: `peek` IS a read-only method that conceptually
  could be a value receiver. We use *Stack here per the
  consistency rule, which is the Go community's strong
  preference for any type with at least one pointer-receiver
  method. Slot 2's MCQ surfaced the choice; slot 8 demonstrated
  mixed receivers; slot 9 holds the consistency line.

  This also previews module 4's interfaces theme — a Stack with
  push/pop/peek methods is satisfying a (yet-undeclared)
  `Stack` interface. The transition to interfaces will reuse
  this shape.
