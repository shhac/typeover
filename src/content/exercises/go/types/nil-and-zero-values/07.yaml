target: go
themeId: go/types/nil-and-zero-values
type: mcq
order: 7
prompt: |
  Slot 5 showed a nil SLICE is fully usable for `append`.
  What about a nil MAP? Given:

  ```go
  var m map[string]int
  ```

  …pick the line that correctly describes what happens for each
  operation on `m`.
generator:
  kind: template
  vars:
    answer: ["READ (m[\"k\"]) returns the zero value (0); WRITE (m[\"k\"] = v) panics"]
  ts: |-
    // TS: Record types start as undefined; you have to {} them first.
    // Go's nil map READS are graceful; WRITES blow up.
  canonical: ${answer}
  distractors:
    - "both READ and WRITE work (nil map auto-initialises like nil slice)"
    - "both READ and WRITE panic (nil map is unusable)"
    - "READ panics; WRITE works (nil sentinel allows append-style growth)"
hints:
  - "Asymmetry: nil maps READ like an empty map (missing-key returns zero), but cannot be WRITTEN to. The write attempts to allocate into a non-existent backing table and panics."
  - "READ: ok (returns zero). WRITE: panic."
  - "`READ returns zero; WRITE panics`."
runtime: none
notes: |
  The nil-slice vs nil-map asymmetry is a frequent confusion.
  Slot 5 cemented "nil slice + append = works". This slot
  pins the divergence: nil map + write = panic. The fix is
  `m = make(map[K]V)` BEFORE the first write — Module 2 theme
  2.2 slot 8 already drilled this fill-line; here it surfaces
  as a recognition of the underlying nil-map behavior.

  Distractors:
    1. "both work" — overgeneralising from slice behavior.
    2. "both panic" — overgeneralising from "nil = bad".
    3. "READ panics; WRITE works" — inverted; this is the
       opposite of reality.

  Single-variant template because the answer is canonical and
  cycling adds no value.
