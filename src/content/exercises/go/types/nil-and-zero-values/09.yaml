target: go
themeId: go/types/nil-and-zero-values
type: freeform
order: 9
prompt: |
  Module 3 capstone. Build a small program that exercises
  three nil-related behaviors:

  1. A function `safeGet(m map[string]int, key string) int`
     that returns `m[key]` (works on nil map — reads return
     zero).
  2. A function `safeAppend(xs []int, v int) []int` that
     returns `append(xs, v)` (works on nil slice — first
     append allocates).
  3. In `main`: call both helpers with their zero-value
     inputs (a nil map and a nil slice) and print:
       - `safeGet(nil-map, "missing")` → 0
       - `safeAppend(nil-slice, 7)` → [7]

  Expected output:
  ```
  0
  [7]
  ```

  TypeScript reference:
  ```ts
  // TS needs explicit guards:
  function safeGet(m: Record<string, number> | null, k: string): number {
    return (m && m[k]) ?? 0;
  }
  function safeAppend(xs: number[] | null, v: number): number[] {
    return (xs ?? []).concat([v]);
  }
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    function safeGet(m: Record<string, number> | null, k: string): number {
      return (m && m[k]) ?? 0;
    }
    function safeAppend(xs: number[] | null, v: number): number[] {
      return (xs ?? []).concat([v]);
    }
    console.log(safeGet(null, "missing"));   // 0
    console.log(safeAppend(null, 7));         // [7]
  canonical: |-
    package main

    import "fmt"

    func safeGet(m map[string]int, key string) int {
    	return m[key]
    }

    func safeAppend(xs []int, v int) []int {
    	return append(xs, v)
    }

    func main() {
    	var m map[string]int
    	var xs []int
    	fmt.Println(safeGet(m, "missing"))
    	fmt.Println(safeAppend(xs, 7))
    }
expectStdout: |
  0
  [7]
hints:
  - "Both helpers can be ONE-LINERS: `safeGet` returns `m[key]` (nil map read is graceful), `safeAppend` returns `append(xs, v)` (nil slice append allocates). No nil checks needed."
  - "The TS version needs `??` fallbacks; the Go version doesn't. That difference IS the lesson."
  - "See canonical."
runtime: yaegi
notes: |
  Module 3 capstone — pulls together the zero-value-is-useful
  thread from slots 5 (slice append) and 7 (map read), and
  contrasts the Go API surface against the TS one (defensive
  guards vs zero-value-rely).

  The TWO helpers are intentionally tiny — the lesson is that
  Go's zero-value semantics make their bodies trivial. A TS
  port has to thread `null` through every guard; the Go port
  doesn't. That difference shapes how Go APIs are designed:
  prefer types whose zero value is useful; let callers pass
  the zero value as the "I don't have one" signal.

  With this slot, Module 3 (types & methods) is COMPLETE:
