target: go
themeId: go/types/nil-and-zero-values
type: freeform
order: 6
prompt: |
  Theme capstone — write a complete program that demonstrates
  the nil-interface trap from slot 3 (the recognition MCQ).
  The point is to make the trap concrete by running it.

  Build:
  1. `type Error interface { Error() string }`
  2. `type MyErr struct{}` with a pointer-receiver `Error()
     string` method that returns `"my error"`.
  3. `func mightFail() Error` that declares `var p *MyErr`
     (nil pointer) and returns it as the interface type.
  4. In `main`: call `mightFail()`, store in `e`, print `e ==
     nil`.

  Expected output: `false` — the interface wraps a typed-nil
  pointer; (type=*MyErr, value=nil) is NOT (type=nil, value=nil).

  TypeScript reference:
  ```ts
  // TS interfaces are structural; this trap doesn't translate.
  // Closest analog: a non-null variable holding null doesn't
  // make the variable "null" — but TS rarely lets you express that.
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    // The nil-interface trap has no clean TS equivalent — TS
    // interfaces don't carry runtime type descriptors. Closest
    // shape is a discriminated-union with `null` in one branch,
    // but the failure mode is different.
  canonical: |-
    package main

    import "fmt"

    type Error interface {
    	Error() string
    }

    type MyErr struct{}

    func (m *MyErr) Error() string {
    	return "my error"
    }

    func mightFail() Error {
    	var p *MyErr
    	return p
    }

    func main() {
    	e := mightFail()
    	fmt.Println(e == nil)
    }
expectStdout: |
  false
hints:
  - "An interface value carries (type descriptor, data pointer). It compares equal to `nil` ONLY when BOTH halves are nil. Returning `var p *MyErr` (typed-nil pointer) through an interface return type fills in the type half — the interface is non-nil."
  - "Three pieces: interface type, concrete type with pointer-receiver method, function that returns a typed-nil through the interface."
  - "See canonical."
runtime: yaegi
notes: |
  Final slot of Theme 3.4 — closes Module 3 of 7.

  The trap WORKS on Yaegi (probed in this tick) — the
  interface header carries the type descriptor independent of
  the data pointer being nil. Production Go's most-cited
  gotcha; pinning it as a runnable freeform is far more
  impactful than just the recognition MCQ.

  Authoring decision: kept this as the freeform rather than
  authoring slots 07-09 as more drills. design-docs/26 P8 brief
  sketch called for ~6 productive slots for this theme; with
  01-06 covering zero-value table, nil-able list, nil-interface
  trap (recognition), nil literal, append-to-nil-slice
  productive use, and this nil-interface trap (production) —
  the theme has the right shape. Slots 07-09 stay as
  documented stubs unless future authoring surfaces a real
  gap.
