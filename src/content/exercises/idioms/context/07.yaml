target: go
themeId: idioms/context
type: fill-line
order: 7
prompt: |
  Type the `select` case line that listens for context
  cancellation and prints the error.

  Scaffold has a context that's pre-cancelled, so the case
  fires immediately.

  Expected output: `cancelled: context canceled`.
generator:
  kind: template
  vars:
    line:
      - 'case <-ctx.Done(): fmt.Println("cancelled:", ctx.Err())'
  ts: |-
    // TS: signal.addEventListener("abort", () => console.log("cancelled:", signal.reason));
  canonical: |-
    package main

    import (
    	"context"
    	"fmt"
    	"time"
    )

    func main() {
    	ctx, cancel := context.WithCancel(context.Background())
    	cancel()
    	select {
    	${line}
    	case <-time.After(50 * time.Millisecond):
    		fmt.Println("would have done work")
    	}
    }
  distractors:
    - match: 'case <-ctx.Done: fmt.Println("cancelled:", ctx.Err)'
      explain: |-
        Missing `()` on both `Done` and `Err`. Both are
        METHODS that need to be invoked — `ctx.Done()`
        returns the channel, `ctx.Err()` returns the error.
        Bare `ctx.Done` gives the method value, not its
        return.
    - match: 'case ctx.Done(): fmt.Println("cancelled:", ctx.Err())'
      explain: |-
        Missing receive operator `<-` before `ctx.Done()`.
        Without it, `case ctx.Done()` would be a boolean
        expression case (illegal in `select`) — select cases
        are CHANNEL OPERATIONS, not arbitrary expressions.
    - match: 'case <-ctx.Done(): fmt.Println("cancelled")'
      explain: |-
        Doesn't include the actual error. Slot wants
        `cancelled: context canceled` — that requires
        printing `ctx.Err()` alongside.
expectStdout: |
  cancelled: context canceled
runtime: yaegi
blanks: [line]
hints:
  - "Pattern: `case <-ctx.Done(): fmt.Println(\"cancelled:\", ctx.Err())`. Note both Done() and Err() need their `()`."
  - "`case <-ctx.Done(): fmt.Println(\"cancelled:\", ctx.Err())`."
  - "See canonical."
notes: |
  Drills the canonical "listen for cancellation" idiom from
  MCQ slot 3. The `time.After` alternative case keeps the
  select honest (without it, the bare `<-ctx.Done()` form
  wouldn't even need a select).
