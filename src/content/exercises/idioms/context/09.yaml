target: go
themeId: idioms/context
type: freeform
order: 9
prompt: |
  Theme 7.3 capstone — context propagation across goroutines.
  Build a worker function that takes `ctx context.Context`
  as its first arg (Go convention) and exits cleanly when
  the context is cancelled.

  1. `worker(ctx context.Context, done chan<- string)`:
     - `select`:
       - `case <-ctx.Done():` send `"cancelled"` on `done`.
       - `case <-time.After(200 * time.Millisecond):` send
         `"finished work"` on `done`.
  2. In `main`:
     - `ctx, cancel := context.WithCancel(context.Background())`.
     - `done := make(chan string, 1)`.
     - `go worker(ctx, done)`.
     - Sleep 30ms (`time.Sleep(30 * time.Millisecond)`),
       then `cancel()`.
     - `fmt.Println(<-done)`.

  Expected output: `cancelled`.

  The main goroutine cancels at 30ms; the worker's
  ctx.Done case fires immediately; worker sends
  "cancelled"; main reads + prints.
generator:
  kind: template
  vars: {}
  ts: |-
    // TS: pass ctrl.signal to the worker; worker checks signal.aborted
    // or registers an abort listener; main calls ctrl.abort().
  canonical: |-
    package main

    import (
    	"context"
    	"fmt"
    	"time"
    )

    func worker(ctx context.Context, done chan<- string) {
    	select {
    	case <-ctx.Done():
    		done <- "cancelled"
    	case <-time.After(200 * time.Millisecond):
    		done <- "finished work"
    	}
    }

    func main() {
    	ctx, cancel := context.WithCancel(context.Background())
    	done := make(chan string, 1)
    	go worker(ctx, done)
    	time.Sleep(30 * time.Millisecond)
    	cancel()
    	fmt.Println(<-done)
    }
expectStdout: |
  cancelled
hints:
  - "Three pieces: worker function with ctx + done params, main with ctx/cancel/done setup, the go-launch + time.Sleep + cancel + receive sequence."
  - "Worker selects on ctx.Done OR the long-work alternative. Main cancels before the long work would finish, so ctx.Done wins."
  - "See canonical."
runtime: yaegi
notes: |
  Theme 7.3 capstone. Pulls together:
    - context.WithCancel + cancel function
    - ctx.Done() in a select
    - context propagation as first function arg
    - goroutine + buffered channel for back-signal

  THE canonical "cancellable worker" pattern — the shape
  every Go HTTP handler that spawns a sub-task uses (with
  the request context as parent).

  Note: `chan<- string` is a SEND-ONLY channel type
  (theme 6.2 intro) — the worker can only SEND, not
  receive, on `done`. This is a common API-tightening
  habit when passing channels into worker functions.

