target: go
themeId: idioms/embedding
type: freeform
order: 9
prompt: |
  Theme 7.2 capstone — interface satisfaction via embedded
  methods. The embedded type's method set carries through:
  if `Animal` satisfies the `Describer` interface, so does
  any type that embeds `Animal`.

  1. `type Describer interface { Describe() string }`.
  2. `type Animal struct{ Name string }` with method
     `Describe() string` returning `"animal " + Name`.
  3. `type Dog struct{ Animal }` (embeds Animal; defines no
     methods of its own).
  4. In main, demonstrate both Animal and Dog satisfy
     Describer by calling a helper:
     `func describeIt(d Describer) { fmt.Println(d.Describe()) }`.
     Call `describeIt(Animal{Name: "Cat"})` and
     `describeIt(Dog{Animal: Animal{Name: "Rex"}})`.

  Expected output:
  ```
  animal Cat
  animal Rex
  ```

  Dog satisfies `Describer` AUTOMATICALLY because the
  embedded Animal's Describe method promotes onto Dog's
  method set.
generator:
  kind: template
  vars: {}
  ts: |-
    // TS: structural interface — both satisfy implicitly. Same outcome,
    // different mechanism.
  canonical: |-
    package main

    import "fmt"

    type Describer interface {
    	Describe() string
    }

    type Animal struct {
    	Name string
    }

    func (a Animal) Describe() string {
    	return "animal " + a.Name
    }

    type Dog struct {
    	Animal
    }

    func describeIt(d Describer) {
    	fmt.Println(d.Describe())
    }

    func main() {
    	describeIt(Animal{Name: "Cat"})
    	describeIt(Dog{Animal: Animal{Name: "Rex"}})
    }
expectStdout: |
  animal Cat
  animal Rex
hints:
  - "Four pieces: `Describer` interface, `Animal` + Describe method, `Dog` embedding Animal (no method of its own), `describeIt` helper, main calling helper with both."
  - "Dog doesn't need its own Describe — the embedded Animal's Describe promotes onto Dog's method set, automatically satisfying the Describer interface."
  - "See canonical."
runtime: yaegi
notes: |
  Theme 7.2 capstone — embedding × interfaces. The promoted
  method satisfies the interface contract, so Dog can be
  passed wherever a Describer is expected.

  This is the load-bearing reason embedding feels like
  inheritance in practice: the outer type "is-a" inner type
  for interface satisfaction purposes.

  Module 7 status: 2 of 7 themes done. Themes 7.3-7.7 remain
  (context, testing, small-interfaces, project-layout,
  gotchas).
