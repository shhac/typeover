target: go
themeId: idioms/defer
type: freeform
order: 8
prompt: |
  Demonstrate LIFO ordering of multiple defers.

  1. In `main`, defer three prints in order:
     `defer fmt.Println("first deferred")`
     `defer fmt.Println("second deferred")`
     `defer fmt.Println("third deferred")`
  2. After the defers, print `"main body"`.

  Expected output (LIFO order — last-deferred fires first
  on return):
  ```
  main body
  third deferred
  second deferred
  first deferred
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    // TS analog: try { console.log("main body") } finally {
    //   console.log("third"); finally { console.log("second"); finally { console.log("first"); }
    // — nested try/finally captures LIFO order naturally.
  canonical: |-
    package main

    import "fmt"

    func main() {
    	defer fmt.Println("first deferred")
    	defer fmt.Println("second deferred")
    	defer fmt.Println("third deferred")
    	fmt.Println("main body")
    }
expectStdout: |
  main body
  third deferred
  second deferred
  first deferred
hints:
  - "Three defers in declaration order, then a non-deferred print. On main's return, the defers unwind LIFO."
  - "Defers form a stack: push on defer, pop on return."
  - "See canonical."
runtime: yaegi
notes: |
  Drills MCQ slot 2's LIFO ordering with observable output.

  Real-world implication: nested resource acquisition
  unwinds inner-first naturally. E.g.:
  ```
  f, _ := os.Open("a")
  defer f.Close()
  g, _ := os.Open("b")
  defer g.Close()
  // ... work ...
  // returns: g.Close() runs FIRST (acquired second), then
  // f.Close() (acquired first). Matches natural intuition.
  ```
