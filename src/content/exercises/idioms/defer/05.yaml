target: go
themeId: idioms/defer
type: fill-word
order: 5
prompt: |
  The most common production use of `defer` is to release a
  resource: `defer X.${word}()` right after acquisition.
  Type the conventional method name.
generator:
  kind: template
  vars:
    word:
      - "Close"
  ts: |-
    // TS: stream.close() / writer.end()
  canonical: |-
    package main

    import "fmt"

    type fakeFile struct{}

    func (f *fakeFile) ${word}() { fmt.Println("file closed") }

    func openFile() *fakeFile { return &fakeFile{} }

    func main() {
    	f := openFile()
    	defer f.${word}()
    	fmt.Println("doing work with file")
    }
runtime: none
blanks: [word]
hints:
  - "Five letters, capitalised (exported). Same English verb as `door`. Used on file handles, network connections, channels (in a different syntax)."
  - "`Close`."
  - "`Close`."
notes: |
  Pin the conventional method name. `Close()` is the canonical
  resource-release verb across the stdlib: `os.File.Close`,
  `net.Conn.Close`, `sql.DB.Close`, etc. The `defer f.Close()`
  idiom is THE most common defer use in real code.

  Runtime: none — we don't have `os` vendored, so the real
  `os.Open` + `f.Close()` chain isn't runnable. The slot pins
  the name + shape via a fake-file struct that mirrors the
  pattern.
