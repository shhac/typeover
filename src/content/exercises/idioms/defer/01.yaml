target: go
themeId: idioms/defer
type: mcq
order: 1
prompt: |
  `defer` schedules a function call to run when the
  enclosing function returns. Pick the line that defers a
  call to `cleanup()`.

  TypeScript: `try { ... } finally { cleanup(); }` — same
  idea, no extra indentation in Go.
generator:
  kind: variant
  variants:
    - id: defer-call
      ts: |-
        // TS: try { work(); } finally { cleanup(); }
        // Go: defer cleanup() — no indentation, no block.
      canonical: "defer cleanup()"
      distractors:
        - "defer { cleanup() }"
        - "finally cleanup()"
        - "defer.cleanup"
hints:
  - "Two tokens: the keyword `defer` and a function call. Same shape as a normal call site — just the keyword in front."
  - "`defer <call-expression>`. The call expression is `cleanup()`."
  - "`defer cleanup()`."
runtime: none
notes: |
  Theme 7.1 opener. Defer is one of Go's most distinctive
  features — every fallible resource (file handle, mutex,
  network connection) gets a `defer X.Close()` immediately
  after acquisition.

  Distractors:
    1. `defer { cleanup() }` — block syntax; defer takes a
       single function call, not a block.
    2. `finally cleanup()` — Java/JS keyword; Go uses defer.
    3. `defer.cleanup` — method-call shape; defer is a
       statement keyword, not an object.
