target: go
themeId: idioms/small-interfaces
type: fill-word
order: 5
prompt: |
  Type the keyword that starts an interface declaration
  in Go (paired with the type name and `interface { ... }`
  body).
generator:
  kind: template
  vars:
    word:
      - "interface"
  ts: |-
    // TS: interface Stringer { toString(): string }
  canonical: |-
    package main

    import "fmt"

    type Stringer ${word} {
    	String() string
    }

    type Tag struct{ name string }

    func (t Tag) String() string { return "tag<" + t.name + ">" }

    func print(s Stringer) { fmt.Println(s.String()) }

    func main() {
    	print(Tag{name: "go"})
    }
runtime: none
blanks: [word]
hints:
  - "Nine letters, lowercase. Same word used in TypeScript / Java / C# for the same concept."
  - "`interface`."
  - "`interface`."
notes: |
  Pin the keyword. Demonstrates the "accept interfaces"
  half of the slot 1 rule — `print` takes a Stringer, so
  any type with a `String() string` method works.

  Runtime: none — the program compiles + runs but we
  don't pin output here.
