target: go
themeId: idioms/small-interfaces
type: fill-line
order: 6
prompt: |
  Define the `Stringer` interface — one method, `String()
  string`.

  Expected output: `<Cat>`.

  Scaffold creates a `Cat` type with the method already
  defined, plus a `describe` helper that takes a Stringer
  param. You're typing the interface declaration.
generator:
  kind: template
  vars:
    line:
      - "type Stringer interface { String() string }"
  ts: |-
    // TS: interface Stringer { toString(): string }
  canonical: |-
    package main

    import "fmt"

    ${line}

    type Cat struct{}

    func (Cat) String() string { return "<Cat>" }

    func describe(s Stringer) { fmt.Println(s.String()) }

    func main() {
    	describe(Cat{})
    }
  distractors:
    - match: "type Stringer interface { ToString() string }"
      explain: |-
        Wrong method name — Go's convention is `String()`,
        not `ToString()` (Java/JS habit). The `fmt` package
        specifically looks for `String()`.
    - match: "type Stringer struct { String string }"
      explain: |-
        `struct` with a `String string` field instead of
        an interface with a method. Different concepts —
        a struct has DATA fields; an interface lists
        METHOD signatures.
    - match: "interface Stringer { String() string }"
      explain: |-
        Missing `type` keyword. Go's full declaration form
        is `type <name> interface { ... }`. The bare
        `interface` keyword can also be used as a TYPE
        EXPRESSION (e.g. `var x interface{ ... }`), but
        named interfaces need `type` upfront.
expectStdout: |
  <Cat>
runtime: yaegi
blanks: [line]
hints:
  - "Pattern: `type <Name> interface { <Method>(<params>) <returns> }`. One line for a one-method interface."
  - "`type Stringer interface { String() string }`."
  - "`type Stringer interface { String() string }`."
notes: |
  First runnable slot. Demonstrates the full small-interface
  workflow: declare interface → method-implementer
  satisfies it implicitly → caller takes interface +
  pattern works for any conforming type.

  `func (Cat) String() string` (no receiver name) is valid
  Go for methods that don't need to access fields — common
  shorthand when the receiver is unused.
