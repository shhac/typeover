target: go
themeId: idioms/small-interfaces
type: freeform
order: 9
prompt: |
  Theme 7.5 capstone — "accept interfaces" in action. Define
  a one-method `Greeter` interface, two unrelated types that
  satisfy it implicitly, and a polymorphic function that
  takes the interface.

  1. `type Greeter interface { Greet() string }`.
  2. `type English struct{}` with `Greet() string` returning
     `"Hello"`.
  3. `type Japanese struct{}` with `Greet() string` returning
     `"Konnichiwa"`.
  4. `func greetAll(gs []Greeter)` that loops and prints
     each greeting on its own line.
  5. In main, `greetAll([]Greeter{English{}, Japanese{}})`.

  Expected output:
  ```
  Hello
  Konnichiwa
  ```

  The two types don't know about each other; they don't
  declare "implements Greeter" anywhere. Just defining
  `Greet() string` is enough. THIS is what makes small
  interfaces powerful — implementations can be added
  without modifying the interface or other implementers.
generator:
  kind: template
  vars: {}
  ts: |-
    // TS: structural typing handles this implicitly — same outcome,
    // same shape, no `implements` keyword needed.
  canonical: |-
    package main

    import "fmt"

    type Greeter interface {
    	Greet() string
    }

    type English struct{}

    func (English) Greet() string { return "Hello" }

    type Japanese struct{}

    func (Japanese) Greet() string { return "Konnichiwa" }

    func greetAll(gs []Greeter) {
    	for _, g := range gs {
    		fmt.Println(g.Greet())
    	}
    }

    func main() {
    	greetAll([]Greeter{English{}, Japanese{}})
    }
expectStdout: |
  Hello
  Konnichiwa
hints:
  - "Five pieces: Greeter interface, English with Greet method, Japanese with Greet method, greetAll helper iterating over []Greeter, main constructing the slice and calling helper."
  - "No explicit `implements` declaration — just defining Greet() satisfies the interface."
  - "See canonical."
runtime: yaegi
notes: |
  Theme 7.5 capstone. Demonstrates the load-bearing
  capability of small interfaces:

  1. **Open for extension** — add a third language type
     anywhere in the codebase without touching the existing
     types or interface.
  2. **Closed against accidental coupling** — types don't
     need to import the interface to satisfy it.
  3. **Substitutability** — `greetAll` works for any
     `[]Greeter`, including test fakes.

  Heterogeneous slice (`[]Greeter`) holds different concrete
  types — the interface is the common contract. Theme 4.1
  covered this in depth; this slot re-pins it in the
  "small interface" frame.

  Module 7 status: 4 of 7 themes done. Themes 7.4 (testing),
  7.6 (project-layout), 7.7 (gotchas) remain.
