target: go
themeId: idioms/gotchas
type: mcq
order: 1
prompt: |
  **Interface nil vs concrete nil** — Go's most-famous trap.
  Pick the line that prints, after `func returnsError() error {
     var p *MyErr; return p }` is called:

  ```go
  err := returnsError()
  if err == nil { fmt.Println("ok") } else { fmt.Println("bad:", err) }
  ```

  (`*MyErr` satisfies the `error` interface via its Error()
  method.)

  TypeScript: `null` is `null`; no interface/concrete
  asymmetry. Go's interface variable holds (type, value);
  it's nil only if BOTH are nil.
generator:
  kind: variant
  variants:
    - id: nil-interface-trap
      ts: |-
        // TS: returnNull(): Error | null = null; const e = returnNull();
        // if (e === null) ... — straightforward.
        // Go: interface compares non-nil if type is set even when value is nil.
      canonical: "Prints `bad: <nil>`. The interface variable holds (type=*MyErr, value=nil) — its TYPE side is non-nil, so `err == nil` is FALSE. Then Error() on a nil pointer prints `<nil>`."
      distractors:
        - "Prints `ok`. A nil pointer inside an interface compares equal to nil."
        - "Panics with `nil pointer dereference` immediately on the `if err == nil` check."
        - "Compiler error — you can't return a typed nil from a function that returns an interface."
hints:
  - "Interface value is a (TYPE, VALUE) pair. Equals-nil only if BOTH are nil."
  - "Type is set (*MyErr); value is nil. Interface compares non-nil; if-branch goes to else."
  - "`bad: <nil>` — the if treats it as non-nil."
runtime: none
notes: |
  THE gotcha. Anyone who's debugged Go has hit it. The
  classical mistake is writing:

  ```go
  func doThing() error {
      var p *MyErr
      // ... compute things ...
      return p   // ← here
  }
  ```

  Caller does `if err := doThing(); err != nil { ... }`
  and ALWAYS enters the error branch, even when the
  computation was successful.

  Fix: return BARE `nil`, not a typed nil:
  ```go
  func doThing() error {
      // ... compute things ...
      return nil   // ← here
  }
  ```

  Distractors:
    1. "Prints ok" — the common-but-wrong intuition.
    2. "Panics on if-check" — false; comparison doesn't
       dereference.
    3. "Compiler error" — false; the conversion is legal.

  Probed + confirmed working in Yaegi 2026-05-21 per
  design-docs/30 confirmed-WORKING list.
