target: go
themeId: idioms/testing
type: mcq
order: 2
prompt: |
  Pick the IDIOMATIC signature for a top-level Go test
  function.

  TypeScript: `test("description", () => { ... })` or
  `describe(...)` + `it(...)`. Go's shape is a function
  declaration with a single mandatory parameter.
generator:
  kind: variant
  variants:
    - id: testing-t-param
      ts: |-
        // TS: test("adds", () => { expect(add(1, 1)).toBe(2); });
        // Go: func TestAdd(t *testing.T) { ... }
      canonical: "func TestAdd(t *testing.T) { ... }"
      distractors:
        - "func testAdd(t *testing.T) { ... }"
        - "func TestAdd() { ... }"
        - "test \"adds\" func(t *testing.T) { ... }"
hints:
  - "Three pieces: `func` keyword, name starting with `Test` + a CAPITAL letter, single `t *testing.T` parameter."
  - "`func TestAdd(t *testing.T)`."
  - "`func TestAdd(t *testing.T) { ... }`."
runtime: none
notes: |
  Two non-obvious rules:

  1. **`TestX` where X is exported-shaped** — the name must
     be `Test` followed by an uppercase letter. `Testfoo` is
     ALSO skipped silently (lowercase after the Test prefix).
  2. **`t *testing.T` parameter** — the test runner injects
     this, you don't construct it. The methods on `*T` are
     how you report failures.

  Distractors:
    1. Lowercase `testAdd` — skipped because not exported-
       shaped after the Test prefix.
    2. Missing `t *testing.T` parameter — the test runner
       expects exactly this signature.
    3. DSL-style `test "adds" func(...)` — JS / Ruby /
       Scala habit. Go uses bare functions.

  This rule plus slot 1 is the full discovery contract.
