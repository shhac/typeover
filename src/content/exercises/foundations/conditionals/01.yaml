target: go
themeId: foundations/conditionals
type: mcq
order: 1
prompt: |
  TypeScript's `if` wraps the condition in parentheses and allows
  single-statement bodies without braces. Go does both differently
  — no parens, braces always. Pick the idiomatic Go translation.
generator:
  kind: variant
  variants:
    - id: positive
      ts: 'if (x > 0) { print(x); }'
      canonical: 'if x > 0 { print(x) }'
      distractors:
        - 'if (x > 0) { print(x) }'
        - 'if x > 0: print(x)'
        - 'if x > 0 then print(x) end'
    - id: nonempty
      ts: 'if (name !== "") { greet(name); }'
      canonical: 'if name != "" { greet(name) }'
      distractors:
        - 'if (name != "") { greet(name) }'
        - 'if name !== "" { greet(name) }'
        - 'if name != "": greet(name)'
    - id: zero-check
      ts: 'if (count === 0) { reset(); }'
      canonical: 'if count == 0 { reset() }'
      distractors:
        - 'if (count == 0) { reset() }'
        - 'if count === 0 { reset() }'
        - 'if count.equals(0) { reset() }'
hints:
  - "Go drops two things TypeScript requires: the parens around the condition AND the `===`/`!==` strict-equality operators (Go has no loose-equality so just `==`/`!=` are used). Braces stay; they're always required, even for single statements."
  - "The shape is `if condition { body }`. Condition has no parens. Braces are mandatory. Equality is `==`, not `===`."
  - "For `count === 0`, Go writes `count == 0`. For `name !== \"\"`, Go writes `name != \"\"`. Braces and no parens — `if name != \"\" { greet(name) }`."
notes: |
  First Theme 4 exercise. Establishes the three reflexive
  TS-to-Go syntax shifts every learner needs to internalise:
   - No parens around the condition (legal but unidiomatic).
   - Braces always required, even single-statement bodies.
   - `==`/`!=` only — no `===`/`!==`.

  Three variants cover the three most common comparison shapes
  (numeric ordering, string equality, zero check). Distractors
  each fail in a distinct way: optional parens (legal but
  unidiomatic — same trap as `var` for declarations), TS strict-
  equality leaking in, and Python-style `:`-instead-of-braces.

  Variant kind because each example needs its own context-
  appropriate operands.
runtime: none
