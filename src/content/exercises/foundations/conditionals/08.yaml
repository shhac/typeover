target: go
themeId: foundations/conditionals
type: fill-line
order: 8
prompt: |
  Type the Go line that uses a `switch` statement to call `handle()`
  when `n` is either `1` or `2`. The program should print `matched`.
generator:
  kind: template
  vars:
    line:
      - 'switch n { case 1, 2: handle() }'
  ts: |-
    switch (n) {
      case 1:
      case 2:
        handle();
        break;
    }
  canonical: |-
    package main

    import "fmt"

    func handle() {
    	fmt.Println("matched")
    }

    func main() {
    	n := 1
    	${line}
    }
  distractors:
    - match: 'switch n { case 1: case 2: handle() }'
      explain: |-
        Go's `case` doesn't fall through by default the way C / Java
        / TS do. Empty `case 1:` matches `1` and does nothing —
        `handle()` only runs for `case 2`. To match multiple values
        with one body, list them comma-separated: `case 1, 2:`.
    - match: 'switch n { case 1 | 2: handle() }'
      explain: |-
        That's pipe-or pattern syntax from Rust / OCaml /
        pattern-matching languages. Go uses commas: `case 1, 2:`.
    - match: 'switch n { case [1, 2]: handle() }'
      explain: |-
        That would compare `n` against a slice literal — Go would
        reject it as a type mismatch. The `case` clause takes a list
        of *expressions*, comma-separated, each compared to the
        switch value: `case 1, 2:`.
    - match: 'switch n { match 1, 2: handle() }'
      explain: |-
        Some languages use `match` (Rust) or `when` (Kotlin) — Go
        sticks with `case`. The shape is `case VALUE, VALUE: …`.
expectStdout: |
  matched
runtime: yaegi
blanks: [line]
hints:
  - "Go's `case` clause accepts a comma-separated list of values; matching any of them runs the body. Other languages use `|`, arrays, or pattern syntaxes; Go just uses commas."
  - "The shape is `case 1, 2:`. Each value listed; one body."
  - "Type `switch n { case 1, 2: handle() }`."
notes: |
  Migrated to input+Yaegi UX. Scaffold defines `handle` that prints
  "matched". Distractors kept as wrong-pattern bank.
