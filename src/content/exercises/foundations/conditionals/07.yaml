target: go
themeId: foundations/conditionals
type: fill-line
order: 7
prompt: |
  Type the Go line that uses a `switch` statement to call `handle()`
  when `n` is either `1` or `2`. The program should print `matched`.
generator:
  kind: template
  vars:
    line:
      - 'switch n { case 1, 2: handle() }'
  ts: |-
    switch (n) {
      case 1:
      case 2:
        handle();
        break;
    }
  canonical: |-
    package main

    import "fmt"

    func handle() {
    	fmt.Println("matched")
    }

    func main() {
    	n := 1
    	${line}
    }
  distractors:
    - 'switch n { case 1: case 2: handle() }'
    - 'switch n { case 1 | 2: handle() }'
    - 'switch n { case [1, 2]: handle() }'
    - 'switch n { match 1, 2: handle() }'
expectStdout: |
  matched
runtime: yaegi
blanks: [line]
hints:
  - "Go's `case` clause accepts a comma-separated list of values; matching any of them runs the body. Other languages use `|`, arrays, or pattern syntaxes; Go just uses commas."
  - "The shape is `case 1, 2:`. Each value listed; one body."
  - "Type `switch n { case 1, 2: handle() }`."
notes: |
  Migrated to input+Yaegi UX. Scaffold defines `handle` that prints
  "matched". Distractors kept as wrong-pattern bank.
