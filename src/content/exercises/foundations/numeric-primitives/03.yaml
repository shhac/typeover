target: go
themeId: foundations/numeric-primitives
type: mcq
order: 3
prompt: |
  Go requires *explicit* conversion between numeric types. TypeScript
  truncates floats to ints with `Math.floor`; Go expects you to spell
  the cast out. Which Go line below is the idiomatic translation?
generator:
  kind: variant
  variants:
    - id: float-to-int
      ts: 'let n: number = Math.floor(f);'
      canonical: 'n := int(f)'
      distractors:
        - 'n := (int) f'
        - 'n := f as int'
        - 'n := Math.floor(f)'
    - id: int-to-float
      ts: 'let avg: number = total / count;'
      canonical: 'avg := float64(total) / float64(count)'
      distractors:
        - 'avg := (float64) total / count'
        - 'avg := total / count as float64'
        - 'avg := total / float(count)'
    - id: int32-to-int64
      ts: 'let big: number = small;'
      canonical: 'big := int64(small)'
      distractors:
        - 'big := (int64) small'
        - 'big := small as int64'
        - 'big := small'
hints:
  - "Go's conversion shape is `TargetType(value)` — a function call. Not a prefix `(TargetType)` like C, not an `as TargetType` like TS, and definitely not a JavaScript stdlib function."
  - "The general form is `int(x)` to convert to int, `float64(x)` to float64, `int64(x)` to int64. Always a function call on the type itself."
  - "Pick the variant where the conversion uses the function-call shape, e.g. `int(f)`, `int64(small)`, `float64(total)`."
notes: |
  Third recognition exercise. Introduces Go's distinctive conversion
  syntax: types are called like functions. This becomes important
  in slot 4-5 (fill-word) where the learner has to *write* a
  conversion.

  Variant set covers three realistic conversion shapes:
   - `int(f)` — floor a float to int, very common in arithmetic
   - `float64(total) / float64(count)` — average-style int → float
     idiom, the most-Googled Go pattern
   - `int64(small)` — widening conversion (int32 → int64), pinned
     because the learner will see this when interfacing with
     APIs that pick specific sizes

  Distractors deliberately mirror three other languages' cast
  syntax (C-style prefix cast, TS `as`, and the stdlib-function
  approach `Math.floor` carrying over from TS).

  Using `variant` kind because the three conversion examples have
  semantically distinct contexts — template substitution would
  collapse them into one repeated shape.
runtime: none
