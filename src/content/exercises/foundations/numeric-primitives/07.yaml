target: go
themeId: foundations/numeric-primitives
type: fill-line
order: 7
prompt: |
  When a number won't fit in a narrow integer type, Go silently
  overflows at runtime — no error, just wrong values. Picking the
  right width matters. Pick the line that holds this value safely.
generator:
  kind: template
  vars:
    line:
      - "var id int = 1_000_000_000"
      - "var id int16 = 1_000_000_000"
      - "var id int8 = 1_000_000_000"
      - "var id uint8 = 1_000_000_000"
      - "var id byte = 1_000_000_000"
  ts: |-
    let id: number = 1_000_000_000;
  canonical: |-
    ${line}
blanks: [line]
hints:
  - "Each integer type holds a different range. A signed 8-bit holds about -128 to 127; signed 16-bit goes up to about 32 thousand; signed 32-bit reaches ~2 billion. Pick a type whose range comfortably covers a billion."
  - "Go's default integer type is named without a width suffix. It's sized to the platform's natural word size — at least 32 bits, typically 64. That's what you reach for unless you have a specific reason."
  - "Pick `var id int = 1_000_000_000`."
notes: |
  Third recognition exercise for Theme 2, this one drilling the
  *consequence* of picking the wrong integer width: silent overflow.
  Three of the five distractors are smaller integer types that
  literally cannot represent a billion; the fourth (uint8 = byte) is
  a common-looking but completely wrong pick for a numeric id.

  The `int = 1_000_000_000` literal-separator syntax also lands here
  — it's a Go 1.13+ feature mirroring TS's `_` separators. Pinned
  inline so the learner sees the readable form.

  Underscores in integer literals work in both TS and Go, which is a
  rare "translates verbatim" win for a numeric theme that's otherwise
  full of friction.
runtime: none
