target: go
themeId: foundations/numeric-primitives
type: fill-line
order: 7
prompt: |
  Type the Go declaration that holds the value `1_000_000_000` safely
  in a variable named `id` using Go's default integer type. The
  program should print `1000000000`.
generator:
  kind: template
  vars:
    line:
      - "var id int = 1_000_000_000"
  ts: |-
    let id: number = 1_000_000_000;
    console.log(id);
  canonical: |-
    package main

    import "fmt"

    func main() {
    	${line}
    	fmt.Println(id)
    }
  distractors:
    - match: "var id int16 = 1_000_000_000"
      explain: |-
        `int16` tops out around 32,767. A billion overflows it by
        five orders of magnitude. Reach for `int` (sized to the
        platform, ≥32 bits in practice) unless you have a specific
        reason to pick a width.
    - match: "var id int8 = 1_000_000_000"
      explain: |-
        `int8` holds -128 to 127. Storing a billion in it is an
        immediate overflow. Use `int` for general-purpose integers
        — fixed widths are for specific encodings, not defaults.
    - match: "var id uint8 = 1_000_000_000"
      explain: |-
        `uint8` is 0 to 255 — one byte. Same overflow problem as
        `int8`, and `uint`-prefixed types are for cases where the
        value can't be negative *by design*. Default to `int`.
    - match: "var id byte = 1_000_000_000"
      explain: |-
        `byte` is an alias for `uint8` — same 0..255 range. The name
        signals intent ("this is raw byte data"), not capacity. `int`
        is the default integer type.
expectStdout: |
  1000000000
runtime: yaegi
blanks: [line]
hints:
  - "Each integer type holds a different range. A signed 8-bit holds about -128 to 127; signed 16-bit goes up to about 32 thousand; signed 32-bit reaches ~2 billion. Pick a type whose range comfortably covers a billion."
  - "Go's default integer type is named without a width suffix. It's sized to the platform's natural word size — at least 32 bits, typically 64. That's what you reach for unless you have a specific reason."
  - "Type `var id int = 1_000_000_000`."
notes: |
  Migrated to input+Yaegi UX. The narrower-type distractors stay in
  the YAML for future targeted feedback: a learner who picks
  `int8` literally cannot hold the value (silent overflow) — Yaegi
  would surface a different stdout, but a per-pattern hint could
  cite the type-range mismatch directly.
