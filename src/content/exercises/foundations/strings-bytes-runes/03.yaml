target: go
themeId: foundations/strings-bytes-runes
type: mcq
order: 3
prompt: |
  Iterating over a string in TypeScript with `for...of` gives you
  one character at a time, regardless of whether each character is
  one byte or several (TS handles UTF-16 internally). Go's `range`
  over a string gives you something different — pick the line that
  matches the TS semantics.
generator:
  kind: variant
  variants:
    - id: range-with-index
      ts: 'for (const c of str) { console.log(c); }'
      canonical: 'for _, c := range str { fmt.Println(c) }'
      distractors:
        - 'for c := range str { fmt.Println(c) }'
        - 'for i := 0; i < len(str); i++ { fmt.Println(str[i]) }'
        - 'for c of str { fmt.Println(c) }'
    - id: range-collect
      ts: 'for (const c of name) { letters.push(c); }'
      canonical: 'for _, c := range name { letters = append(letters, c) }'
      distractors:
        - 'for c := range name { letters = append(letters, c) }'
        - 'for i := 0; i < len(name); i++ { letters = append(letters, name[i]) }'
        - 'for c of name { letters = append(letters, c) }'
hints:
  - "Three things to get right: Go's range syntax produces TWO values for a string (an index AND a value); you want only the value; and the value you get from `for...range str` is a rune, not a byte."
  - "Use `_` to discard the index. The shape is `for _, c := range str { ... }`. Note the comma and the `:=`."
  - "Pick `for _, c := range str { ... }` — the underscore drops the index and `c` is the rune (codepoint), matching TS's character-by-character iteration."
notes: |
  Third Theme 3 exercise. Teaches three things in one canonical
  answer:
   - Range over a string gives (index, rune), not just rune
   - Use `_` to discard the part you don't want
   - The "rune-not-byte" point: TS handles UTF-16 internally, and
     Go's range-over-string decodes UTF-8 runes — both give code-
     points, so this idiom translates 1:1 in *semantics* even though
     the syntax differs significantly

  Distractor shapes:
   - `for c := range str` — c is the *byte index*, not the rune.
     Classic Go beginner trap.
   - `for i := 0; i < len(str); i++ { ... str[i] ... }` — gives
     bytes, not runes. Breaks on any non-ASCII character.
   - `for c of str` — TypeScript syntax leaking in.

  Variant kind because the second example shows the same pattern in
  a "collect into a slice" idiom, which is a more realistic surface
  for the range-over-string in real code.
runtime: none
