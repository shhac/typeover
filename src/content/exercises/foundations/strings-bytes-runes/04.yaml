target: go
themeId: foundations/strings-bytes-runes
type: fill-word
order: 4
prompt: |
  TypeScript calls string methods on the string itself
  (`name.toUpperCase()`). Go inverts this — string operations live
  in the `strings` package and take the string as the first argument.
  Fill in the package and function name.
generator:
  kind: template
  vars:
    name: [name, greeting, message, label, title]
    pkg: [strings]
    fn: [ToUpper]
  ts: |-
    let upper = ${name}.toUpperCase();
  canonical: |-
    upper := ${pkg}.${fn}(${name})
blanks: [pkg, fn]
hints:
  - "Two reflexive shifts. (1) The function lives in a package — not on the string itself. The package is named after what it operates on. (2) Go method-name conventions: MixedCaps, capital-first to export, no `to`/`from` prefixes in the name."
  - "Package is `strings` (lowercase, plural). Function name is one word — the *result* of the operation, with the first letter capitalised. `toUpperCase()` becomes a single Pascal-cased word."
  - "Fills: `strings` and `ToUpper`. Canonical: `strings.ToUpper(name)`."
notes: |
  First Theme 3 fill-word. Introduces the most-pervasive pattern
  shift in Go's string handling: TS method-on-string vs Go
  function-in-package. Sets up the Go-naming reflex (`ToUpper`,
  not `toUpperCase` or `to_upper`).

  Var pool for `name` provides realistic variable names; `pkg` and
  `fn` are single-pool literal blanks (the same idiom as Theme 2's
  `kw: [var]` / `cast: [float64]`). Still on the task #38 watchlist
  for a proper `literals:` schema field — now 9 fill-word exercises
  use this pattern across three themes.
runtime: none
