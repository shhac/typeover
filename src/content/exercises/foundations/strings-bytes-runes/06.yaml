target: go
themeId: foundations/strings-bytes-runes
type: fill-line
order: 6
prompt: |
  TypeScript's `startsWith` is a method; Go's equivalent is a function
  in the `strings` package. Type the idiomatic Go line that sets
  `prefix` to whether `name` starts with `"Mr"`. The program should
  print `true`.
generator:
  kind: template
  vars:
    line:
      - 'prefix := strings.HasPrefix(name, "Mr")'
  ts: |-
    let prefix = name.startsWith("Mr");
    console.log(prefix);
  canonical: |-
    package main

    import (
    	"fmt"
    	"strings"
    )

    func main() {
    	name := "Mr Smith"
    	${line}
    	fmt.Println(prefix)
    }
  distractors:
    - match: 'prefix := name.StartsWith("Mr")'
      explain: |-
        Go strings don't have methods like TS's `String.prototype`.
        String operations live in the `strings` package as plain
        functions — pass the string in as the first argument.
    - match: 'prefix := name.HasPrefix("Mr")'
      explain: |-
        Right name, wrong shape — `HasPrefix` is a package function,
        not a string method. The call is `strings.HasPrefix(name,
        "Mr")`.
    - match: 'prefix := strings.StartsWith(name, "Mr")'
      explain: |-
        Right package, wrong name. Go calls this `HasPrefix` (named
        for what it returns: does this string HAS the given PREFIX?).
        The TS verb `startsWith` becomes the Go predicate `HasPrefix`.
    - match: 'prefix := startsWith(name, "Mr")'
      explain: |-
        That looks like an unqualified function call. Go doesn't have
        a top-level `startsWith` — string utilities live in the
        `strings` package, so the call needs `strings.` in front and
        `HasPrefix` as the name.
expectStdout: |
  true
runtime: yaegi
blanks: [line]
hints:
  - "Three things must be right at once: package qualifier (`strings.X`), Go's name for this operation (it's not `StartsWith`), and the argument order (string first, prefix second)."
  - "Go names the operation by what it returns — `HasPrefix` returns whether the string has the given prefix. The TS verb `startsWith` becomes the Go predicate `HasPrefix`."
  - 'Type `prefix := strings.HasPrefix(name, "Mr")`.'
notes: |
  Migrated to input+Yaegi UX. Distractors kept as wrong-pattern bank.
