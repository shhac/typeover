target: go
themeId: foundations/strings-bytes-runes
type: fill-line
order: 7
prompt: |
  TypeScript joins arrays with `array.join(separator)`. Go's
  equivalent is in the `strings` package with the arg order swapped.
  Type the line that builds `path` from `parts` joined by `"/"`. The
  program should print `home/user/docs`.
generator:
  kind: template
  vars:
    line:
      - 'path := strings.Join(parts, "/")'
  ts: |-
    let path = parts.join("/");
    console.log(path);
  canonical: |-
    package main

    import (
    	"fmt"
    	"strings"
    )

    func main() {
    	parts := []string{"home", "user", "docs"}
    	${line}
    	fmt.Println(path)
    }
  distractors:
    - match: 'path := parts.join("/")'
      explain: |-
        Slices don't have methods in Go — there's no
        `Array.prototype.join` equivalent on the value itself. The
        operation lives in the `strings` package as a function.
    - match: 'path := parts.Join("/")'
      explain: |-
        Same problem with capitalisation flipped — slices still
        don't have methods. Call `strings.Join(parts, "/")` instead.
    - match: 'path := strings.Join("/", parts)'
      explain: |-
        Right function, args swapped. The Go signature is
        `Join(elems []string, sep string)` — slice first, separator
        second. Opposite of TS's `parts.join("/")` where the slice
        is the receiver.
    - match: 'path := strings.JoinWith(parts, "/")'
      explain: |-
        `JoinWith` doesn't exist. Go names are usually concise — the
        function is just `Join`. Look up the `strings` package for
        the actual API.
expectStdout: |
  home/user/docs
runtime: yaegi
blanks: [line]
hints:
  - 'The Go shape is `strings.Join(slice, separator)`. Slice first, separator second — opposite of the TS method form where the slice is the receiver.'
  - 'Order matters: `strings.Join(parts, "/")` builds the path; `strings.Join("/", parts)` doesn''t typecheck.'
  - 'Type `path := strings.Join(parts, "/")`.'
notes: |
  Migrated to input+Yaegi UX. Distractors kept as wrong-pattern bank.
