target: go
themeId: foundations/variables
type: fill-line
order: 8
prompt: |
  Exercise 4 introduced the multi-declaration shape as a multiple
  choice. Now produce it: type the idiomatic Go line that declares
  both `a` and `b` in one statement so the program prints `1 2`.
generator:
  kind: template
  vars:
    line:
      - "a, b := 1, 2"
  ts: |-
    let a = 1, b = 2;
    console.log(a, b);
  canonical: |-
    package main

    import "fmt"

    func main() {
    	${line}
    	fmt.Println(a, b)
    }
  distractors:
    - match: "a := 1, b := 2"
      explain: |-
        Two `:=` in one statement isn't a Go thing. The short
        declaration takes a tuple on each side — names on the left,
        values on the right, one `:=` in the middle.
    - match: "var a, b = 1, 2"
      explain: |-
        That compiles, but inside a function `:=` is the idiomatic
        shape. Reach for `var` at package scope or when you want to
        declare without initialising.
    - match: "a, b = 1, 2"
      explain: |-
        That's a re-assignment, not a declaration. `a` and `b` don't
        exist yet. Use `:=` to declare and assign in one step.
    - match: "let a, b = 1, 2"
      explain: |-
        `let` is TypeScript. Go uses `:=` inside functions; the
        tuple-on-each-side shape from your `a, b := 1, 2` intuition is
        right, just swap the keyword.
expectStdout: |
  1 2
runtime: yaegi
blanks: [line]
hints:
  - "Go has a single-statement short declaration that takes a tuple on each side — `name1, name2 := expr1, expr2`."
  - "Comma between names, comma between values, one `:=` in the middle. This same shape comes back when you unpack multiple return values later."
  - "Type `a, b := 1, 2`."
notes: |
  Second fill-line under the input+Yaegi UX. The distractors stay in
  the YAML — repurposable as a known-wrong-pattern bank for targeted
  feedback in a later iteration.
