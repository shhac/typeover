target: go
themeId: foundations/variables
type: fill-line
order: 6
prompt: |
  The TS program on the left declares two variables and prints
  `doubled`. The Go translation has its second line missing — type
  the idiomatic Go that, plugged in, makes the program print `10`.
generator:
  kind: template
  vars:
    line:
      - "doubled := count * 2"
  ts: |-
    let count = 5;
    let doubled = count * 2;
    console.log(doubled);
  canonical: |-
    package main

    import "fmt"

    func main() {
    	count := 5
    	${line}
    	fmt.Println(doubled)
    }
  distractors:
    - "var doubled = count * 2"
    - "doubled = count * 2"
    - "const doubled := count * 2"
    - "let doubled = count * 2"
expectStdout: |
  10
runtime: yaegi
blanks: [line]
hints:
  - "Inside a function, Go's idiomatic way to declare AND initialise a variable in one step is the short-declaration operator. Not `var`, not bare `=`, and definitely not `let` or `const` — that's TS."
  - "The operator is `:=`. It both declares the variable and assigns the right-hand side."
  - "Type `doubled := count * 2`."
notes: |
  First fill-line under the redesigned input+Yaegi UX. The learner
  types the line; we substitute into the canonical scaffold and run.
  Expected stdout `10` is the round-trip from count=5 doubled.

  The distractors stay in the YAML — for the legacy tile-picker they
  were the wrong tiles; under the new UX they're a "known wrong-
  pattern bank" that future iterations can use to surface targeted
  feedback (e.g. "your line matches a common assignment-not-
  declaration mistake; here's why it's not idiomatic").
