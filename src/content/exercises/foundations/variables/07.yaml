target: go
themeId: foundations/variables
type: fill-line
order: 7
prompt: |
  TS uses comma-separated declarations to introduce several variables
  in one statement. Go has its own shape — type the idiomatic Go line
  that declares both `a` and `b` in one go so the program prints
  `1 2`.
generator:
  kind: template
  vars:
    line:
      - "a, b := 1, 2"
  ts: |-
    let a = 1, b = 2;
    console.log(a, b);
  canonical: |-
    package main

    import "fmt"

    func main() {
    	${line}
    	fmt.Println(a, b)
    }
  distractors:
    - "a := 1, b := 2"
    - "var a, b = 1, 2"
    - "a, b = 1, 2"
    - "let a, b = 1, 2"
expectStdout: |
  1 2
runtime: yaegi
blanks: [line]
hints:
  - "Go has a single-statement short declaration that takes a tuple on each side — `name1, name2 := expr1, expr2`."
  - "Comma between names, comma between values, one `:=` in the middle. This same shape comes back when you unpack multiple return values later."
  - "Type `a, b := 1, 2`."
notes: |
  Second fill-line under the input+Yaegi UX. The distractors stay in
  the YAML — repurposable as a known-wrong-pattern bank for targeted
  feedback in a later iteration.
