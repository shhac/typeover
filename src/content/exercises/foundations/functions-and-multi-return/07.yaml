target: go
themeId: foundations/functions-and-multi-return
type: fill-line
order: 7
prompt: |
  Type the Go line that performs the `if err != nil` error check
  after a call returns `(n, err)`. On error it should call
  `handleError(err)` and return. The program forces an error and
  prints `caught: oops`.
generator:
  kind: template
  vars:
    line:
      - 'if err != nil { handleError(err); return }'
  ts: |-
    const result = parse(s);
    if (result.err) { handleError(result.err); return; }
    process(result.value);
  canonical: |-
    package main

    import (
    	"errors"
    	"fmt"
    )

    func parse(s string) (int, error) {
    	return 0, errors.New("oops")
    }

    func handleError(e error) {
    	fmt.Println("caught:", e)
    }

    func process(n int) {
    	fmt.Println("got", n)
    }

    func main() {
    	n, err := parse("")
    	${line}
    	process(n)
    }
  distractors:
    - 'if (err) { handleError(err); return }'
    - 'if err { handleError(err); return }'
    - 'if err === null { handleError(err); return }'
    - 'if err == null { handleError(err); return }'
expectStdout: |
  caught: oops
runtime: yaegi
blanks: [line]
hints:
  - "Four reflexes at once: no parens around the condition (Theme 4), `nil` not `null` (Theme 3), explicit `!= nil` comparison (Go has no truthy-tests on errors), and braces required around the body (Theme 4)."
  - 'Go''s idiom: `if err != nil { ... }`. Plain `if err { ... }` doesn''t compile because `error` isn''t a bool.'
  - 'Type `if err != nil { handleError(err); return }`.'
notes: |
  Migrated to input+Yaegi UX. Scaffold's parse always errors, so
  the right line short-circuits before process. Distractors kept.
