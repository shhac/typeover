target: go
themeId: foundations/functions-and-multi-return
type: mcq
order: 3
prompt: |
  TypeScript expresses "this can fail" by returning a union with
  null/undefined, throwing, or returning a Result-like object. Go
  has a strong convention: return a `(value, error)` tuple where
  the caller checks the error against `nil`. Pick the idiomatic Go
  signature.
generator:
  kind: variant
  variants:
    - id: parse-int
      ts: |
        function parseInt(s: string): { value: number; err: Error | null } { ... }
      canonical: 'func parseInt(s string) (int, error) { ... }'
      distractors:
        - 'func parseInt(s string) int | error { ... }'
        - 'func parseInt(s string) Result<int> { ... }'
        - 'func parseInt(s string) { value int; err error } { ... }'
    - id: open-file
      ts: |
        function openFile(path: string): { handle: File; err: Error | null } { ... }
      canonical: 'func openFile(path string) (*File, error) { ... }'
      distractors:
        - 'func openFile(path string) *File | error { ... }'
        - 'func openFile(path string) Result<*File> { ... }'
        - 'func openFile(path string) (file *File, err error) Result { ... }'
    - id: lookup-user
      ts: |
        function lookup(id: number): { user: User | null; err: Error | null } { ... }
      canonical: 'func lookup(id int) (*User, error) { ... }'
      distractors:
        - 'func lookup(id int) *User | error { ... }'
        - 'func lookup(id int) Maybe<*User> { ... }'
        - 'func lookup(id int) (user *User, err error) | null { ... }'
hints:
  - "Go has no union types, no `Result<T>`, no `Maybe<T>`. The idiom is the second-position-tuple: the last return value is the error, and callers check it explicitly with `if err != nil`. The first value is whatever the function actually produces (use the zero value if there's an error)."
  - "Go's pre-declared error type is the lowercase `error` (not capital). It's an interface — any type with an `Error() string` method satisfies it."
  - "Pick the form `func name(args) (T, error) { ... }`. Parens around the tuple, comma between value type and `error`, lowercase `error`."
notes: |
  Third Theme 6 exercise — the `(T, error)` return idiom, the
  single most pervasive shape in real Go code. Establishes the
  pattern that everything-Module-5+ will build on (`errors.Is`,
  `errors.As`, error wrapping, etc.).

  Three variants cover three realistic flavours:
   - Parse — returns the parsed value or an error
   - Open file — returns a pointer to a resource or an error
     (introduces `*File` and the pointer-return convention)
   - Lookup — returns a pointer to a record or an error
     (foreshadows the "nil-pointer-is-the-zero-value" pattern)

  Distractors uniformly mis-spell the error-return shape using
  patterns from other languages:
   - `T | error` — TS / Rust 2024 union
   - `Result<T>` — Rust / functional language
   - `Maybe<T>` — Haskell / Elm
   - `(value T, err error) Result` — mashup that picks the wrong
     keyword combination

  All distractors compile-fail in actual Go but read as "looks
  plausible if you came from another language" — which is exactly
  the audience.

  Variant kind to keep each example's body shape coherent.
runtime: none
