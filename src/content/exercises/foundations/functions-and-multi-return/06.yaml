target: go
themeId: foundations/functions-and-multi-return
type: fill-word
order: 6
prompt: |
  Slot 3 covered the `(T, error)` return-tuple convention by
  recognition. Now produce it: fill in the value type and the error
  type that complete the tuple.
generator:
  kind: template
  vars:
    name: [parse, lookup, fetch, decode, validate]
    arg: [s, id, url, data, value]
    arg_type: [string]
    value_type: [int]
    err_type: [error]
  ts: |-
    function ${name}(${arg}): { value: number; err: Error | null } { ... }
  canonical: |-
    func ${name}(${arg} ${arg_type}) (${value_type}, ${err_type}) { ... }
blanks: [value_type, err_type]
hints:
  - "Two blanks inside the return tuple. The first is the type of the value the function produces on success — for a numeric parse, the same default integer type Theme 2 covered. The second is Go's pre-declared error interface, written in lowercase."
  - "Value type: `int`. Error type: `error` (lowercase — it's Go's built-in error interface, not a class name)."
  - "Canonical: `func parse(s string) (int, error) { ... }`."
notes: |
  Second Theme 6 fill-word. Drills the `(T, error)` return-tuple
  shape that slot 3 introduced as MCQ. Two blanks: the *value*
  type and the *error* type.

  Important subtlety: Go's pre-declared `error` is **lowercase**.
  Capital `Error` would be a user-defined type or a TS-leak. The
  hint walks the learner there explicitly because this is the kind
  of small reflex that bites silently — a learner who types
  `Error` would get a compile error pointing at an undefined
  identifier.

  Pattern uses single-element literal pools for `arg_type`,
  `value_type`, `err_type` — same idiom as previous themes,
  parked against task #38.
runtime: none
