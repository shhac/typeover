target: go
themeId: foundations/loops
type: mcq
order: 1
prompt: |
  TypeScript's classic counted loop has three parts in parentheses
  separated by semicolons. Go's `for` keeps the three parts but
  drops the parens. Pick the idiomatic Go translation.
generator:
  kind: variant
  variants:
    - id: count-to-n
      ts: 'for (let i = 0; i < n; i++) { process(i); }'
      canonical: 'for i := 0; i < n; i++ { process(i) }'
      distractors:
        - 'for (i := 0; i < n; i++) { process(i) }'
        - 'for (let i = 0; i < n; i++) { process(i) }'
        - 'for i in 0..n { process(i) }'
    - id: items-loop
      ts: 'for (let i = 0; i < items.length; i++) { print(items[i]); }'
      canonical: 'for i := 0; i < len(items); i++ { print(items[i]) }'
      distractors:
        - 'for (i := 0; i < len(items); i++) { print(items[i]) }'
        - 'for i := 0; i < items.length; i++ { print(items[i]) }'
        - 'for i, item in items { print(item) }'
    - id: countdown
      ts: 'for (let i = 10; i > 0; i--) { tick(i); }'
      canonical: 'for i := 10; i > 0; i-- { tick(i) }'
      distractors:
        - 'for (i := 10; i > 0; i--) { tick(i) }'
        - 'for i = 10; i > 0; i-- { tick(i) }'
        - 'for i := 10; i > 0; i-=1 { tick(i) }'
hints:
  - "Three shifts from TS: no parens around the for-clause (the three parts stand alone separated by semicolons), use `:=` to introduce the counter (not `let` and not `=`), and length is `len(slice)` not `slice.length`."
  - "The shape is `for INIT; COND; POST { body }`. INIT uses `:=` to declare-and-assign the counter. The body is in braces, always."
  - "For a count-up loop, the canonical is `for i := 0; i < n; i++ { ... }`."
notes: |
  First Theme 5 exercise. Establishes Go's classic three-clause
  for-loop and the three reflexive TS-to-Go shifts:
   - No parens around the for-clause (legal but unidiomatic; same
     trap as conditionals)
   - `:=` for the counter declaration (not `let`, not bare `=`)
   - `len(slice)` instead of `slice.length`

  Variants cover three real shapes:
   - Counting up to n (the textbook case)
   - Iterating a collection by index (the `len(items)` reflex)
   - Counting down (verifies the learner understands the post-
     clause is just `i--`, not the more specialised `i-=1`)

  Distractor patterns repeat the cross-language traps now familiar
  from earlier themes: TS leakage (`let i = 0`, `items.length`),
  paren'd condition, Python `for...in` syntax, and small Go
  near-misses (`=` instead of `:=`; `i-=1` instead of `i--`).

  Variant kind to keep the per-example bodies semantically
  coherent.
runtime: none
