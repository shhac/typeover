target: go
themeId: foundations/loops
type: fill-line
order: 6
prompt: |
  Type the Go line inside the loop that exits early when `i` reaches
  `stopAt`. The program processes 0..n-1 and prints each value via
  `process(i)`. With `n=5` and `stopAt=3` it should print `0`, `1`,
  `2` on separate lines.
generator:
  kind: template
  vars:
    line:
      - "if i == stopAt { break }"
  ts: |-
    for (let i = 0; i < n; i++) {
      if (i === stopAt) break;
      process(i);
    }
  canonical: |-
    package main

    import "fmt"

    func process(i int) {
    	fmt.Println(i)
    }

    func main() {
    	n := 5
    	stopAt := 3
    	for i := 0; i < n; i++ {
    		${line}
    		process(i)
    	}
    }
  distractors:
    - "if (i == stopAt) { break }"
    - "if i === stopAt { break }"
    - "if i == stopAt: break"
    - "break if i == stopAt"
expectStdout: |
  0
  1
  2
runtime: yaegi
blanks: [line]
hints:
  - "Three things all need to be right at once: no parens around the condition (Theme 4 covered this), `==` not `===` for equality (also Theme 4), and braces required around the `break` body even though it's a single statement."
  - "The Go shape is `if condition { body }`. Bare keyword `break` stays the same as TS. Braces always."
  - "Type `if i == stopAt { break }`."
notes: |
  Migrated to input+Yaegi UX. Scaffold provides `process` that prints
  each value. Distractors kept as wrong-pattern bank.
