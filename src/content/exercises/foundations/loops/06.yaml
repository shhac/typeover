target: go
themeId: foundations/loops
type: fill-line
order: 6
prompt: |
  TypeScript exits a loop early with a bare `break` after a
  condition. Go's break works the same way, but the surrounding if
  shape changes. Pick the Go line that breaks when the counter
  reaches a stop value.
generator:
  kind: template
  vars:
    line:
      - "if i == stopAt { break }"
      - "if (i == stopAt) { break }"
      - "if i === stopAt { break }"
      - "if i == stopAt: break"
      - "break if i == stopAt"
  ts: |-
    for (let i = 0; i < n; i++) {
      if (i === stopAt) break;
      process(i);
    }
  canonical: |-
    for i := 0; i < n; i++ {
        ${line}
        process(i)
    }
blanks: [line]
hints:
  - "Three things all need to be right at once: no parens around the condition (Theme 4 covered this), `==` not `===` for equality (also Theme 4), and braces required around the `break` body even though it's a single statement (yes, single-statement bodies still need braces in Go)."
  - "The Go shape is `if condition { body }`. Bare keyword `break` stays the same as TS. Braces always."
  - "Pick `if i == stopAt { break }`."
notes: |
  First Theme 5 fill-line. Recycles Theme 4's if-syntax lessons
  in the context of a loop body. Distractor failure modes:
   - Parens around condition (Theme 4's "legal but unidiomatic")
   - `===` strict equality (Theme 1/4 leak)
   - Python-style `if cond: body` (compact but not Go)
   - Ruby-style `break if cond` (postfix conditional)

  All four distractors leak from another language; the canonical
  drops to the same three reflexes the learner internalised in
  Theme 4 (no parens, `==`, braces).
runtime: none
