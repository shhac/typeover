target: go
themeId: foundations/loops
type: fill-line
order: 7
prompt: |
  Type the Go line inside the loop that skips `nil` entries. The
  program iterates over `items` and prints each non-nil string. With
  `items := []*string{&a, nil, &c}` (where `a = "a"`, `c = "c"`),
  the program should print `a` and `c` on separate lines.
generator:
  kind: template
  vars:
    line:
      - "if items[i] == nil { continue }"
  ts: |-
    for (let i = 0; i < items.length; i++) {
      if (items[i] === null) continue;
      process(items[i]);
    }
  canonical: |-
    package main

    import "fmt"

    func process(s *string) {
    	fmt.Println(*s)
    }

    func main() {
    	a, c := "a", "c"
    	items := []*string{&a, nil, &c}
    	for i := 0; i < len(items); i++ {
    		${line}
    		process(items[i])
    	}
    }
  distractors:
    - "if (items[i] == nil) continue"
    - "if items[i] === nil { continue }"
    - "if items[i] == null { continue }"
    - "continue if items[i] == nil"
expectStdout: |
  a
  c
runtime: yaegi
blanks: [line]
hints:
  - "Four things have to be right: no parens around the condition, braces around the continue body, `==` (not `===`) for equality, and Go's keyword for absence — which is *not* `null`."
  - "Go's empty-marker is `nil`. The shape is `if items[i] == nil { continue }`."
  - "Type `if items[i] == nil { continue }`."
notes: |
  Migrated to input+Yaegi UX. Scaffold provides `process` printing
  the dereferenced string; the slice mixes pointers and nil to
  exercise the continue. Distractors kept as wrong-pattern bank.
