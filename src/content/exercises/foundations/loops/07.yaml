target: go
themeId: foundations/loops
type: fill-line
order: 7
prompt: |
  Type the Go line inside the loop that skips `nil` entries. The
  program iterates over `items` and prints each non-nil string. With
  `items := []*string{&a, nil, &c}` (where `a = "a"`, `c = "c"`),
  the program should print `a` and `c` on separate lines.
generator:
  kind: template
  vars:
    line:
      - "if items[i] == nil { continue }"
  ts: |-
    for (let i = 0; i < items.length; i++) {
      if (items[i] === null) continue;
      process(items[i]);
    }
  canonical: |-
    package main

    import "fmt"

    func process(s *string) {
    	fmt.Println(*s)
    }

    func main() {
    	a, c := "a", "c"
    	items := []*string{&a, nil, &c}
    	for i := 0; i < len(items); i++ {
    		${line}
    		process(items[i])
    	}
    }
  distractors:
    - match: "if (items[i] == nil) continue"
      explain: |-
        Two TS habits at once: Go doesn't take parens around the
        condition of an `if`, and the body needs braces — even a
        single `continue`. The shape is `if cond { body }`.
    - match: "if items[i] === nil { continue }"
      explain: |-
        Triple-equals is a JavaScript / TypeScript thing. Go uses
        `==` for equality; the types either match or it won't
        compile.
    - match: "if items[i] == null { continue }"
      explain: |-
        Close — right shape, wrong empty-marker. Go's "no value"
        keyword is `nil`, not `null`. `nil` is what pointers,
        interfaces, maps, slices, and channels compare against.
    - match: "continue if items[i] == nil"
      explain: |-
        Ruby's trailing-conditional. Go isn't Ruby — `if` always
        leads, body always in braces.
expectStdout: |
  a
  c
runtime: yaegi
blanks: [line]
hints:
  - "Four things have to be right: no parens around the condition, braces around the continue body, `==` (not `===`) for equality, and Go's keyword for absence — which is *not* `null`."
  - "Go's empty-marker is `nil`. The shape is `if items[i] == nil { continue }`."
  - "Type `if items[i] == nil { continue }`."
notes: |
  Migrated to input+Yaegi UX. Scaffold provides `process` printing
  the dereferenced string; the slice mixes pointers and nil to
  exercise the continue. Distractors kept as wrong-pattern bank.
