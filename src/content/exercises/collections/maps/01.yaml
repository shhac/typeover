target: go
themeId: collections/maps
type: mcq
order: 1
prompt: |
  Declare an empty Go map you can write keys into immediately. Maps
  need to be MADE before write — same family as slices.
generator:
  kind: template
  vars:
    name: [counts, scores, ages, prices, cache]
    k: [string, string, string, string, string]
    v: [int, int, int, int, int]
  ts: |-
    const ${name}: Record<${k}, ${v}> = {};
  canonical: |-
    ${name} := make(map[${k}]${v})
  distractors:
    - "${name} := map[${k}]${v}"
    - "${name} := {}"
    - "${name} := new(map[${k}]${v})"
hints:
  - "Maps in Go are reference types — and like slices, they need a `make` call before you can write into them. Without one, you have a nil map, and writing to it panics."
  - "The shape mirrors slice construction: `make(map[K]V)`. No size argument needed for the simple form."
  - "`${name} := make(map[${k}]${v})`"
runtime: none
notes: |
  Distractors:
    1. `name := map[K]V` — a TYPE, not a value. The trailing `{}`
       is what turns it into a literal value. Without it, this
       won't compile.
    2. `name := {}` — TS-object-literal habit. Go can't infer the
       map type from `{}` alone; there's no implicit `Record`.
    3. `new(map[K]V)` — returns a `*map[K]V` (pointer to a nil
       map header). Calling `m[k] = v` on that would dereference
       a pointer to a nil map and panic. `new` is for getting a
       zero-pointer; `make` is for constructing a usable map /
       slice / channel.

  Theme 2.2 opener — central reality: maps need `make` before write.
