target: go
themeId: collections/arrays-and-slices
type: fill-line
order: 8
prompt: |
  In TypeScript, passing an array to a function shares it — the
  callee mutates the caller's array. Write the Go function signature
  that does the same: `zero` takes a slice and zeros its first
  element. The program calls it from `main` and prints the result.

  Expected: `[0 2 3]` — the original was `[1, 2, 3]`, and the
  mutation through the parameter is visible to `main`.
generator:
  kind: template
  vars:
    sig:
      - "xs []int"
  ts: |-
    function zero(xs: number[]): void {
      xs[0] = 0;
    }
    const a = [1, 2, 3];
    zero(a);
    console.log(a);    // [0, 2, 3]
  canonical: |-
    package main

    import "fmt"

    func zero(${sig}) {
    	xs[0] = 0
    }

    func main() {
    	a := []int{1, 2, 3}
    	zero(a)
    	fmt.Println(a)
    }
  distractors:
    - match: "xs [3]int"
      explain: |-
        That's an ARRAY parameter — fixed length 3. Arrays in Go
        pass by VALUE (the whole array copies), so `xs[0] = 0`
        mutates the copy and `main`'s `a` stays `[1 2 3]`. Also
        you'd need to declare `a` as `[3]int` to even call this.
    - match: "xs *[]int"
      explain: |-
        Over-engineered. A slice is already a (pointer, len, cap)
        header — passing it by value shares the backing array.
        You don't need an explicit pointer-to-slice unless the
        callee needs to *reassign* the header itself.
    - match: "xs ...int"
      explain: |-
        Variadic — accepts any number of `int` arguments. The call
        site would be `zero(a...)`, and `xs` inside would still be
        `[]int`, so it'd technically work — but it's the wrong
        contract here. Plain `xs []int` is the idiomatic signature.
    - match: "xs []number"
      explain: |-
        TS leak — `number` is the TS type. Go calls it `int` (or
        `int32`, `int64`, etc. — `int` is the platform-sized
        default).
expectStdout: |
  [0 2 3]
runtime: yaegi
blanks: [sig]
hints:
  - "A slice in Go is a small header (pointer, length, capacity) passed by value — but the *backing array* it points at is shared. Mutating through `xs[i]` reaches the caller's data."
  - "The signature is the variable name, then the slice type."
  - "`xs []int`."
notes: |
  The pass-by-value asymmetry between arrays and slices is one of
  the load-bearing Go-vs-TS divergences. TS devs *expect* shared
  mutation (their reflex is "objects share, primitives copy"); Go
  punishes that reflex on arrays.

  Variadic distractor (`xs ...int`) is a deliberate trap — it's
  technically a legal signature but changes the call shape. The
  explain calls out the contract mismatch.
