target: go
themeId: collections/iteration
type: mcq
order: 2
prompt: |
  Translate `for (const n of nums)` (value-only, no index) to Go.
  The trap: there's no `for v := range slice` form — that gives you
  the INDEX, not the value. You have to skip the index explicitly
  with the blank identifier `_`.
generator:
  kind: variant
  variants:
    - id: nums
      ts: |-
        for (const n of nums) {
          console.log(n);
        }
      canonical: "for _, n := range nums { fmt.Println(n) }"
      distractors:
        - "for n := range nums { fmt.Println(n) }"
        - "for n of nums { fmt.Println(n) }"
        - "for nums.forEach(n) { fmt.Println(n) }"
    - id: words
      ts: |-
        for (const w of words) {
          console.log(w);
        }
      canonical: "for _, w := range words { fmt.Println(w) }"
      distractors:
        - "for w := range words { fmt.Println(w) }"
        - "for w of words { fmt.Println(w) }"
        - "for words.forEach(w) { fmt.Println(w) }"
    - id: scores
      ts: |-
        for (const s of scores) {
          console.log(s);
        }
      canonical: "for _, s := range scores { fmt.Println(s) }"
      distractors:
        - "for s := range scores { fmt.Println(s) }"
        - "for s of scores { fmt.Println(s) }"
        - "for scores.forEach(s) { fmt.Println(s) }"
hints:
  - "Go's range over a slice has no value-only form. If you write `for n := range nums`, `n` is the INDEX (0, 1, 2, ...) — NOT the value. Wrong, silently."
  - "Use the blank identifier `_` to throw away the index: `for _, n := range nums`."
  - "`for _, n := range nums`."
runtime: none
notes: |
  THE most painful trap in iteration. A TS dev who writes
  `for n := range nums` expects the value (because TS `for-of`
  gives the value, and the one-arg form "feels like" `for-of`).
  Go gives them the INDEX. The compiler is silent. The bug ships.

  Distractors:
    1. `for n := range nums` — the trap itself. Compiles fine,
       silently wrong.
    2. `for n of nums` — TS keyword leak.
    3. `nums.forEach(...)` — method-syntax leak.

  The blank-`_` idiom is load-bearing here and also reappears for
  multi-return functions (error-discarding), so the pattern carries
  forward.
