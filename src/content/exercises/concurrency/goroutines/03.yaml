target: go
themeId: concurrency/goroutines
type: mcq
order: 3
prompt: |
  A goroutine you launch in `main()` runs concurrently with
  `main()`. What happens to in-flight goroutines when `main()`
  returns?
generator:
  kind: variant
  variants:
    - id: main-exit-kills
      ts: |-
        // TS/Node: process.exit() also kills in-flight Promises +
        // workers. Same shape but the underlying scheduler is
        // different.
      canonical: "The entire process exits immediately; any goroutines still running are terminated without finishing. `main`'s return is the program's terminator."
      distractors:
        - "The process waits for all goroutines to complete, then exits — same shape as `await Promise.all(...)`."
        - "Goroutines continue running in the background as daemon threads until they finish, then the OS reclaims them."
        - "The runtime panics with `goroutines still running` and prints stack traces for each."
hints:
  - "Think about what `main()` IS in a Go program — the entry point. What does its return mean for the whole process?"
  - "main returning = process ending. Goroutines don't get to finish — they're terminated."
  - "Process exits; goroutines die mid-flight."
runtime: none
notes: |
  Single most important goroutine lifecycle beat. The "bare
  goroutine" anti-pattern: launching `go fn()` from main()
  and immediately returning loses the goroutine's work. This
  is why coordination primitives (`sync.WaitGroup`, channels
  used as completion signals) exist.

  Distractors:
    1. "Waits for all goroutines" — that's Node's default
       behaviour (process exits when nothing's pending);
       Go's main is more abrupt.
    2. "Daemon threads" — Java/JVM model; Go has no
       daemon/non-daemon distinction.
    3. "Panic on still-running goroutines" — invented;
       Go's exit is silent + abrupt.

  Slot 7's fill-line drills the WaitGroup remedy; slot 9's
  capstone uses a done-channel as an alternative.
