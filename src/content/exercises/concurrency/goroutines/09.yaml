target: go
themeId: concurrency/goroutines
type: freeform
order: 9
prompt: |
  Theme 6.1 capstone — fan-out three goroutines with
  `sync.WaitGroup`. The pattern: `wg.Add(N)` BEFORE launching,
  `defer wg.Done()` at the top of each goroutine,
  `wg.Wait()` in main.

  1. Declare `var wg sync.WaitGroup`.
  2. Call `wg.Add(3)` (three workers to wait for).
  3. Three times — for `i := 1; i <= 3; i++` — launch a
     goroutine that:
     - `defer wg.Done()`
     - Prints `"worker"` (just the word — don't try to
       interpolate the loop variable; ordering between
       goroutines is nondeterministic so any interpolation
       would break the expected output match).
  4. After the loop, call `wg.Wait()`.
  5. After Wait returns, print `"all done"`.

  Expected output:
  ```
  worker
  worker
  worker
  all done
  ```

  Because all goroutines print the same fixed string, the
  output is deterministic — every interleaving produces the
  same lines.
generator:
  kind: template
  vars: {}
  ts: |-
    // TS analog: Promise.all([Promise.resolve("worker"), Promise.resolve("worker"), Promise.resolve("worker")])
    //   .then(rs => { rs.forEach(r => console.log(r)); console.log("all done"); });
  canonical: |-
    package main

    import (
    	"fmt"
    	"sync"
    )

    func main() {
    	var wg sync.WaitGroup
    	wg.Add(3)
    	for i := 1; i <= 3; i++ {
    		go func() {
    			defer wg.Done()
    			fmt.Println("worker")
    		}()
    	}
    	wg.Wait()
    	fmt.Println("all done")
    }
expectStdout: |
  worker
  worker
  worker
  all done
hints:
  - "Three pieces in order: (1) WaitGroup declaration + `Add(3)`, (2) the launching `for` loop with three `go func() { defer wg.Done(); fmt.Println(\"worker\") }()` goroutines, (3) `wg.Wait()` + final `fmt.Println(\"all done\")`."
  - "`Add(3)` BEFORE the loop, not inside — calling `Add` from inside the goroutine races with `Wait`. The stdlib doc requires this ordering."
  - "See canonical."
runtime: yaegi
notes: |
  Theme 6.1 capstone. The fan-out + wait pattern is the
  most common Go concurrency shape after channels themselves.
  Three load-bearing beats:

  1. **Add BEFORE the goroutine launches**, not from inside —
     the stdlib doc explicitly warns about this race.
  2. **`defer wg.Done()` at the top** of each goroutine —
     panic-safe completion signal.
  3. **`wg.Wait()` in main** blocks until counter hits zero.

  Deterministic output trick: every worker prints the same
  fixed string, so any interleaving produces the same lines
  in any order — but since they're all the same string, the
  output also matches in line-by-line equality. Avoids the
  pitfall of trying to test concurrent code with output
  that depends on ordering.

  Curriculum status after this: Module 6 (concurrency) at
  1 of 4 themes done. Themes 6.2 (channels), 6.3 (select),
  6.4 (sync) remain.
