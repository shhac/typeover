target: go
themeId: concurrency/channels
type: mcq
order: 2
prompt: |
  Pick the statement that best describes the difference between
  an UNBUFFERED channel (`make(chan int)`) and a BUFFERED channel
  with capacity 5 (`make(chan int, 5)`).
generator:
  kind: variant
  variants:
    - id: blocking-semantics
      ts: |-
        // TS: RxJS Subject (unbuffered-like) vs ReplaySubject (buffered).
        // Different shape but conceptually parallel.
      canonical: "Unbuffered: send BLOCKS until a corresponding receive completes (synchronisation). Buffered: send doesn't block until the buffer is full (decoupling)."
      distractors:
        - "Unbuffered channels lose messages when no receiver is ready; buffered channels don't."
        - "Buffered channels are an optimisation for unbuffered ones; semantically identical."
        - "Unbuffered channels can only carry zero-size types (`struct{}`); buffered channels can carry any type."
hints:
  - "Both are typed pipes. The difference is what happens on SEND when no receiver is waiting — does it block, or proceed?"
  - "Unbuffered: send blocks until receive completes. Buffered: send proceeds while buffer has space."
  - "Block-on-send for unbuffered; proceed-until-full for buffered."
runtime: none
notes: |
  Foundational mental model for channels. The shorthand is:
  unbuffered channel = rendezvous (send and receive meet);
  buffered channel = pipe with N slots.

  Distractors:
    1. "Unbuffered loses messages" — both channels are
       reliable; messages are never dropped. The difference
       is solely about blocking behaviour.
    2. "Buffered is an optimisation" — semantically very
       different. Unbuffered IS the synchronisation primitive;
       buffered is for throughput-decoupling.
    3. "Unbuffered only struct{}" — invented constraint;
       both work for any type.

  Slot 7 drills the actual send/receive operations; this slot
  is mental-model recognition.
