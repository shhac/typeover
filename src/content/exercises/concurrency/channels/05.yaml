target: go
themeId: concurrency/channels
type: fill-word
order: 5
prompt: |
  Type the builtin that marks a channel as having no more
  sends. After this call, send-on-channel panics, but
  receivers can still drain any buffered values and then
  observe `false` on the comma-ok form.
generator:
  kind: template
  vars:
    word:
      - "close"
  ts: |-
    // TS: stream.end() / Subject.complete()
  canonical: |-
    package main

    import "fmt"

    func main() {
    	ch := make(chan int, 3)
    	ch <- 1
    	ch <- 2
    	ch <- 3
    	${word}(ch)
    	for v := range ch {
    		fmt.Println(v)
    	}
    }
runtime: none
blanks: [word]
hints:
  - "Five letters, lowercase. Same English word as the verb you'd use for shutting down a connection."
  - "`close`."
  - "`close`."
notes: |
  Pin the builtin. The `for v := range ch` form depends on
  `close(ch)` — without it, the range loop would block
  forever waiting for the next send.

  Producer-side convention: defer `close(ch)` right after
  the channel is created so the close is panic-safe.
  Slot 9's capstone uses this pattern.
