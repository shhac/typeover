target: go
themeId: concurrency/select
type: fill-line
order: 6
prompt: |
  Write the `select` block that waits on TWO channels — `c1`
  and `c2`. Print the received value with a `c1:` or `c2:`
  prefix depending on which channel fires.

  Scaffold pre-loads `c1` with `"first"`, so c1's case
  will be ready.

  Expected output: `c1: first`.
generator:
  kind: template
  vars:
    line:
      - |-
        select {
        	case v := <-c1:
        		fmt.Println("c1:", v)
        	case v := <-c2:
        		fmt.Println("c2:", v)
        	}
  ts: |-
    // TS: const v = await Promise.race([p1, p2]);
  canonical: |-
    package main

    import "fmt"

    func main() {
    	c1 := make(chan string, 1)
    	c2 := make(chan string, 1)
    	c1 <- "first"
    	${line}
    }
  distractors:
    - match: |-
        switch {
        	case v := <-c1:
        		fmt.Println("c1:", v)
        	case v := <-c2:
        		fmt.Println("c2:", v)
        	}
      explain: |-
        `switch` doesn't dispatch on channel readiness — it
        evaluates each case as a boolean expression. For
        multi-channel waits the keyword is `select`.
    - match: |-
        select v := <-c1, v := <-c2 {
        	case 1: fmt.Println("c1:", v)
        	case 2: fmt.Println("c2:", v)
        	}
      explain: |-
        select doesn't take a subject expression; each
        channel operation lives INSIDE its own case.
expectStdout: |
  c1: first
runtime: yaegi
blanks: [line]
hints:
  - "Bare `select {` opening, two `case v := <-cN: fmt.Println(...)` branches, closing `}`."
  - "`select { case v := <-c1: fmt.Println(\"c1:\", v); case v := <-c2: fmt.Println(\"c2:\", v) }`."
  - "See canonical."
notes: |
  First runnable select slot. Drills the two-case dispatch
  shape — the canonical "wait on multiple channels" idiom.

  Yaegi probe-confirmed (2026-05-21): select dispatch on
  ready cases works correctly.
