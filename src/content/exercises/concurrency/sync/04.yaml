target: go
themeId: concurrency/sync
type: fill-word
order: 4
prompt: |
  Type the method name on `sync.Mutex` that ACQUIRES the
  lock — paired with `Unlock` to release.
generator:
  kind: template
  vars:
    word:
      - "Lock"
  ts: |-
    // TS: mu.acquire() — Go's verb is shorter.
  canonical: |-
    package main

    import (
    	"fmt"
    	"sync"
    )

    func main() {
    	var mu sync.Mutex
    	count := 0
    	mu.${word}()
    	count++
    	mu.Unlock()
    	fmt.Println(count)
    }
runtime: none
blanks: [word]
hints:
  - "Four letters, capitalised (it's an exported method). Same English verb you'd use for locking a door."
  - "`Lock`."
  - "`Lock`."
notes: |
  Pin the method name. Capitalised because it's exported
  (theme 5.4 capitalisation rule).
