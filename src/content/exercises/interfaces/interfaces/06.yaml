target: go
themeId: interfaces/interfaces
type: fill-line
order: 6
prompt: |
  Implement the `Greeter` interface for the `English` struct
  by writing the METHOD that satisfies it. No declaration of
  intent — just write the method with the matching signature
  and Go infers implicit satisfaction (slot 2).

  The scaffold defines the interface, declares `English`, and
  has `main` calling `g.Greet()` through the interface variable.
  Only the method body line is missing.

  Expected output: `Hello`.
generator:
  kind: template
  vars:
    line:
      - 'func (e English) Greet() string { return "Hello" }'
  ts: |-
    interface Greeter { greet(): string }
    class English implements Greeter {
      greet() { return "Hello"; }
    }
    const g: Greeter = new English();
    console.log(g.greet());
  canonical: |-
    package main

    import "fmt"

    type Greeter interface {
    	Greet() string
    }

    type English struct{}

    ${line}

    func main() {
    	var g Greeter = English{}
    	fmt.Println(g.Greet())
    }
  distractors:
    - match: 'func (e English) greet() string { return "Hello" }'
      explain: |-
        Lowercase `greet` doesn't satisfy `Greeter` — Go method
        names are case-sensitive AND interface satisfaction
        matches names EXACTLY. `Greeter.Greet` needs a method
        named `Greet` (capitalised). Lowercase = unexported,
        AND won't match the interface.
    - match: 'func (e English) Greet() { return "Hello" }'
      explain: |-
        Signature mismatch — `Greeter.Greet` returns `string`,
        this returns nothing. Implicit satisfaction requires
        EXACT signature match (name, params, returns). The
        compiler will reject the assignment `var g Greeter =
        English{}` with "missing method Greet" (it sees a
        different method).
    - match: 'func English.Greet() string { return "Hello" }'
      explain: |-
        Theme 3.2 distractor returns — `Type.method` syntax is
        C#/Java, not Go. Receiver lives in its own parens
        BEFORE the method name: `func (e English) Greet()`.
    - match: 'func Greet(e English) string { return "Hello" }'
      explain: |-
        Free-function form, not a method. Theme 3.2 slot 1's
        distinction returns: methods bind to a type via the
        receiver-in-parens; free functions take the would-be
        receiver as a regular parameter. The latter doesn't
        satisfy any interface.
expectStdout: |
  Hello
runtime: yaegi
blanks: [line]
hints:
  - "Method shape from theme 3.2: `func (<recv> <Type>) <Name>(<params>) <return> { <body> }`. Match the interface's signature EXACTLY — name capitalisation matters."
  - "`func (e English) Greet() string { return \"Hello\" }`."
  - "`func (e English) Greet() string { return \"Hello\" }`."
notes: |
  Productive use of implicit satisfaction (slot 2). The scaffold
  ALREADY does `var g Greeter = English{}` — if the method
  doesn't match the interface, the assignment fails at COMPILE
  time, not runtime. Yaegi catches this correctly (probed in
  this tick).

  Distractor bank covers the four most common mis-shapes:
    1. Lowercase method name — case-sensitivity bite.
    2. Missing return — signature mismatch.
    3. C#/Java type-dot-method syntax — theme 3.2 distractor.
    4. Free-function form — theme 3.2 + 3.1 distractor pair.

  Pairs with slot 7 (type assertion) to demonstrate the round
  trip: implement an interface → store in interface var →
  recover the concrete type via assertion.
