target: go
themeId: interfaces/interfaces
type: mcq
order: 1
prompt: |
  Translate the TypeScript interface `Greeter` to Go. Go's
  interface is a METHOD SET — a list of methods a type must
  have to satisfy it. Unlike TS (where interfaces can describe
  field shapes), Go interfaces are method-only.
generator:
  kind: variant
  variants:
    - id: greeter
      ts: |-
        interface Greeter {
          greet(): string;
        }
      canonical: |-
        type Greeter interface {
        	Greet() string
        }
      distractors:
        - |-
          interface Greeter {
            Greet() string
          }
        - |-
          type Greeter struct {
            Greet() string
          }
        - |-
          type Greeter interface {
            name string
            Greet() string
          }
    - id: stringer
      ts: |-
        interface Stringer {
          toString(): string;
        }
      canonical: |-
        type Stringer interface {
        	String() string
        }
      distractors:
        - |-
          interface Stringer {
            String() string
          }
        - |-
          type Stringer struct {
            String() string
          }
        - |-
          type Stringer interface {
            value any
            String() string
          }
    - id: shape
      ts: |-
        interface Shape {
          area(): number;
        }
      canonical: |-
        type Shape interface {
        	Area() float64
        }
      distractors:
        - |-
          interface Shape {
            Area() float64
          }
        - |-
          type Shape struct {
            Area() float64
          }
        - |-
          type Shape interface {
            kind string
            Area() float64
          }
hints:
  - "Three-keyword stack: `type <Name> interface { <method-signatures> }`. The `interface` keyword is the underlying-type marker, just like `struct` was in theme 3.1 — it goes AFTER `type <Name>`."
  - "Methods are listed with their FULL signature (name + params + return type), no body. Convention: capitalised name (exported), no `func` keyword inside the interface block."
  - "`type Greeter interface { Greet() string }`."
runtime: none
notes: |
  Theme 4.1 opener. Same shape as theme 3.1 slot 1 (struct
  declaration), now with `interface` as the underlying-type
  keyword. The structural parallel (`type Name underlying {
  ... }`) is the load-bearing pattern Go uses for every named
  type — struct, interface, function-type, channel-type, etc.

  Distractors:
    1. `interface Greeter { ... }` — TS keyword-as-prefix style.
       Go's interface needs the `type` wrapper, same as struct.
    2. `type Greeter struct { Greet() string }` — declares a
       struct with a function-typed "field" named Greet. Wrong
       underlying-type keyword (struct vs interface).
    3. `type Greeter interface { name string; ... }` — adding
       a field. Go interfaces are method-only; fields aren't
       allowed.

  Capitalisation note: idiomatic Go capitalises exported
  interface methods (Greet, not greet). Slot 5 fill-word will
  drill this — calling out here so the convention isn't a
  surprise.
