target: go
themeId: interfaces/interfaces
type: freeform
order: 8
prompt: |
  Strategy-pattern freeform. Build:

  1. `type Greeter interface { Greet() string }`
  2. Two concrete types: `English struct{}` and `Spanish
     struct{}`, each with a `Greet() string` method
     returning "Hello" and "Hola" respectively.
  3. A function `func sayAll(gs []Greeter)` that iterates the
     slice and prints each `g.Greet()` on its own line.
  4. In `main`: build `[]Greeter{English{}, Spanish{}}` and
     pass it to `sayAll`.

  Expected output:
  ```
  Hello
  Hola
  ```

  Drills implicit satisfaction (slot 2), interface as a parameter
  type (slot 6), and the polymorphic-dispatch payoff that makes
  interfaces worth the syntax.

  TypeScript reference:
  ```ts
  interface Greeter { greet(): string }
  class English implements Greeter { greet() { return "Hello"; } }
  class Spanish implements Greeter { greet() { return "Hola"; } }
  function sayAll(gs: Greeter[]) {
    for (const g of gs) console.log(g.greet());
  }
  sayAll([new English(), new Spanish()]);
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    interface Greeter { greet(): string }
    class English implements Greeter { greet() { return "Hello"; } }
    class Spanish implements Greeter { greet() { return "Hola"; } }
    function sayAll(gs: Greeter[]) {
      for (const g of gs) console.log(g.greet());
    }
    sayAll([new English(), new Spanish()]);
  canonical: |-
    package main

    import "fmt"

    type Greeter interface {
    	Greet() string
    }

    type English struct{}

    func (e English) Greet() string { return "Hello" }

    type Spanish struct{}

    func (s Spanish) Greet() string { return "Hola" }

    func sayAll(gs []Greeter) {
    	for _, g := range gs {
    		fmt.Println(g.Greet())
    	}
    }

    func main() {
    	sayAll([]Greeter{English{}, Spanish{}})
    }
expectStdout: |
  Hello
  Hola
hints:
  - "Four pieces: interface decl, two struct + method pairs, sayAll taking `[]Greeter`, main constructing the literal slice and calling sayAll. No `implements` anywhere — the methods alone bind the structs to the interface."
  - "`[]Greeter{English{}, Spanish{}}` — composite-literal slice of an interface type, populated with two different concrete types. Go's type system accepts this because each element satisfies Greeter implicitly."
  - "See canonical."
runtime: yaegi
notes: |
  THE polymorphism payoff. Slot 6 implemented one type for one
  interface; this slot implements TWO types for the SAME
  interface and passes them through one function. That's the
  whole reason interfaces exist as a feature.

  No new mechanical beats — every shape here is from earlier
  slots. The novelty is COMPOSITION: combining interface-as-
  param + slice-of-interface-type + multiple implementers.
  Real Go code is shaped exactly like this — interfaces for
  the contract, structs for the data, free functions that
  accept the interface and dispatch polymorphically.
