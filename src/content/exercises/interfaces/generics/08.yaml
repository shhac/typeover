target: go
themeId: interfaces/generics
type: freeform
order: 8
prompt: |
  Build a generic `Stack[T any]` with three methods, all
  pointer-receiver per the consistency rule from theme 3.2.

  1. `type Stack[T any] struct { items []T }`
  2. `(s *Stack[T]) Push(v T)`
  3. `(s *Stack[T]) Pop() T`
  4. `(s *Stack[T]) Peek() T`

  In `main`: instantiate `&Stack[int]{}`, push 10, 20, 30, then
  print Peek(), Pop(), Peek() — one per line.

  Expected output:
  ```
  30
  30
  20
  ```

  Direct generic counterpart to theme 3.2 slot 9 (which built a
  Stack[int] hardcoded). Demonstrates how generics swap out the
  concrete `int` for a type parameter without changing the rest
  of the shape.

  TypeScript reference:
  ```ts
  class Stack<T> {
    items: T[] = [];
    push(v: T) { this.items.push(v); }
    pop(): T { return this.items.pop()!; }
    peek(): T { return this.items[this.items.length - 1]; }
  }
  const s = new Stack<number>();
  s.push(10); s.push(20); s.push(30);
  console.log(s.peek());
  console.log(s.pop());
  console.log(s.peek());
  ```
generator:
  kind: template
  vars: {}
  ts: |-
    class Stack<T> {
      items: T[] = [];
      push(v: T) { this.items.push(v); }
      pop(): T { return this.items.pop()!; }
      peek(): T { return this.items[this.items.length - 1]; }
    }
    const s = new Stack<number>();
    s.push(10); s.push(20); s.push(30);
    console.log(s.peek());
    console.log(s.pop());
    console.log(s.peek());
  canonical: |-
    package main

    import "fmt"

    type Stack[T any] struct {
    	items []T
    }

    func (s *Stack[T]) Push(v T) {
    	s.items = append(s.items, v)
    }

    func (s *Stack[T]) Pop() T {
    	v := s.items[len(s.items)-1]
    	s.items = s.items[:len(s.items)-1]
    	return v
    }

    func (s *Stack[T]) Peek() T {
    	return s.items[len(s.items)-1]
    }

    func main() {
    	s := &Stack[int]{}
    	s.Push(10)
    	s.Push(20)
    	s.Push(30)
    	fmt.Println(s.Peek())
    	fmt.Println(s.Pop())
    	fmt.Println(s.Peek())
    }
expectStdout: |
  30
  30
  20
hints:
  - "Generic struct + generic methods: type parameters declared on the struct (`Stack[T any]`) flow through to the methods via the receiver (`(s *Stack[T])`). Pointer receivers for ALL methods per the theme 3.2 consistency rule."
  - "Instantiate with explicit type arg: `&Stack[int]{}`. After that the methods accept/return T resolved to int."
  - "See canonical."
runtime: yaegi
notes: |
  THE generic-container exercise. Direct parallel to theme 3.2
  slot 9 (hardcoded Stack[int]) — the difference is the `[T any]`
  on the type declaration and the `[T]` propagation through the
  method receivers.

  Why pointer receivers throughout: consistency rule from theme
  3.2. Push mutates; Pop mutates; Peek reads. The mixed-receiver
  alternative works but is non-idiomatic.

  Why `&Stack[int]{}` (pointer literal) at instantiation: methods
  are pointer-receiver, so the variable needs to be a *Stack[int].
  Bare `Stack[int]{}` works for the value-receiver case (Peek
  alone) but breaks for Push/Pop.

  Forward to module 5 (errors): a `Result[T, E error]` type
  generalises (value, error) returns — same shape as Rust's
  Result. Authored at: `errors/the-error-pattern` slot 9 if
  this lesson lands well.
