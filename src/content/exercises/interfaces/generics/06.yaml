target: go
themeId: interfaces/generics
type: fill-line
order: 6
prompt: |
  Write the function SIGNATURE for a generic `Max[T int |
  float64]` that takes two T's and returns the larger.

  The scaffold has the body (`if a > b { return a }; return b`)
  and a `main` that calls `Max(3, 5)` plus `Max(2.1, 1.5)`.
  Only the signature is missing.

  Expected output:
  ```
  5
  2.1
  ```
generator:
  kind: template
  vars:
    line:
      - "func Max[T int | float64](a, b T) T {"
  ts: |-
    function max<T extends number>(a: T, b: T): T {
      return a > b ? a : b;
    }
    console.log(max(3, 5));
    console.log(max(2.1, 1.5));
  canonical: |-
    package main

    import "fmt"

    ${line}
    	if a > b {
    		return a
    	}
    	return b
    }

    func main() {
    	fmt.Println(Max(3, 5))
    	fmt.Println(Max(2.1, 1.5))
    }
  distractors:
    - match: "func Max[T any](a, b T) T {"
      explain: |-
        `any` is too permissive — the body uses `a > b`, which
        only works for ordered types. The compiler rejects
        `T any` with "operator > not defined on T". Constrain to
        types that DO support ordering: `[T int | float64]`
        (or a named `Ordered` constraint).
    - match: "func Max[T comparable](a, b T) T {"
      explain: |-
        `comparable` covers `==` / `!=` only, NOT `<` / `>`. The
        function body uses `>`, which `comparable` doesn't
        guarantee. Use a type-set constraint listing the ordered
        types you care about: `[T int | float64]`.
    - match: "func Max<T int | float64>(a, b T) T {"
      explain: |-
        TS-style angle brackets. Go's generic syntax uses
        SQUARE brackets: `[T int | float64]`.
    - match: "func Max[T int, float64](a, b T) T {"
      explain: |-
        Wrong separator. Type-set members are joined with `|`
        (the union operator), not commas. Commas would declare
        TWO type parameters (T int and T float64).
expectStdout: |
  5
  2.1
runtime: yaegi
blanks: [line]
hints:
  - "Generic function shape: `func Name[T <constraint>](params) returns {`. The constraint is `int | float64` (type-set listing the ordered types). Receiver-free standalone function — no `(r T)` before the name."
  - "`func Max[T int | float64](a, b T) T {`."
  - "`func Max[T int | float64](a, b T) T {`."
notes: |
  Productive use of slot 3's type-set constraint syntax. The
  body uses `>`, which requires an ORDERED type — `any` and
  `comparable` are both too weak; the type-set listing the
  specific ordered types is the right level.

  Distractor bank covers the four most common mis-shapes:
    1. Over-permissive `any` — the body's operator demands more.
    2. Wrong-builtin `comparable` — covers equality not order.
    3. TS angle brackets — keyword leak.
    4. Comma separator — declares two params instead of a type
       set.

  Yaegi-verified — generics run cleanly per design-docs/30.
