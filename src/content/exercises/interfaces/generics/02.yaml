target: go
themeId: interfaces/generics
type: mcq
order: 2
prompt: |
  TypeScript lets you constrain a generic with `extends`:
  ```ts
  function index<T extends Equatable>(...) { ... }
  ```

  Go uses a different model — and it has a built-in constraint
  for "anything you can `==` against" that's load-bearing because
  it's the bare-minimum requirement for using a type as a map key
  or comparing values with `==`.

  Which Go built-in constraint covers "any type that supports
  `==` / `!=`"?
generator:
  kind: template
  vars:
    answer: ["comparable"]
  ts: |-
    // TS: function uniqueFirst<T>(xs: T[]): T { ... }
    // — TS doesn't formally distinguish "comparable" as a constraint
  canonical: ${answer}
  distractors:
    - "any"
    - "Equatable"
    - "==able"
hints:
  - "Built-in constraint, lowercase, ten letters. Required for `==` / `!=` comparisons inside the function body, and the bare-minimum requirement for using `T` as a map key."
  - "Same word the language uses to describe types you can compare. Lowercase."
  - "`comparable`."
runtime: none
notes: |
  THE built-in constraint that matters. `comparable` is the
  Go-specific name for "supports `==` / `!=`" — covers basic
  types (numbers, strings, bools, pointers, channels), arrays
  whose elements are comparable, and structs whose fields are
  all comparable. Does NOT cover slices, maps, or functions
  (which can't be compared with `==`).

  Distractors:
    1. `any` — too permissive. `any` is the no-restriction
       constraint; you can't `==` inside a function with `T any`.
    2. `Equatable` — TS-style name, doesn't exist in Go.
    3. `==able` — invented form. Go doesn't have a special
       comparison constraint syntax.
