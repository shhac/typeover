target: zig
themeId: zig/basics/numeric-primitives
type: mcq
order: 2
prompt: |
  In TypeScript, mixing `number` widths is invisible — they're
  all `number`. In Zig, the rule is more nuanced: SAFE
  widening (smaller → larger, same sign) is implicit; lossy
  conversions (narrowing, sign-changing in a way that could
  lose information) need an explicit `@intCast`. Pick the
  declaration that compiles AS-IS, no cast required.
generator:
  kind: template
  vars: {}
  ts: |-
    /* TS treats them all as `number` — every assignment compiles. */
  canonical: |-
    const small: u8 = 10;
    const big: u32 = small;
  distractors:
    - |-
      const big: u32 = 300;
      const small: u8 = big;
    - |-
      const big: i32 = -7;
      const small: i8 = big;
    - |-
      const signed: i32 = 42;
      const unsigned: u32 = signed;
hints:
  - "Two questions per line: (1) is the target type WIDER than the source (safe to widen)? (2) does the sign change in a way that could lose information? If both answers favor safety, no cast is needed."
  - "`u8 → u32` is wider and same sign — safe, implicit. The other three are narrowing OR sign-changing (where the source could exceed the target's representable range) — they need `@intCast` (drilled in exercise 03)."
  - "`const small: u8 = 10; const big: u32 = small;`"
runtime: none
notes: |
  Drill the "when do you NEED a cast" rule. Distractors are
  the three cases that DO require `@intCast`:
   - `u32 → u8` — narrowing.
   - `i32 → i8` — narrowing (with negative value, still
     fits — but compiler can't always prove that at the type
     level).
   - `i32 → u32` — sign change; compiler refuses when source
     is a non-comptime runtime value (note: at comptime with
     a known non-negative literal this CAN succeed; the
     distractor uses a runtime-feeling pattern).

  Per the M1 validator's C2 finding: previous canonical
  taught `@as(u32, small)` as if a cast were required for
  widening. Rewrote to teach the actual rule (implicit
  widening is allowed; narrowing and sign-flip need
  `@intCast`).
