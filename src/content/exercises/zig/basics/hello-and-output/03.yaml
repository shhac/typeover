target: zig
themeId: zig/basics/hello-and-output
type: mcq
order: 3
prompt: |
  Look at the canonical entry point: `pub fn main(init:
  std.process.Init) !void`. Why does the function take that
  `init` parameter? The Zig 0.16 runtime hands it in for a
  specific reason — pick the right one.
generator:
  kind: template
  vars: {}
  ts: |-
    /* TypeScript's entry point takes no runtime-capability
     * parameter; everything (console, fetch, fs) is implicitly
     * available. */
  canonical: |-
    /* `init` carries the runtime capabilities the program
     * needs to do I/O. Calls like `std.Io.File.stdout()`
     * return a handle, and methods on that handle take
     * `init.io` as their first argument — that's the I/O
     * capability the runtime grants. Without `init`, there's
     * no way to call into stdout, stderr, or the allocator. */
  distractors:
    - |-
      /* `init` is the program's command-line arguments
       * (equivalent to `process.argv` in Node). */
    - |-
      /* `init` marks the function as the program's entry
       * point — Zig wouldn't recognise `main` without it. */
    - |-
      /* `init` is a leftover from Zig's older async story
       * and will be removed in a future version. */
hints:
  - "Walk through how the canonical actually uses `init`: it appears once, as the first argument to `writeStreamingAll(init.io, ...)`. That's the clue — `init` carries something the I/O call needs."
  - "Methods on `std.Io.File.stdout()` need an I/O capability to do their work; `init.io` is that capability. The Zig 0.16 runtime hands it in via the entry-point's parameter."
  - "It carries the runtime capabilities (most notably `init.io`) that I/O calls need."
runtime: none
notes: |
  Recognition / synthesis exercise — the learner has already
  TYPED `init.io` (slot 06's fill-line) and now reasons about
  WHY it's there. Distractors model three real misconceptions:

   - `init` as command-line args — plausible if you map from
     `int main(int argc, char **argv)` in C or `process.argv`
     in Node, but argv lives elsewhere in Zig (and isn't part
     of the entry-point signature).
   - `init` as a magic entry-point marker — common reflex
     (decorators in TS, `@main` in Rust). Actually it's just a
     parameter; what makes `main` the entry point is the
     symbol name + `pub`.
   - `init` as legacy async — anchors a learner who's seen
     Zig 0.13's older API and assumes the new one is
     transitional. It isn't; `Init` is the 0.16+ shape.

  Replaces the previous slot 05 (recognition-after-production
  of the writeStreamingAll line — which was anti-progressive
  per the M1 validator).
