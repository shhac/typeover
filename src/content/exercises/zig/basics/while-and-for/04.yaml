target: zig
themeId: zig/basics/while-and-for
type: fill-word
order: 4
prompt: |
  Fill the missing keyword. The loop runs while the condition is
  true — same word as TypeScript and most C-family languages.
generator:
  kind: template
  vars:
    keyword:
      - "while"
  ts: |-
    while (i < 10) {
        i++;
    }
  canonical: |-
    ${keyword} (i < 10) {
        i += 1;
    }
  distractors:
    - "loop"
    - "until"
    - "for"
blanks: [keyword]
hints:
  - "Five letters, same as TypeScript / Java / C / C++."
  - "Starts with `w`."
  - "`while`"
runtime: none
notes: |
  Drill the `while` keyword. Distractors:
   - `loop` — Rust reflex (unconditional).
   - `until` — Ruby reflex (inverted condition).
   - `for` — wrong keyword for condition-driven loops.
