target: zig
themeId: zig/errors/panics-vs-errors
type: mcq
order: 3
prompt: |
  Sometimes you genuinely DO want to abort with a specific
  message — a startup-config check that hard-stops the program.
  TypeScript's `throw new Error("MSG"); process.exit(1);` is
  closest. Pick the Zig equivalent.
generator:
  kind: template
  vars: {}
  ts: |-
    throw new Error("invalid config");
    process.exit(1);
  canonical: |-
    @panic("invalid config");
  distractors:
    - "panic(\"invalid config\");"
    - "throw \"invalid config\";"
    - "std.process.exit(1);"
hints:
  - "Built-in function call: `@panic` (with the `@` builtin prefix) takes a single `[]const u8` message."
  - "Shape: `@panic(\"<message>\");`."
  - "`@panic(\"invalid config\");`"
runtime: none
notes: |
  Drill `@panic`. Distractors:
   - `panic(...)` — no `@` prefix; would look for a `panic`
     in scope and probably find a function from std but call
     it wrong.
   - `throw` — TS / Java reflex.
   - `std.process.exit(1)` — exits cleanly without a message
     or backtrace; wrong tool for an abort-with-context.
