target: zig
themeId: zig/errors/try-and-catch
type: mcq
order: 3
prompt: |
  When you need to RUN code on the error path (log it, print
  a message, take an alternate action) rather than just
  substitute a default, use `catch |err| { ... }` — the
  payload-capture form. Same pipe syntax as `if (x) |y|`
  from optionals. Pick the right shape for a handler that
  prints a message and returns from the caller.
generator:
  kind: template
  vars: {}
  ts: |-
    try {
        await maybe(-3);
    } catch (err) {
        log("oops");
        return;
    }
  canonical: |-
    _ = maybe(-3) catch |err| {
        log("oops");
        return;
    };
  distractors:
    - |-
      _ = maybe(-3) catch (err) {
          log("oops");
          return;
      };
    - |-
      _ = maybe(-3) catch err => {
          log("oops");
          return;
      };
    - |-
      try maybe(-3) catch |err| {
          log("oops");
          return;
      };
hints:
  - "Two syntactic pieces: `catch |err|` (payload-capture pipes around the binding name) followed by a block `{ ... }` that runs on the error path. The leading `_ =` discards the success value (no fallback needed)."
  - "Shape: `_ = <call> catch |<binding>| { <handler-body> };`."
  - "`_ = maybe(-3) catch |err| { log(\"oops\"); return; };`"
runtime: none
notes: |
  Drill the statement-form `catch |err| { ... }` handler.
  Distractors:
   - `catch (err)` — parens are TS; Zig uses pipes `|err|`.
   - `catch err =>` — match-arrow; not Zig syntax.
   - `try ... catch |err|` — `try` would propagate the error
     out of the caller BEFORE the catch fires. Either `try`
     (let the caller deal) OR `catch` (deal here), not both.

  This is the shape `try-and-catch/09` (freeform) uses. The
  expression-form `catch |err| blk: { ... }` (a labelled
  block that evaluates to a value) is a more advanced
  variant that doesn't appear elsewhere in Module 4.
