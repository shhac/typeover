target: zig
themeId: zig/errors/error-sets
type: mcq
order: 2
prompt: |
  Once you've declared an error set, you raise a value from it
  with `error.<Variant>`. Pick the right return statement for a
  function that hits the empty-input case.
generator:
  kind: template
  vars: {}
  ts: |-
    if (s.length === 0) throw new EmptyError();
  canonical: |-
    if (s.len == 0) return error.Empty;
  distractors:
    - "if (s.len == 0) return ParseError.Empty;"
    - "if (s.len == 0) throw error.Empty;"
    - "if (s.len == 0) return .Empty;"
hints:
  - "Two pieces: `return error.<Variant>;`. The `error.` prefix is the canonical raise form — the compiler resolves the set from the function's return type."
  - "Shape: `return error.<Variant>;`. `ParseError.Empty` also works (qualified form) but `error.Empty` is the form you'll see everywhere in the stdlib."
  - "`return error.Empty;`"
runtime: none
notes: |
  Drill `error.Empty`. Distractors:
   - `ParseError.Empty` — also legal in Zig 0.16 (qualified
     form), but less idiomatic. The `error.<Variant>` prefix
     is the form the langref + stdlib use; the compiler
     resolves which set's variant this is from return-type
     context.
   - `throw` — TS / Java reflex; Zig has no `throw`.
   - `.Empty` (leading-dot shorthand) — works for enum
     variants but not for error variants in a `return`.
