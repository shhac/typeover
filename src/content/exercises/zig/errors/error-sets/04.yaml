target: zig
themeId: zig/errors/error-sets
type: fill-word
order: 4
prompt: |
  Fill the missing keyword that introduces an error-set type
  expression. Five letters, lowercase.
generator:
  kind: template
  vars:
    keyword:
      - "error"
  ts: |-
    type ParseError = "Empty" | "BadDigit";
  canonical: |-
    const ParseError = ${keyword}{ Empty, BadDigit };
  distractors:
    - "enum"
    - "errors"
    - "fail"
blanks: [keyword]
hints:
  - "Five letters, singular (not plural), lowercase."
  - "Same word you'd say to describe one of these things."
  - "`error`"
runtime: none
notes: |
  Drill the `error` keyword. Distractors:
   - `enum` — Zig keyword, wrong context.
   - `errors` — plural; the keyword is singular.
   - `fail` — invented.
