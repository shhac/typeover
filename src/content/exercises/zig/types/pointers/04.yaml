target: zig
themeId: zig/types/pointers
type: fill-word
order: 4
prompt: |
  Fill the missing single character that takes the address of
  `x`. Same character C / C++ use for the same purpose.
generator:
  kind: template
  vars:
    op:
      - "&"
  ts: |-
    double({ value: x });
  canonical: |-
    double(${op}x);
  distractors:
    - "*"
    - "@"
    - "#"
blanks: [op]
hints:
  - "One character, same as C / C++ for taking an address."
  - "Single character, prefix operator — sits at the same position as `!` in `!x` (boolean negation) or `-` in `-y` (unary minus)."
  - "`&`"
runtime: none
notes: |
  Drill the `&` operator. Distractors:
   - `*` — derefs an existing pointer, opposite operation.
   - `@` — builtin prefix; not used for address-of.
   - `#` — not a Zig operator.
