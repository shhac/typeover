target: zig
themeId: zig/types/arrays-vs-slices
type: fill-line
order: 7
prompt: |
  Type the missing Zig line — pass `arr[0..]` (the whole array
  as a slice) to the function `sum`. With the right call, the
  program prints `6` (1 + 2 + 3) followed by a newline.
generator:
  kind: template
  vars:
    line:
      - "const total = sum(arr[0..]);"
  ts: |-
    const arr: number[] = [1, 2, 3];
    const total = sum(arr);
  canonical: |-
    const std = @import("std");

    fn sum(s: []const i32) i32 {
        var total: i32 = 0;
        for (s) |v| { total += v; }
        return total;
    }

    pub fn main(init: std.process.Init) !void {
        const arr: [3]i32 = .{ 1, 2, 3 };
        ${line}
        var buf: [16]u8 = undefined;
        const printed = try std.fmt.bufPrint(&buf, "{d}\n", .{total});
        try std.Io.File.stdout().writeStreamingAll(init.io, printed);
    }
  distractors:
    - match: "const total = sum(arr);"
      explain: |-
        `arr` is a `[3]i32` — fixed-length array. `sum` expects
        `[]const i32` — a slice. Slice the whole array with
        `arr[0..]`.
    - match: "const total = sum(arr.toSlice());"
      explain: |-
        `.toSlice()` isn't a Zig method. Use the slicing
        operator `arr[0..]`.
    - match: "const total = sum(arr[0..3]);"
      explain: |-
        Works mechanically (start=0, end=3 explicit) but the
        idiomatic shortcut is `arr[0..]` — omit the end to
        mean "to the array's length."
expectStdout: |
  6
runtime: zig
blanks: [line]
hints:
  - "Three pieces: `const total =`, then `sum(arr[0..]);`. The `[0..]` builds a slice from the whole array."
  - "Shape: `<fn>(<array>[0..])` to pass a fixed-length array as a slice."
  - "`const total = sum(arr[0..]);`"
notes: |
  Drill the slice-from-array idiom in a runnable context. The
  function takes `[]const i32` — read-only slice; `sum` doesn't
  need to mutate.
