target: zig
themeId: zig/types/arrays-vs-slices
type: mcq
order: 1
prompt: |
  TypeScript writes `const arr: number[] = [10, 20, 30];`. Zig
  has two shapes for fixed-length array initialization: the
  TYPE-PREFIX form (`[3]i32{ ... }` — type-name first, then
  the initializer) and the annotation-with-anonymous-literal
  form (exercise 06's `const arr: [3]i32 = .{ ... };`). The
  type-prefix form works WITHOUT a binding-side annotation —
  useful when passing an array directly to a function or
  storing it as a struct field. Pick the type-prefix shape.
generator:
  kind: template
  vars: {}
  ts: |-
    const arr: number[] = [10, 20, 30];
  canonical: |-
    const arr = [3]i32{ 10, 20, 30 };
  distractors:
    - "const arr = [3]i32 .{ 10, 20, 30 };"
    - "const arr = [3, i32]{ 10, 20, 30 };"
    - "const arr = []i32{ 10, 20, 30 };"
hints:
  - "Three pieces: `const arr =` (no binding-side annotation), `[3]i32` (the type, count first), then `{ ... }` directly (no dot, no comma, no slice marker `[]`)."
  - "Shape: `[<count>]<elementType>{ <e1>, <e2>, ... }`."
  - "`const arr = [3]i32{ 10, 20, 30 };`"
runtime: none
notes: |
  First arrays-vs-slices exercise. Teaches the type-prefix
  initialization form `[N]T{ ... }` — slot 06 (fill-line)
  then drills the annotation-with-anonymous-literal form
  (`const arr: [N]T = .{ ... };`) which is the same shape
  with the type annotation moved to the binding.

  Distractors model three real shape mistakes:
   - `[3]i32 .{ ... }` — extra `.` (mixing type-prefix and
     anonymous-literal syntax).
   - `[3, i32]{ ... }` — comma between count and element
     type (tuple reflex).
   - `[]i32{ ... }` — SLICE type instead of fixed array;
     would need a slice initializer, not array fields.

  Probed against the playground compiler: the canonical
  compiles cleanly and indexing `arr[2]` returns `30`. Fixed
  per M2 validator's C8 finding (slots 01 and 06 previously
  drilled the same form).
